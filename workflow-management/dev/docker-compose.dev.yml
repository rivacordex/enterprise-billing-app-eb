# rm04-spec Implementation §7 / D9 — local dev stack. Run TOGETHER with the
# app's own dev stack, as a second -f file so both land in ONE Compose
# project (same default network, same `db` service/container — the "SAME
# postgres container provides the billing DB and the kestra DB" requirement;
# the kestra database/role are rm03a's local provisioning, done by the
# kestra-setup service below, not created here):
#
#   docker compose -f docker-compose.dev.yml -f workflow-management/dev/docker-compose.dev.yml up
#
# Because Compose resolves relative paths against the FIRST -f file's
# directory (the repo root) when multiple files are combined, every
# build/volume path below is written relative to the repo root, not to this
# file's own directory.
#
# Azurite stands in for Azure Blob — ONLY for Kestra's own internal storage
# (code-standards §3.4 forbids the container filesystem for that, with no
# local carve-out). landing/archive/error/logs are plain bind-mounted host
# directories in local dev (rm09 owns the real cross-protocol archive move;
# rm04 only makes the four locations exist and D9 keeps local dev simple).
#
# The SAME worker image built from workflow-management/worker/workflow-engine/Dockerfile runs here
# as it does on ACA — the process runner (no Docker task runner available
# there either, so this stack deliberately never gives it one). Never mount
# the Docker socket: a local Docker runner would let a developer write flows
# that cannot run on ACA, actively misleading them (D9).

services:
  # One-shot: creates the local `kestra` database + `kestra_engine` role
  # (rm03a, mirroring the deployed provisioning order) and sets a LOCAL-ONLY
  # dev password — never the pattern used in a real environment (see
  # infra/docs/db-role-verification.md for the manual, never-committed
  # production step).
  kestra-setup:
    image: node:22-alpine
    working_dir: /app
    environment:
      # Local dev connects as the `postgres` superuser for every bootstrap
      # step (mirrors the root stack's `setup` service) — role-scoped access
      # is exercised only by the integration-test Postgres, never dev
      # (repo memory: local-docker-dev-stack).
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_billing
      NODE_OPTIONS: --conditions=react-server
    env_file:
      - ./workflow-management/dev/.env.example
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
             npm run db:bootstrap-kestra-roles &&
             node workflow-management/dev/set-kestra-role-password.mjs"
    restart: "no"

  # Blob emulator for Kestra's internal storage ONLY (kestra-internal
  # container). devstoreaccount1 is Azurite's published well-known emulator
  # account — not a secret, safe to commit (workflow-management/dev/.env.example).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data

  # The shared workflow engine (wfm01) — same image, same process runner, same
  # kestra.yml as the deployed Container App; hosts BOTH the `rating` and
  # `billrun` namespaces (flows deployed by the flow-deploy one-shot below).
  workflow-engine:
    build:
      context: ./workflow-management/worker/workflow-engine
    env_file:
      - ./workflow-management/dev/.env.example
    environment:
      KESTRA_DATASOURCES_POSTGRES_URL: jdbc:postgresql://db:5432/kestra
      KESTRA_DATASOURCES_POSTGRES_USERNAME: kestra_engine
      # KESTRA_DATASOURCES_POSTGRES_PASSWORD comes from env_file (.env.example)
      # — the SAME source kestra-setup uses to set the role password, so the
      # two can never diverge. Deliberately NOT set here: an `environment:`
      # entry would shadow the env_file value and reintroduce that split.
      # D6 — a local sentinel, never a real digest/tag.
      RATING_ENGINE_VERSION: dev-local
      # kestra.yml is shared with the deployed Container App and deliberately
      # omits storage.azure.connectionString there (Azurite-only credential;
      # see kestra.yml's comment). KESTRA_CONFIGURATION is Kestra's documented
      # Docker override env var — a YAML string layered on top of the
      # `--config` file — used here to set connectionString for local dev
      # ONLY, without touching the shared file. `$$` escapes Compose's own
      # `${...}` interpolation so the literal placeholder reaches the
      # container, where Micronaut resolves it against the SAME
      # env_file-sourced WORKFLOW_ENGINE_AZURE_CONNECTION_STRING used elsewhere
      # (never duplicated as a second literal, to avoid the split-source
      # problem noted on kestra-setup above).
      KESTRA_CONFIGURATION: |
        kestra:
          storage:
            azure:
              connectionString: $${WORKFLOW_ENGINE_AZURE_CONNECTION_STRING}
    volumes:
      - ./workflow-management/kestra/kestra.yml:/app/kestra.yml:ro
      - ./workflow-management/dev/landing:/data/landing
      - ./workflow-management/dev/archive:/data/archive
      - ./workflow-management/dev/error:/data/error
      - ./workflow-management/dev/logs:/data/logs
      # Deliberately NOT present: "- /var/run/docker.sock:/var/run/docker.sock" (D9).
    ports:
      - "${RATING_ENGINE_PORT:-8085}:8080"
    depends_on:
      db:
        condition: service_healthy
      kestra-setup:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    command: ["server", "standalone", "--config", "/app/kestra.yml"]
    healthcheck:
      # Port 8080 (webserver/UI) accepting connections = Kestra has finished its
      # startup DB migrations and is serving. bash /dev/tcp needs no extra tool
      # (the Ubuntu-based Kestra image ships bash). start_period covers boot +
      # migrations so the flow-deploy one-shot below doesn't fire too early.
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/8080' 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # wfm01 §7b — one-shot stand-up flow bootstrap. Once the engine is healthy,
  # deploy EVERY function's flows to its namespace, idempotently, using the SAME
  # pinned Kestra image as its CLI (mirrors the CI deploy_workflow_flows stage).
  # `up` then ends with rating flows under `rating` and the bill-run placeholder
  # flow shells under `billrun` in the UI. `--no-delete` keeps re-runs additive
  # (upsert, no duplication). `$$` escapes Compose's own interpolation so the
  # shell vars resolve inside the container.
  #
  # The CLI binary is /app/kestra and is NOT on PATH — the image's default
  # entrypoint (`exec /app/kestra "$@"`) is what normally resolves it, and this
  # service overrides the entrypoint to run a bash loop, so it must call the
  # binary by full path. `kestra ...` (bare) would be `command not found`.
  #
  # `dir:namespace` map: rating flows are REAL and live at the function root;
  # each bill-run function's deployable flow is the placeholder shell under
  # `local-dev/` (the `*.template.yml` at the bill-run function root is a
  # NON-deployable contract doc whose tasks omit `type:`, and `kestra flow`
  # does not recurse into subdirectories — so the target must be `.../local-dev`).
  flow-deploy:
    image: kestra/kestra:v1.3.35@sha256:0b880e20e403ef635a6bc7e9e72786c7a6dde143858723449dc57500830868e2
    env_file:
      - ./workflow-management/dev/.env.example
    volumes:
      - ./workflow-management/flows:/flows:ro
    depends_on:
      workflow-engine:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        SERVER="http://workflow-engine:8080"
        CRED="$${KESTRA_SERVER_BASIC_AUTH_USERNAME}:$${KESTRA_SERVER_BASIC_AUTH_PASSWORD}"
        for pair in "rating-engine:rating" "bill-run-processor/local-dev:billrun" "bill-run-distributor/local-dev:billrun"; do
          dir="$${pair%%:*}"; ns="$${pair##*:}"
          echo "Deploying /flows/$$dir -> namespace $$ns"
          /app/kestra flow namespace update "$$ns" "/flows/$$dir" --no-delete --server "$$SERVER" --user "$$CRED"
        done
    restart: "no"

volumes:
  azurite_data:
