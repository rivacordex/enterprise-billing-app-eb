# Reporting_dnb_settlement_invoice_<ts>.csv — Finance / billing ops (collections
# follow-up and month-end reconciliation). Changing this file changes what
# Finance / billing ops receive: agree it with them first (rptmgmt-architecture
# Inv 9). One row per reported invoice, sorted by mno_id, then invoice_id
# (plan §A.1, rpt03 D3). Written by runtime/reporting/settlement_invoice.
id: settlement_invoice
file: Reporting_dnb_settlement_invoice_<ts>.csv
header: true
columns:
  - name: mno_id
    type: text
    required: true
    # decision: SR17; source party_role.party_role_specification->>'mnoPublicKey1'
    # via customer_bill.ref_billing_account_id -> billing_account.ref_party_role_id
  - name: invoice_entry_date
    type: date
    required: true
    # decision: SR3; source the INV document's posted_at as an Asia/Kuala_Lumpur
    # day (the PDF's Invoice Date), never document.entry_date
  - name: invoice_id
    type: text
    required: true
    # decision: SR2; source customer_bill.ref_inv_document_id (the INV document id)
  - name: invoice_amount
    type: amount
    required: true
    # decision: SR4; source the INV document's total_amount (tax-inclusive)
  - name: invoice_due_date
    type: date
    required: true
    # decision: SR4; source customer_bill.payment_due_date
  - name: invoice_open_amount
    type: amount
    required: true
    # decision: SR19, SR20; invoice_amount minus the payment_amount of this
    # invoice's invoice-linked rows in the payment report of the same run
