# rpt02-spec D6 — the output check (SR30, SR34, RF3). Each report calls it once
# per file, between `generate` and `publish` (code-standards §3.2); nothing is
# published or delivered if it fails (Inv 5). Checks the file against its
# column definition, contracts/<contract>.yaml — a namespace file deployed
# from flows/reporting/contracts/ (D8):
#   - clean: SUCCESS, output `rows` (data rows);
#   - violations: FAILED, one ERROR `OUTPUT_CONTRACT_VIOLATION <file> <row>
#     <column> <reason>` per violation (at most 50, then `… <n> more`);
#   - unreadable or invalid contract: FAILED `CONTRACT_INVALID <id> <reason>`.
# <file> is the optional `name` input, else the FILE URI's last segment — a
# task's output file has a storage prefix there (`<id>-<name>`), so a report
# passes the generated file's name (rpt03).
# Calling pattern: flows/reporting/README.md, Output check.
#
# Inputs reach the shell as env vars, never interpolated into the command.
#
# Never edit this flow in the Kestra UI — deployed from git (SR41).
id: report-validate-output
namespace: reporting
description: Reporting output check (shared subflow)

inputs:
  - id: file
    type: FILE
  # The contract id: the file name under contracts/ without .yaml.
  - id: contract
    type: STRING
  # The file name the log lines show (rpt03); optional, so a caller passing an
  # uploaded file (whose URI keeps its name) needn't.
  - id: name
    type: STRING
    required: false

tasks:
  - id: check
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process # ACA has no Docker daemon
    namespaceFiles:
      enabled: true
      include:
        - contracts/**
    inputFiles:
      output.csv: "{{ inputs.file }}"
    env:
      CONTRACT: "{{ inputs.contract }}"
      # The file's name, or the kestra:// URI; the runtime logs its last
      # segment as <file>.
      FILE_URI: "{{ inputs.name ?? inputs.file }}"
    commands:
      - >
        python3 -m runtime.reporting.validate output
        --contract="contracts/$CONTRACT.yaml" --file=output.csv --name="$FILE_URI"

outputs:
  - id: rows
    type: INT
    value: "{{ outputs.check.vars.rows }}"
