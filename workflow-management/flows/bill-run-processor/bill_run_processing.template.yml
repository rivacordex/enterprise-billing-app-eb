# CONTRACT DOC ONLY — non-deployable (tasks omit `type:`, so `kestra flow` never
# ingests it). The deployed bill_run_processing flow is the repo's sibling
# `local-dev/bill_run_processing.yml` (bm38 — there is NO separate
# workflow-management flow repo): `deploy_workflow_flows` pushes
# `bill-run-processor/local-dev` to the `billrun` namespace on the shared
# (collapsed-topology) workflow-engine. This skeleton documents (a) the stage
# contract the app records against and (b) the key activities each stage must
# perform. Not-yet-built activities are a `# STUB:` marker naming what replaces
# them; the `validation` + `collection` stages carry `# REAL (bm27):` contract
# text, `aggregation` carries `# REAL (bm28):` (the real USAGE aggregation into
# customer_bill_line) plus `# REAL (bm29):` (the RECURRING price resolver + its
# D33 HARD-fail branch), and `verification` carries `# REAL (bm30):` (SOFT
# non-positive-total sanity + the HARD USAGE bill↔charge reconciliation) — the
# real SQL lives in the `local-dev` flow. The SIGNAL-BACK is `# REAL (bm36):` —
# the per-stage
# `DONE` POSTs, the per-account HARD `FAILED` POST, and the run-level terminal
# `PROCESSING_FAILED` (`errors`/`finally`) are real `core.http.Request` callbacks
# (at parity with the distributor, bm34). `aggregation` also carries
# `# REAL (bm42):` — Target Capacity Pricing's commitment floor + N-band
# motivation discount as inline SQL CTEs, inside the SAME transaction, plus the
# six account-level HARD `CAPACITY_*` guards — and `verification` carries
# `# REAL (bm43):` — the rated_amount replay, the capacity-line replay +
# internal identities, the independent Model-2 cross-derivation, and the
# `capacity_rate_matching` gate (which also threads into bm42's G2 guard in
# `aggregation`, the one cross-step edit). `aggregation` also carries
# `# REAL (bm45):` — the per-polygon invoice usage appendix snapshot, joined
# off `rating.udr_rated`'s claimed capacity volume to the `productCardLookUp`
# ratecard via the D2 canonical-key reconstruction, written onto the SAME
# `additional_info` the bm42 calc trace already carries (no new column). The
# only remaining `# STUB:` is the taxation compute. See ./README.md.
id: bill_run_processing
namespace: billrun
inputs:
  - { id: bill_run_id, type: STRING }
  - { id: period_start, type: STRING } # YYYY-MM-DD
  - { id: period_end, type: STRING }
  - { id: ban_ids, type: JSON } # accounts scoped app-side at trigger (bm03)
  - { id: attempt, type: INT } # app-assigned; the idempotency key component
  - { id: gl_event_at, type: STRING }
  # bm42: the single-band production guard (default 1). The capacity SQL is
  # N-band; raising this enables multi-step motivation later as a config
  # change, never a pricing-SQL edit (TC52).
  - { id: capacity_max_bands, type: INT }
  # bm43: the capacity rate-match gate (default true). Governs BOTH G2
  # (aggregation, bm42) and the Model-2 cross-derivation (verification,
  # bm43): ON HARD-fails a rate disagreement naming both rates and both
  # version sources; OFF downgrades to a WARN, bills Model 1 anyway, and
  # logs the relaxed state per account (Inv #29/#30, TC51).
  - { id: capacity_rate_matching, type: BOOLEAN }
tasks:
  - id: per_account
    type: io.kestra.plugin.core.flow.ForEach # fan-out per account (Inv: per account, per stage)
    values: "{{ inputs.ban_ids }}"
    # REAL (bm36) — SIGNAL-BACK contract. The account's stage sequence is wrapped
    # in a Sequential (allowFailure) so a HARD stage failure is contained to this
    # account and siblings keep processing. After EACH stage's real work, a
    # `core.http.Request` POSTs a record-only stage-complete `DONE` to
    # POST /api/billrun/{runId}/stage/{stage}/complete
    #   body { ban_id, attempt, status: "DONE" } (verification may add
    #   error_class: "SOFT" + error_code/error_detail for a SOFT finding),
    # Bearer BILLRUN_APP_TOKEN, retry PT5S×2, allowFailure (a lost callback must
    # not crash a run — the reconcile/stall gate is the backstop). The terminal
    # `verification` DONE is what flips the account to PROCESSED. On a HARD stage
    # failure the wrapper's `errors` handler POSTs a stage-complete FAILED for
    # (ban, failing-stage) with error_class: "HARD", error_code, error_detail —
    # the account recomputes to PROCESSING_FAILED. A stale-attempt straggler is a
    # receiver-side no-op (the `attempt` echoed on every body).
    tasks:
      # --- validation (folded into the shared correlation — bm27) ---
      - id: validation
        # REAL (bm27): assert against the SHARED correlated set (Inv #24) — the
        #   ONE set-based subscriber->account resolution Collection computes,
        #   following rl.py's _CURRENCY_SQL join (udr_subscription_ref_id ->
        #   inventory.product_inventory.product_inventory_id ->
        #   product_inventory.billing_account_id -> billing_account.currency).
        #   Validation never re-runs that join (heaviest in the pipeline, Inv #24).
        #   - Currency: a correlated row with udr_currency <> account_currency ->
        #     signal FAILED, HARD finding CURRENCY_MISMATCH (the _CURRENCY_SQL check).
        #   - Window coverage: a correlated row whose start_datetime is outside
        #     [period_start, period_end] -> HARD finding WINDOW_COVERAGE.
        #   - Zero-claimable: NO correlated rows for the account -> signal DONE
        #     (a zero-charge exception, NOT an error); Collection claims nothing,
        #     Aggregation writes no usage line (recurring may still bill it, bm29).
        #   On done: POST the record-only stage-complete signal (§4) — no charge payload.
      # --- collection / claim (writes rating.udr_rated as billrun_runtime) ---
      - id: collection
        # REAL (bm27): compute the correlation ONCE (set-based, per run, Inv #24)
        #   and claim the resolved in-scope rows. UPDATE status = 'BILL_DRAFT'
        #   from status = 'RATED' ONLY (post bm24/bm25: reject/cancel/rerun RELEASE
        #   to RATED, and billrun_status_guard now permits only RATED -> BILL_DRAFT;
        #   the stub's old ('RATED','REJECTED') is dropped) + stamp the six claim
        #   cols: status, billrun_ref_id (the run), billrun_ban_id (THE ACCOUNT
        #   COLLECTION JUST RESOLVED — NULL until now, bm26), billrun_attempt
        #   (inputs.attempt, re-stamped so posting's (run,ban,posted_attempt) read
        #   matches, T6), billrun_checksum, upsert_datetime. Whole-account, ONE
        #   statement, never per-record. The flow is the SOLE re-claimer — the app
        #   NEVER claims — it only sets BILL_APPROVED/RATED-release (bm17/bm24).
        #   D32/Inv #25: a row whose udr_subscription_ref_id resolves to no
        #   product_inventory (or to an out-of-scope account) is NOT in `correlated`,
        #   so it is left at RATED, unclaimed and UNTOUCHED — never filtered out
        #   silently, never failing the account (it becomes bm32's orphan surface).
      # --- aggregation (writes billing.customer_bill + customer_bill_line as billrun_runtime) ---
      - id: aggregation
        # REAL (bm28): group the account's claimed BILL_DRAFT usage into
        #   billing.customer_bill_line at (product_offering_id, udr_type) grain,
        #   ROLLED UP ACROSS SUBSCRIPTIONS (Inv #3) — product_offering_id is the
        #   denormalized column on inventory.product_inventory
        #   (udr_subscription_ref_id -> product_inventory.product_offering_id), so an
        #   account with 3 subscriptions of one offering and 500 of another shows
        #   2 charge lines, NOT 503. Each line stores udr_count (rows rolled in) +
        #   the grouping_key, gross/net = SUM(udr_rated_price), quantity =
        #   SUM(udr_usage_quantity), currency = the account's usage currency, and
        #   line_type='charge', source='USAGE'. discount_amount = '0.00' this phase
        #   (no discount computed), so net_amount = gross_amount.
        #   - line_no is DETERMINISTIC (Inv #21): row_number() OVER (ORDER BY
        #     grouping_key), NEVER insertion order — a rerun reproduces identical
        #     line_no values (the checksum ordering anchor bm31 + reconciliation
        #     replay bm30 both depend on this).
        #   - customer_bill.subtotal = SUM(customer_bill_line.net_amount) (Inv #3);
        #     tax_total='0.00'/total_amount=subtotal this phase (Taxation SQL-
        #     recomputes tax_total/total_amount from subtotal, no unit).
        #   - WHOLE-ACCOUNT REPLACE (Inv #16, D22): re-derive via
        #     billing.billrun_delete_trial_bill(run,ban) (scoped SECURITY DEFINER —
        #     bm14 T10; lines cascade via ON DELETE CASCADE, bm23) + re-INSERT the
        #     customer_bill header + its lines. NEVER an ON CONFLICT DO UPDATE and
        #     NEVER a bare DELETE against customer_bill_line (billrun_runtime holds
        #     no table DELETE on it — the guardrail asserts this).
        #   - Money is summed in SQL (numeric), never JS float.
        # [pm46a, 2026-10-10 — this skeleton is NOT kept in step with the deployed
        #   flow (local-dev/bill_run_processing.yml), which is authoritative.
        #   Superseded below: the product lane now splits on the envelope priceType,
        #   the recurring resolver reads the recurring flat_fee lane only, and
        #   RECURRING_PRICE_UNSUPPORTED is RETIRED.]
        # REAL (bm29): AFTER the USAGE rollup, in the SAME whole-account-replace
        #   transaction, resolve each subscription's RECURRING charge and write one
        #   RECURRING line per (product_offering_id) (udr_type NULL), rolled ACROSS
        #   the account's subscriptions of that offering. subtotal = SUM(net_amount)
        #   now spans BOTH sources; line_no is a single deterministic sequence over
        #   the shared grouping_key across USAGE + RECURRING (Inv #21).
        #   - Applies ONLY to a subscription whose offering INTENDS a recurring
        #     charge (a component_type='flat_fee' product_offering_price row whose
        #     envelope price_component->>'priceType' = 'recurring' exists, or an
        #     order_item_price_override). A USAGE-ONLY subscription (offering with
        #     neither) yields NO recurring line and does NOT fail — recurring is not
        #     mandatory (Inv #22: a usage-only account still bills its usage).
        #   - As-of resolution (Inv #20 / D19, pm52): resolve
        #     product.product_offering_price WHERE component_type='flat_fee' as-of
        #     the run period via the lead(start_date_time) OVER (PARTITION BY
        #     offering, component_type, unit_of_measure ORDER BY start_date_time)
        #     [eff_from, eff_to) window. The window is the LANE, not the envelope
        #     priceType: a flat_fee 'oneTime' row and a flat_fee 'recurring' row
        #     share one uniqueness lane (unit_of_measure NULL for both, pm46), so a
        #     priceType-filtered window would silently resolve an older, superseded
        #     recurring price behind a later oneTime row in the same lane — the
        #     masking hazard the pre-reshape 'tiered' filtering comment used to warn
        #     about, carried forward onto the new discriminator. The resolved row's
        #     envelope priceType is carried OUT of the window and tested by D33
        #     below, never filtered for inside it. COALESCE an
        #     ordering.order_item_price_override (price_type='recurring', keyed by
        #     product_order_item_id — this ordering-side column is untouched by
        #     pm52) over the catalog amount (read from
        #     price_component#>>'{params,amount}'). Map
        #     recurring_charge_period_length/_type onto the account's bill-cycle
        #     frequency, then multiply by product_inventory.quantity (>= 1).
        #   - Price snapshot, read-not-re-resolved on rerun (Inv #20/D19): each
        #     RECURRING line stores its snapshot (snapshot_price_ref/_unit_price/
        #     _quantity/_effective_date, bm23). The resolver READS any existing
        #     RECURRING line for the account BEFORE the whole-account replace
        #     deletes it and REUSES it verbatim; as-of resolution runs ONLY where no
        #     prior line exists (first derivation, or a reject that dropped the
        #     bill). So a rerun after a backdated product_offering_price insert
        #     reproduces the ORIGINAL amounts — the lead() window is never re-walked
        #     for an already-reviewed period. ordering overrides are insert-only and
        #     are NOT the hazard.
        #   - D33 HARD-fail (Inv #28): a subscription whose offering INTENDS a
        #     recurring charge but has NO as-of price (and no prior snapshot), whose
        #     resolved as-of flat_fee's envelope priceType is 'oneTime' with no
        #     override (RECURRING_PRICE_UNSUPPORTED, pm52/D4 — the structural
        #     successor of the old "as-of price is a shape this resolver cannot
        #     rate" arm: the offering's current flat fee is not a recurring charge,
        #     and the lane's older recurring price must never be silently billed
        #     instead), or a price in a currency other than the account's
        #     (RECURRING_CURRENCY_MISMATCH — the recurring analog of bm27's USAGE
        #     currency assertion), sends THIS account only to PROCESSING_FAILED
        #     with a HARD finding and error_code RECURRING_PRICE_NOT_FOUND /
        #     _UNSUPPORTED / RECURRING_CURRENCY_MISMATCH — the transaction rolls
        #     back, so NO bill (not even the USAGE lines) is produced for it. Never
        #     substitute zero, never skip a subscription silently. Every other
        #     account stays billable; fixing the catalog + a rerun re-derives it.
        #   - The capacity components (usage_rate, capacity_commitment,
        #     capacity_motivation) are excluded by the component_type='flat_fee'
        #     filter and cannot be seen by THIS lane's lead() partition — the
        #     RECURRING resolver never resolves them. They are priced by the
        #     SEPARATE capacity resolution below (REAL bm42), in its own
        #     (offering, unit)-partitioned as-of window over the SAME three
        #     component types this comment excludes from the recurring lane.
        # REAL (bm42): Target Capacity Pricing — commitment floor + N-band
        #   motivation discount, computed in the SAME per-account
        #   whole-account-replace transaction, inline SQL only (no DB function,
        #   no Python task — Inv #29). A capacity offering is detected by its
        #   COMPONENTS, never a column (Inv #32): the union of this account's
        #   ACTIVE offerings carrying a capacity_commitment and/or
        #   capacity_motivation component, resolved off the subscription's
        #   PINNED offering version (Inv #31) via the same as-of lead() window
        #   pattern as the recurring resolver above, partitioned by (offering,
        #   component_type, unit_of_measure) and pruned to the account's ACTIVE
        #   offerings. base_rate is the same-offering, same-unit usage_rate
        #   component (joined on unit_of_measure — no price-id pointer, TC32).
        #   - Six HARD guards, account-level (Inv #32), each rolling the whole
        #     transaction back (no bill for this account; siblings keep
        #     billing): CAPACITY_MULTIPLE_SUBSCRIPTIONS (>1 ACTIVE subscription
        #     of the offering), CAPACITY_BASE_RATE_NOT_FOUND (no same-unit
        #     usage_rate), CAPACITY_UDR_TYPE_MISMATCH (a claimed row's udr_type
        #     != the offering's spec udrType), CAPACITY_RATE_MISMATCH (G2 — a
        #     claimed row's udr_usage_rate/udr_price_ref IS DISTINCT FROM the
        #     resolved base_rate/base_price_ref — IS DISTINCT FROM, not <>, so a
        #     NULL rate/non-PER_UNIT row counts, TC35), CAPACITY_MULTI_STEP_UNSUPPORTED
        #     (a motivation schedule's band count exceeds the capacity_max_bands
        #     input), CAPACITY_CURRENCY_MISMATCH (G3 — the resolved component
        #     currency != the account currency). REAL (bm43): G2 is GATE-AWARE —
        #     the `capacity_rate_matching` input (default ON) governs it: ON
        #     raises exactly as shipped; OFF downgrades to a WARN (logged) and
        #     lets the account proceed so verification's own Model-2 gate
        #     decision is reachable (the one cross-step edit bm43 makes outside
        #     `verification`).
        #   - The capacity line is ONE per (offering, unit_of_measure)
        #     (grouping_key `<offering>:CAPACITY:<unit>`), generated from the
        #     ACTIVE subscription even at ZERO usage (Inv #33 — the commitment
        #     floor exists for exactly that case), and excluded from the
        #     ordinary USAGE rollup above (an anti-join on matching
        #     offering+unit+udrType) so the same volume is never double-counted;
        #     the offering's usage in a DIFFERENT unit stays an ordinary USAGE
        #     line. `quantity` on the line is the ACTUAL metered usage Q
        #     (O-TC2) — the floored/billed figure is a derived construct kept in
        #     `additional_info.calc`, never the stored quantity.
        #   - Model 1 is billed (Inv #29): `rated_amount = Σ udr_rated_price`
        #     (the account's claimed rows in the capacity volume); `topUp =
        #     round(max(target - Q, 0) * base_rate, 2)` (0 when no commitment
        #     component, TC36); the motivation discount is the N-band generic
        #     sum of `round(bandQty * (base_rate - stepRate), 2)` over `steps`
        #     (0 when no motivation component, TC36 — commitment-only and
        #     motivation-only offerings are both first-class); `gross =
        #     rated_amount + topUp`; `net = gross - discount`. Each monetary
        #     component is rounded ONCE (2dp HALF_UP); gross/net are DERIVED
        #     from the rounded parts and never re-rounded (Inv #34), so the
        #     identities hold with no ±0.01 tolerance on integer anchors (a
        #     fractional-usage fixture accepts a ≤1¢ drift, TC40).
        #     `discount_amount_raw` keeps the unrounded discount (scale 6). The
        #     independent Model-2 cross-derivation (`max(Q,target) * baseRate`)
        #     is `verification`'s job (bm43), never billed here.
        #   - `rated_amount` + `additional_info` (bm41's columns) are written on
        #     every capacity line: `additional_info` is the versioned calc trace
        #     `{ v, productInventoryId, pricing, calc[], summary[], appendix[] }`
        #     built as `jsonb_build_object` in the SAME SQL expression as the
        #     money columns — never hashed into `charge_checksum` (Inv #35) and
        #     the `calc`/`summary`/`pricing` keys are never rendered in the app
        #     UI (database-only this phase). `snapshot_*` stay NULL on a
        #     capacity line (O-TC1) — it is re-aggregated from the live
        #     BILL_DRAFT rows every run, never read from a prior line like a
        #     RECURRING snapshot.
        #   - REAL (bm45) — `appendix[]` is the ONE key of the trace that DOES
        #     render: one row per distinct claimed `udr_key` (`{ polygon, state,
        #     district, volume, amount }`), LEFT JOINed off the ratecard named
        #     by the offering's `productCardLookUp` spec (its ACTIVE version,
        #     D4) via the D2 canonical-key reconstruction
        #     (`commercial_unit=<v>|mno_public_id=<v>|polygon_id=<v>`,
        #     lower+btrim, matched against `ur.udr_key` — `udr_rated` itself
        #     carries no polygon column). A card-missing polygon keeps its row
        #     (`state`/`district` NULL) — surfaced, never dropped (D3) — and
        #     never fails the account. A HARD, loud `CAPACITY_APPENDIX_OVER_LIMIT`
        #     guard fires if the account's distinct-`udr_key` count exceeds
        #     10,000 (TC57) — never a silent truncation. The final (posted)
        #     invoice render reads this ONE snapshot (no render-time
        #     `udr_rated`/ratecard join); the draft PRO-FORMA never renders it
        #     (D5).
        #   On done: POST the record-only stage-complete signal (§4) — no charge payload.
        #   KNOWN LIMITATION (deferred): a zero-charge account (no USAGE and no
        #   RECURRING lines) still gets a subtotal-0.00 customer_bill. Per Inv #22
        #   a no-line account is Uncharged (no bill), and a 0.00 bill trips the
        #   approval gate; treating it as Uncharged is the phase-3 Uncharged-tab
        #   rework (code-standards §4.7), a SEPARATE later unit.
        #   On done: POST the record-only stage-complete signal (§4) — no charge payload.
      # --- taxation (writes billing.customer_bill_tax_item as billrun_runtime) ---
      - id: taxation
        # STUB: write one tax line (configured single rate) + recompute
        #       tax_total/total_amount IN SQL. REAL: jurisdiction/category tax rules.
      # --- verification (reads customer_bill_line + rating.udr_rated; billrun_runtime) ---
      - id: verification
        # REAL (bm30): the detective control (Inv #3 corollary). The write boundary
        #   (bm14) and the checksum (bm31) are preventive/tamper-evident — neither can
        #   see that Aggregation summed the WRONG set. Verification replays the
        #   aggregation independently and compares. SELECT-only, writes nothing; it
        #   reads four tables, ALL already SELECT-granted (no new grant):
        #   customer_bill_line + customer_bill (bm23/bm14), rating.udr_rated (bm14) and
        #   inventory.product_inventory (bm27, the replay correlation).
        #   - HARD bill<->charge reconciliation: for EVERY USAGE `charge` line, replay
        #     the account's claimed BILL_DRAFT udr_rated rows for the line's stored
        #     grouping_key (product_offering_id:udr_type, re-resolved through
        #     inventory.product_inventory — the SAME correlation bm28 used to form the
        #     grouping_key), scoped to (billrun_ref_id, billrun_ban_id,
        #     billrun_attempt), and assert SUM(udr_rated_price) = line.rated_amount AND
        #     COUNT(*) = line.udr_count (compared null-safe via IS DISTINCT FROM). REAL
        #     (bm43): the comparison is against `rated_amount`, NOT `gross_amount` — a
        #     commitment top-up makes gross = rated_amount + topUp, so the old
        #     gross_amount check would false-fail every under-target capacity account;
        #     rated_amount = gross_amount for a non-capacity USAGE line, so this is
        #     behaviour-preserving for them. The count guards against a sum that
        #     matches by coincidence over the wrong row set. Any mismatch => the
        #     account's verification stage signals FAILED, error_class='HARD',
        #     error_code='RECONCILIATION_MISMATCH', error_detail naming the account +
        #     line(s) => PROCESSING_FAILED, surfaced on the Errors tab for rerun; it
        #     must NEVER auto-pass to approval (a mismatch means the bill is provably
        #     wrong).
        #   - SCOPE (line-anchored): this catches a stored line that diverges from a
        #     faithful re-sum of its rows. It does NOT catch a wholly-MISSING line, nor
        #     a systematic bug in the shared grouping/correlation logic (the replay
        #     would reproduce it) — those are the aggregation unit's own tests (bm28).
        #   - USAGE `charge` lines with `additional_info IS NULL` ONLY (REAL bm43: a
        #     capacity line is excluded here — its `<offering>:CAPACITY:<unit>`
        #     grouping_key never matches this replay's `<offering>:<udr_type>` key, and
        #     it is replayed separately below). RECURRING lines have no udr_rated source
        #     (their correctness is the bm29 price snapshot, not a reconciliation);
        #     non-`charge` line_types (discount/adjustment, unbuilt this phase) are
        #     EXCLUDED, coded forward-compat.
        #   - REAL (bm43) — capacity-line replay + internal identities + Model-2, ALL
        #     re-run as independent READs (verification stays SELECT-only), scoped to
        #     lines with `additional_info IS NOT NULL`:
        #     1. Capacity replay — re-resolve each capacity line's (offering, unit,
        #        udrType) off the subscription's PINNED offering version (Inv #31, the
        #        SAME resolution bm42's aggregation performs) and re-sum the claimed
        #        BILL_DRAFT volume; assert SUM(udr_rated_price) = rated_amount AND
        #        COUNT(*) = udr_count. HARD RECONCILIATION_MISMATCH, never gated.
        #     2. Internal identities — gross_amount = rated_amount + topUp; net_amount =
        #        gross_amount - discount_amount; the additional_info.calc trace's
        #        'total' op = the three money columns; the sum of its 'motivation' band
        #        discounts = discount_amount (binding the calc trace to the hashed
        #        columns, Inv #35). HARD RECONCILIATION_MISMATCH, never gated — these
        #        are internal consistency, not a rate disagreement.
        #     3. Model-2 cross-derivation — an INDEPENDENT recompute,
        #        expected_gross = max(Q, target) * baseRate and expected_discount =
        #        Σ overageₖ * (baseRate - stepRateₖ), with target/steps/baseRate
        #        RE-RESOLVED from the catalog (never read back from additional_info, so
        #        a corrupted trace alone cannot pass spuriously) and Q the re-summed
        #        claimed volume. Compared to the BILLED Model-1 gross/discount. A
        #        disagreement here, OR in G2 above, is governed by the
        #        `capacity_rate_matching` input (default ON, Inv #29/#30): ON HARD-fails
        #        CAPACITY_RATE_MISMATCH naming both figures and both version sources
        #        (rating's stamped rate/price_ref vs the bill-run's resolved
        #        usage_rate/price-id); OFF downgrades to a WARN, logged per account
        #        (`CAPACITY_RATE_MATCHING=OFF ...`), and the account proceeds billing
        #        Model 1's number — never silent. No ±0.01 tolerance (Inv #34); a
        #        fractional multi-row usage's accepted ≤1¢ TC40 drift (TC55) is the
        #        documented case the gate exists to relieve operationally.
        #   - SOFT non-positive-total sanity (runs only when every reconciliation above
        #     passes): customer_bill.total_amount <= 0 => stage DONE + a SOFT finding
        #     (advisory, NEVER blocks — bm07 behaviour preserved); otherwise DONE.
        #   On done: POST the record-only stage-complete signal (§4) — no charge payload.
errors:
  # REAL (bm36): POST a run-level terminal PROCESSING_FAILED to
  # POST /api/billrun/{runId}/status { status: "PROCESSING_FAILED" }
  # (Bearer BILLRUN_APP_TOKEN, retry PT5S×2, NO allowFailure — this settlement
  # must land) so a flow that ERRORED (FAILED execution) before every account
  # signalled settles the run instead of hanging on the stall gate. Fires only on
  # a FAILED execution (a contained per-account failure is a WARNING and does not
  # trigger `errors`); a per-account HARD stage failure is signalled separately by
  # the per-account stage group's own `errors` handler.
  - id: on_error
afterExecution:
  # REAL (bm36): POST the terminal PROCESSING_FAILED ONLY on a KILL
  # (runIf `execution.state == 'KILLED'`). It lives in `afterExecution`, NOT
  # `finally`, because only `afterExecution` sees the settled terminal state —
  # `finally` runs while the execution is still RUNNING, so a state-conditional
  # guard there never matches. NOT `!= 'SUCCESS'`: a WARNING execution (a
  # contained per-account HARD failure) derives PROCESSED by the module contract
  # (compute-run-status.ts / pre-approval-checks.ts — the failed account is
  # skippable/rerunnable), so force-pushing PROCESSING_FAILED there would 409 or
  # wrongly flip a healthy run; FAILED is already handled by `on_error`. Processing
  # self-completes via the per-account DONE signals — there is NO run-level
  # PROCESSING_FINISHED recompute push (unlike distribution's DISTRIBUTION_FINISHED).
  - id: on_killed
