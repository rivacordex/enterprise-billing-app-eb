# LOCAL-DEV DEPLOYABLE PLACEHOLDER — not the canonical contract doc
# (../bill_run_processing.template.yml) and not the real flow (separate
# workflow-management repo). This is a *valid, deployable* Kestra flow that
# preserves the bm16 stage contract. bm27 replaced the `validation` +
# `collection` no-op Logs with the REAL correlation + claim SQL run as
# `billrun_runtime` (via psql — the image ships postgresql-client, worker
# Dockerfile D-B), so the local E2E exercises real subscriber->account
# resolution against the `ci` seed; bm28 then replaced the `aggregation` no-op
# Log with the REAL USAGE aggregation SQL (whole-account replace into
# customer_bill + customer_bill_line at (product_offering_id, udr_type) grain);
# `taxation` + `verification` stay no-op Logs until their units. This is the
# "flow-double" the app-repo DB-gated correlation/claim + aggregation tests
# mirror (bm21 pattern): the SAME billrun_runtime writes, testable without a
# live Kestra. See ./README.md.
id: bill_run_processing
namespace: billrun
inputs:
  - id: bill_run_id
    type: STRING
    defaults: "BRN-DEMO"
  - id: period_start
    type: STRING
    defaults: "2026-09-01"
  - id: period_end
    type: STRING
    defaults: "2026-09-30"
  - id: ban_ids
    type: JSON
    defaults: "[]"
  - id: attempt
    type: INT
    defaults: 1
  - id: gl_event_at
    type: STRING
    defaults: "2026-09-01"
tasks:
  - id: start
    type: io.kestra.plugin.core.log.Log
    message: "bill_run_processing START run={{ inputs.bill_run_id }} attempt={{ inputs.attempt }} period={{ inputs.period_start }}..{{ inputs.period_end }} gl_event_at={{ inputs.gl_event_at }}"
  - id: per_account
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.ban_ids }}"
    tasks:
      # bm27 — REAL Validation: assert against the correlated set (the
      # `_CURRENCY_SQL`-shaped subscriber->account join, Inv #24) and ENFORCE the
      # two HARD checks: a currency mismatch (udr_currency <> account_currency)
      # or an out-of-window row RAISEs, which (ON_ERROR_STOP=1 + `set -e`) FAILS
      # the task so Collection never runs for the account — the local-dev analog
      # of "signal FAILED, HARD finding".
      # NOTE: as a deployable placeholder this task runs the correlation
      # INDEPENDENTLY of Collection's claim task (separate psql / transaction) —
      # the "computed once and shared" optimization (Inv #24) is the REAL flow's
      # contract (../bill_run_processing.template.yml), which Inv #24 permits to
      # be realized as either a shared set OR assertions folded into the claim.
      # Zero-claimable is a zero-charge exception (DONE), NOT an error. Connects
      # as billrun_runtime (the two-writer identity) via psql — SELECT-only here
      # (the read grant bm27 added: USAGE on `inventory` + SELECT on
      # `product_inventory`).
      - id: validation
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
        commands:
          - |
            set -eu
            # POSIX `set -eu` (NOT `-o pipefail`): the shell Commands plugin
            # defaults interpreter to /bin/sh, which is dash on this Ubuntu-based
            # image — dash rejects `-o pipefail`. There are no pipes here anyway;
            # psql's ON_ERROR_STOP=1 + `set -e` propagate any failure.
            # Connect as billrun_runtime (the two-writer identity). PG* are read
            # RAW from the container env (env_file), NOT via Kestra {{ envs }} —
            # the same convention db.py uses for SECRET_RATING_RUNTIME_PASSWORD.
            export PGHOST="${BILLRUN_DB_HOST:-db}"
            export PGPORT="${BILLRUN_DB_PORT:-5432}"
            export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
            export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
            export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
            # Pass the per-account inputs via GUCs, not psql `:'var'` — psql does
            # NOT substitute its variables inside a dollar-quoted ($$) block, so
            # the DO block reads them with current_setting() instead.
            psql -v ON_ERROR_STOP=1 \
              -v ban="{{ taskrun.value }}" \
              -v period_start="{{ inputs.period_start }}" \
              -v period_end="{{ inputs.period_end }}" <<'SQL'
            SELECT set_config('billrun.ban',          :'ban',          false),
                   set_config('billrun.period_start', :'period_start', false),
                   set_config('billrun.period_end',   :'period_end',   false);
            DO $$
            DECLARE
              v_claimable        int;
              v_currency_mismatch int;
              v_out_of_window    int;
            BEGIN
              -- Correlate ONCE (Inv #24), the _CURRENCY_SQL join shape:
              -- udr_subscriber_ref_id -> product_inventory -> billing_account.
              -- `(start_datetime AT TIME ZONE 'UTC')::date` buckets the window in
              -- UTC regardless of the runner's session TimeZone (no boundary drift).
              WITH correlated AS (
                SELECT ur.udr_currency, ur.start_datetime,
                       ba.currency AS account_currency
                FROM   rating.udr_rated ur
                JOIN   inventory.product_inventory pi
                       ON pi.product_inventory_id = ur.udr_subscriber_ref_id
                JOIN   billing.billing_account ba
                       ON ba.billing_account_id = pi.billing_account_id
                WHERE  ur.is_live AND ur.status = 'RATED'
                  AND  ur.udr_type = 'RAN_USAGE'
                  AND  pi.billing_account_id = current_setting('billrun.ban')
              )
              SELECT count(*),
                     count(*) FILTER (WHERE udr_currency <> account_currency),
                     count(*) FILTER (
                       WHERE (start_datetime AT TIME ZONE 'UTC')::date
                               <  current_setting('billrun.period_start')::date
                          OR (start_datetime AT TIME ZONE 'UTC')::date
                               >  current_setting('billrun.period_end')::date)
              INTO   v_claimable, v_currency_mismatch, v_out_of_window
              FROM   correlated;

              RAISE NOTICE 'validation ban=% claimable=% currency_mismatch=% out_of_window=%',
                current_setting('billrun.ban'), v_claimable, v_currency_mismatch, v_out_of_window;

              IF v_currency_mismatch > 0 THEN
                RAISE EXCEPTION 'CURRENCY_MISMATCH (HARD): % correlated row(s) with udr_currency <> account_currency', v_currency_mismatch;
              END IF;
              IF v_out_of_window > 0 THEN
                RAISE EXCEPTION 'WINDOW_COVERAGE (HARD): % correlated row(s) outside [%, %]',
                  v_out_of_window, current_setting('billrun.period_start'), current_setting('billrun.period_end');
              END IF;
              -- v_claimable = 0 falls through: zero-charge DONE, not an error.
            END $$;
            SQL
      # bm27 — REAL Collection: the claim. Whole-account, set-based, ONE
      # statement, run as billrun_runtime. Claims RATED -> BILL_DRAFT ONLY (post
      # bm24/bm25 — the old ('RATED','REJECTED') is dropped; billrun_status_guard
      # permits exactly RATED -> BILL_DRAFT) and stamps the six claim columns,
      # incl. billrun_ban_id = the account Collection JUST RESOLVED (NULL until
      # now, bm26). A subscriber that resolves to no product_inventory (or to an
      # out-of-scope account) is NOT in `correlated`, so its row is left RATED,
      # unclaimed and untouched (D32/Inv #25) — never filtered, never failing.
      - id: collection
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
        commands:
          - |
            set -eu
            # POSIX `set -eu` (see validation task) — /bin/sh is dash here.
            export PGHOST="${BILLRUN_DB_HOST:-db}"
            export PGPORT="${BILLRUN_DB_PORT:-5432}"
            export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
            export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
            export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
            psql -v ON_ERROR_STOP=1 \
              -v ban="{{ taskrun.value }}" \
              -v run="{{ inputs.bill_run_id }}" \
              -v attempt="{{ inputs.attempt }}" <<'SQL'
            WITH correlated AS (
              SELECT ur.udr_id, ur.partition_period, pi.billing_account_id
              FROM   rating.udr_rated ur
              JOIN   inventory.product_inventory pi
                     ON pi.product_inventory_id = ur.udr_subscriber_ref_id
              WHERE  ur.is_live AND ur.status = 'RATED'
                AND  ur.udr_type = 'RAN_USAGE'
                AND  pi.billing_account_id = :'ban'   -- in-scope account
            )
            UPDATE rating.udr_rated ur
            SET    status           = 'BILL_DRAFT',
                   billrun_ref_id   = :'run',
                   billrun_ban_id   = c.billing_account_id,   -- the resolved account
                   billrun_attempt  = :'attempt'::int,        -- quote+cast: robust if the render is unusual
                   billrun_checksum = md5(ur.udr_id || '|' || :'run'),
                   upsert_datetime  = now()
            FROM   correlated c
            WHERE  ur.udr_id = c.udr_id AND ur.partition_period = c.partition_period
              AND  ur.status = 'RATED';                       -- claim from RATED only
            SQL
      # bm28 — REAL Aggregation: group the account's claimed BILL_DRAFT usage
      # into billing.customer_bill_line at (product_offering_id, udr_type) grain,
      # ROLLED UP ACROSS SUBSCRIPTIONS (Inv #3) — the offering id is the
      # denormalized column on inventory.product_inventory, so 3 subs of one
      # offering + 500 of another collapse to 2 lines, not 503. WHOLE-ACCOUNT
      # REPLACE (Inv #16, D22): drop the non-finalized customer_bill via the
      # scoped SECURITY DEFINER billrun_delete_trial_bill (its lines cascade,
      # bm23) then re-INSERT the header + lines — never an ON CONFLICT DO UPDATE
      # and never a bare DELETE against customer_bill_line (billrun_runtime holds
      # no table DELETE on it). line_no is DETERMINISTIC (row_number ORDER BY
      # grouping_key, NOT insertion order — Inv #21) so a rerun reproduces it.
      # subtotal = SUM(net_amount) (Inv #3); tax_total='0.00'/total_amount=subtotal
      # this phase (Taxation, still a stub below, SQL-recomputes tax from subtotal
      # when it lands — no unit). Money is summed in SQL (numeric), never JS float.
      # Reads the offering NAME from product.product_offering (bm28 read grant).
      # Runs as billrun_runtime; SELECT+INSERT on customer_bill/_line + the reads,
      # DELETE only through the SECURITY DEFINER.
      # KNOWN LIMITATION (bm28, deferred): a scoped-in account with ZERO usage
      # lines this phase (no BILL_DRAFT usage, and recurring is bm29) still gets a
      # customer_bill with subtotal 0.00. Per Inv #22 a no-line account is
      # "Uncharged" (no bill), and a 0.00 bill trips the approval gate
      # (pre-approval-checks.ts checkPositiveTotals). Proper handling — treating a
      # no-line account as Uncharged and keeping it off the postable/approval set
      # — is the phase-3 Uncharged-tab rework (code-standards §4.7), a SEPARATE
      # later unit; it is only reachable via the full live-Kestra E2E (deferred),
      # not bm28's own tests. See billmgmt-progress-tracker.md (bm28 Known limitation).
      - id: aggregation
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
        commands:
          - |
            set -eu
            # POSIX `set -eu` (see validation task) — /bin/sh is dash here.
            export PGHOST="${BILLRUN_DB_HOST:-db}"
            export PGPORT="${BILLRUN_DB_PORT:-5432}"
            export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
            export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
            export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
            psql -v ON_ERROR_STOP=1 \
              -v ban="{{ taskrun.value }}" \
              -v run="{{ inputs.bill_run_id }}" \
              -v attempt="{{ inputs.attempt }}" \
              -v period_start="{{ inputs.period_start }}" \
              -v period_end="{{ inputs.period_end }}" \
              -v gl_event_at="{{ inputs.gl_event_at }}" <<'SQL'
            BEGIN;
            -- 1. Whole-account replace (Inv #16, D22): drop the non-finalized bill;
            --    its customer_bill_line rows cascade (ON DELETE CASCADE, bm23).
            SELECT billing.billrun_delete_trial_bill(:'run', :'ban');

            -- 2-4. Group claimed BILL_DRAFT usage -> one line per
            --      (product_offering_id, udr_type) rolled across subscriptions;
            --      re-insert the trial header (subtotal = SUM(net_amount)) then
            --      its lines with a deterministic line_no ordered on grouping_key.
            WITH grp AS (
              SELECT pi.product_offering_id                     AS product_offering_id,
                     ur.udr_type                                AS udr_type,
                     (pi.product_offering_id || ':' || ur.udr_type) AS grouping_key,
                     SUM(ur.udr_rated_price)                    AS gross,
                     SUM(ur.udr_usage_quantity)                 AS qty,
                     min(ur.udr_usage_unit)                     AS unit,
                     count(*)                                   AS udr_count,
                     min(ur.udr_currency)                       AS currency
              FROM   rating.udr_rated ur
              JOIN   inventory.product_inventory pi
                     ON pi.product_inventory_id = ur.udr_subscriber_ref_id
              WHERE  ur.billrun_ref_id  = :'run'
                AND  ur.billrun_ban_id  = :'ban'
                AND  ur.billrun_attempt = :'attempt'::int
                AND  ur.status = 'BILL_DRAFT'
              GROUP BY pi.product_offering_id, ur.udr_type
            ),
            ins_header AS (
              -- subtotal/total inserted PROVISIONALLY as 0.00 (both NOT NULL);
              -- step 4 below sets them from the lines' net_amount. payment_due_date
              -- = gl_event_at + coalesce(account override, cycle default) — the
              -- same term resolution the retired bm05 aggregate-bill.ts used.
              INSERT INTO billing.customer_bill
                (ref_bill_run_id, ref_billing_account_id, period_partition,
                 category, state, billing_period_start, billing_period_end,
                 subtotal, tax_total, total_amount, payment_due_date)
              SELECT :'run', :'ban', date_trunc('month', :'period_start'::date)::date,
                     'trial', 'new', :'period_start'::date, :'period_end'::date,
                     '0.00', '0.00', '0.00',
                     :'gl_event_at'::date
                       + COALESCE(ba.payment_due_days_override, bc.payment_due_days)
              FROM   billing.billing_account ba
              JOIN   billing.bill_cycle bc ON bc.bill_cycle_id = ba.ref_bill_cycle_id
              WHERE  ba.billing_account_id = :'ban'
              RETURNING customer_bill_id, period_partition
            )
            INSERT INTO billing.customer_bill_line
              (ref_customer_bill_id, period_partition, line_no, source, line_type,
               ref_product_offering_id, udr_type, description, quantity, unit,
               gross_amount, discount_amount, net_amount, udr_count, grouping_key, currency)
            SELECT h.customer_bill_id, h.period_partition,
                   row_number() OVER (ORDER BY grp.grouping_key) AS line_no,
                   'USAGE', 'charge',
                   grp.product_offering_id, grp.udr_type, po.name,
                   grp.qty, grp.unit,
                   grp.gross, '0.00', grp.gross,   -- net = gross (no discount this phase)
                   grp.udr_count, grp.grouping_key, grp.currency
            FROM   grp
            JOIN   product.product_offering po
                   ON po.product_offering_id = grp.product_offering_id
            CROSS JOIN ins_header h;

            -- Step 4 (spec §Impl §1 / Inv #3 / §9.5): customer_bill.subtotal =
            -- SUM(net_amount) over the lines JUST WRITTEN, derived from the actual
            -- net_amount (LEFT JOIN so a zero-line bill stays 0.00) — NOT the
            -- pre-line gross, so it stays correct once a discount makes
            -- net <> gross (bm29+). total_amount = subtotal + tax_total (Taxation,
            -- still a stub, re-derives tax_total/total_amount when it lands).
            WITH s AS (
              SELECT cb.customer_bill_id, cb.period_partition, cb.tax_total,
                     COALESCE(SUM(l.net_amount), '0.00')::numeric(18,2) AS net
              FROM   billing.customer_bill cb
              LEFT   JOIN billing.customer_bill_line l
                     ON l.ref_customer_bill_id = cb.customer_bill_id
                    AND l.period_partition = cb.period_partition
              WHERE  cb.ref_bill_run_id = :'run'
                AND  cb.ref_billing_account_id = :'ban'
                AND  cb.period_partition = date_trunc('month', :'period_start'::date)::date
              GROUP BY cb.customer_bill_id, cb.period_partition, cb.tax_total
            )
            UPDATE billing.customer_bill cb
            SET    subtotal = s.net,
                   total_amount = s.net + s.tax_total
            FROM   s
            WHERE  cb.customer_bill_id = s.customer_bill_id
              AND  cb.period_partition = s.period_partition;
            COMMIT;
            SQL
      - id: taxation
        type: io.kestra.plugin.core.log.Log
        message: "[{{ taskrun.value }}] taxation — STUB: one tax line, recompute tax_total/total in SQL"
      - id: verification
        type: io.kestra.plugin.core.log.Log
        message: "[{{ taskrun.value }}] verification — STUB: sanity checks (non-negative total)"
  - id: done
    type: io.kestra.plugin.core.debug.Return
    format: "processed run={{ inputs.bill_run_id }} accounts={{ inputs.ban_ids }}"
errors:
  - id: on_error
    type: io.kestra.plugin.core.log.Log
    message: "on_error — STUB: POST terminal per-account/run failure to app /api/billrun/{{ inputs.bill_run_id }}/status"
finally:
  - id: on_finally
    type: io.kestra.plugin.core.log.Log
    message: "on_finally — STUB: always POST a terminal status (Inv #1 obligation)"
