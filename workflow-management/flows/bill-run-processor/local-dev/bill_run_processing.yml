# LOCAL-DEV DEPLOYABLE PLACEHOLDER — not the canonical contract doc
# (../bill_run_processing.template.yml) and not the real flow (separate
# workflow-management repo). This is a *valid, deployable* Kestra flow that
# preserves the bm16 stage contract. bm27 replaced the `validation` +
# `collection` no-op Logs with the REAL correlation + claim SQL run as
# `billrun_runtime` (via psql — the image ships postgresql-client, worker
# Dockerfile D-B), so the local E2E exercises real subscriber->account
# resolution against the `ci` seed; bm28 then replaced the `aggregation` no-op
# Log with the REAL USAGE aggregation SQL (whole-account replace into
# customer_bill + customer_bill_line at (product_offering_id, udr_type) grain);
# bm30 then replaced the `verification` no-op Log with the REAL bill↔charge
# reconciliation (SOFT non-positive-total sanity + HARD USAGE reconciliation
# replayed from grouping_key/udr_count, SELECT-only); `taxation` stays a no-op
# Log until its unit. bm36 then made the SIGNAL-BACK real: each stage is followed
# by a per-stage stage-complete `DONE` POST, the account's stage group carries an
# `errors` handler that POSTs a per-account HARD `FAILED`, and the flow's
# `errors`/`finally` handlers POST a terminal `PROCESSING_FAILED` — all real
# `io.kestra.plugin.core.http.Request` tasks (Bearer BILLRUN_APP_TOKEN, retry
# PT5S×2), mirroring the distributor (bm34), replacing the former `Log` stubs. So
# a triggered run now reaches `PROCESSED` on its own (no out-of-band replay) and a
# HARD-failing account settles to `PROCESSING_FAILED` via the signal. A deploy-
# time `BILLRUN_PROCESSING_FORCE_FAIL` (threaded onto the `force_fail` input by
# trigger-run.ts) drives the first scoped account down the FAILED path for the
# bm37 gate. bm42 then added Target Capacity Pricing to `aggregation`: the
# commitment floor + N-band motivation discount as inline SQL CTEs, the six
# account-level HARD `CAPACITY_*` guards, and the `rated_amount`/
# `additional_info` calc trace on every capacity line (bm41 added the two
# columns) — same transaction, same whole-account replace, no new task. bm43
# then made `verification` replay against `rated_amount` (not `gross_amount`,
# which a top-up inflates), added the capacity-line replay + internal
# identities and the independent Model-2 cross-derivation, and introduced the
# `capacity_rate_matching` gate (default ON) — threaded into both this step
# AND bm42's G2 guard in `aggregation` (the one cross-step edit). This
# is the "flow-double" the app-repo DB-gated
# correlation/claim + aggregation + verification tests mirror (bm21 pattern): the
# SAME billrun_runtime writes/reads, testable without a live Kestra. See
# ./README.md.
id: bill_run_processing
namespace: billrun
inputs:
  - id: bill_run_id
    type: STRING
    defaults: "BRN-DEMO"
  - id: period_start
    type: STRING
    defaults: "2026-09-01"
  - id: period_end
    type: STRING
    defaults: "2026-09-30"
  - id: ban_ids
    type: JSON
    defaults: "[]"
  - id: attempt
    type: INT
    defaults: 1
  - id: gl_event_at
    type: STRING
    defaults: "2026-09-01"
  # bm36 §Implementation §4 — the deploy-time/test force-fail toggle, set by
  # trigger-run.ts from BILLRUN_PROCESSING_FORCE_FAIL (default false → no-op).
  # When true the aggregation stage of the FIRST scoped account (ban_ids[0])
  # raises a synthetic HARD failure, exercising the terminal FAILED path.
  - id: force_fail
    type: BOOLEAN
    defaults: false
  # bm42-spec §Implementation §1 — the single-band production guard. The
  # capacity CTEs below are N-band; raising this is how multi-step motivation
  # is enabled later, never by editing SQL (TC52). Production stays 1.
  - id: capacity_max_bands
    type: INT
    defaults: 1
  # bm43-spec §Implementation §1 — the capacity rate-match gate. Governs BOTH
  # G2 (aggregation, bm42's guard) and the Model-2 cross-derivation
  # (verification, bm43): ON (default) HARD-fails a rate disagreement, naming
  # both rates and both version sources; OFF downgrades to a WARN, bills
  # Model 1 anyway, and logs the relaxed state per account (Inv #29/#30, TC51).
  - id: capacity_rate_matching
    type: BOOLEAN
    defaults: true
tasks:
  - id: start
    type: io.kestra.plugin.core.log.Log
    message: "bill_run_processing START run={{ inputs.bill_run_id }} attempt={{ inputs.attempt }} period={{ inputs.period_start }}..{{ inputs.period_end }} gl_event_at={{ inputs.gl_event_at }}"
  - id: per_account
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.ban_ids }}"
    tasks:
      # bm36 — the account's stage GROUP wrapped in a Sequential so a HARD
      # stage failure is CONTAINED to THIS account (its local `errors`
      # handler POSTs the FAILED signal) and sibling accounts in the ForEach
      # keep processing (spec §Design). allowFailure keeps a contained account
      # failure from failing the whole execution (the terminal /status POST
      # settles the run).
      #
      # READING THE ACCOUNT ID FROM INSIDE THE WRAP. Every stage's SQL and
      # every callback below reads the loop's account id as
      # `{{ parents[0].taskrun.value }}` — NOT the bare `{{ taskrun.value }}`
      # the stages used when they were DIRECT ForEach children. A ForEach value
      # is NOT inherited by descendants: once the stages moved under this
      # Sequential, `taskrun.value` became unresolvable there and every account
      # failed at the first stage with
      # `IllegalVariableEvaluationException: Unable to find 'value'`.
      # `parents` counts from the innermost enclosing branch task, so
      # `parents[0]` is THIS `account_pipeline` — whose own taskrun IS the
      # ForEach child and therefore carries the account id. It resolves
      # identically in the stage tasks and in the `errors` handler below
      # (verified against the pinned engine, 1.3.35); `parents[1]` does not
      # exist at this depth. Same convention, same reason, as the distributor's
      # `parents[N].taskrun.value` (bill_run_distribution.yml).
      - id: account_pipeline
        type: io.kestra.plugin.core.flow.Sequential
        allowFailure: true
        tasks:
          # bm27 — REAL Validation: assert against the correlated set (the
          # `_CURRENCY_SQL`-shaped subscriber->account join, Inv #24) and ENFORCE the
          # two HARD checks: a currency mismatch (udr_currency <> account_currency)
          # or an out-of-window row RAISEs, which (ON_ERROR_STOP=1 + `set -e`) FAILS
          # the task so Collection never runs for the account — the local-dev analog
          # of "signal FAILED, HARD finding".
          # NOTE: as a deployable placeholder this task runs the correlation
          # INDEPENDENTLY of Collection's claim task (separate psql / transaction) —
          # the "computed once and shared" optimization (Inv #24) is the REAL flow's
          # contract (../bill_run_processing.template.yml), which Inv #24 permits to
          # be realized as either a shared set OR assertions folded into the claim.
          # Zero-claimable is a zero-charge exception (DONE), NOT an error. Connects
          # as billrun_runtime (the two-writer identity) via psql — SELECT-only here
          # (the read grant bm27 added: USAGE on `inventory` + SELECT on
          # `product_inventory`).
          - id: validation
            type: io.kestra.plugin.scripts.shell.Commands
            # bm36 — retry transient/INFRA stage errors (PT5S×2, same policy as the
            # stage-complete callbacks) so a DB blip is absorbed HERE and never
            # reaches the account `errors` handler as a spurious HARD FAILED (that
            # handler's contract, below: "transient/INFRA stage errors are absorbed
            # by Kestra retry on the stage task"). A deterministic HARD RAISE simply
            # re-fails through the retries and then settles the account.
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            taskRunner:
              type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
            commands:
              - |
                set -eu
                # POSIX `set -eu` (NOT `-o pipefail`): the shell Commands plugin
                # defaults interpreter to /bin/sh, which is dash on this Ubuntu-based
                # image — dash rejects `-o pipefail`. There are no pipes here anyway;
                # psql's ON_ERROR_STOP=1 + `set -e` propagate any failure.
                # Connect as billrun_runtime (the two-writer identity). PG* are read
                # RAW from the container env (env_file), NOT via Kestra {{ envs }} —
                # the same convention db.py uses for SECRET_RATING_RUNTIME_PASSWORD.
                export PGHOST="${BILLRUN_DB_HOST:-db}"
                export PGPORT="${BILLRUN_DB_PORT:-5432}"
                export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
                export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
                export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
                # Pass the per-account inputs via GUCs, not psql `:'var'` — psql does
                # NOT substitute its variables inside a dollar-quoted ($$) block, so
                # the DO block reads them with current_setting() instead.
                psql -v ON_ERROR_STOP=1 \
                  -v ban="{{ parents[0].taskrun.value }}" \
                  -v period_start="{{ inputs.period_start }}" \
                  -v period_end="{{ inputs.period_end }}" <<'SQL'
                SELECT set_config('billrun.ban',          :'ban',          false),
                       set_config('billrun.period_start', :'period_start', false),
                       set_config('billrun.period_end',   :'period_end',   false);
                DO $$
                DECLARE
                  v_claimable        int;
                  v_currency_mismatch int;
                  v_out_of_window    int;
                BEGIN
                  -- Correlate ONCE (Inv #24), the _CURRENCY_SQL join shape:
                  -- udr_subscription_ref_id -> product_inventory -> billing_account.
                  -- `(start_datetime AT TIME ZONE 'UTC')::date` buckets the window in
                  -- UTC regardless of the runner's session TimeZone (no boundary drift).
                  WITH correlated AS (
                    SELECT ur.udr_currency, ur.start_datetime,
                           ba.currency AS account_currency
                    FROM   rating.udr_rated ur
                    JOIN   inventory.product_inventory pi
                           ON pi.product_inventory_id = ur.udr_subscription_ref_id
                    JOIN   billing.billing_account ba
                           ON ba.billing_account_id = pi.billing_account_id
                    WHERE  ur.is_live AND ur.status = 'RATED'
                      AND  ur.udr_type = 'RAN_USAGE'
                      AND  pi.billing_account_id = current_setting('billrun.ban')
                  )
                  SELECT count(*),
                         count(*) FILTER (WHERE udr_currency <> account_currency),
                         count(*) FILTER (
                           WHERE (start_datetime AT TIME ZONE 'UTC')::date
                                   <  current_setting('billrun.period_start')::date
                              OR (start_datetime AT TIME ZONE 'UTC')::date
                                   >  current_setting('billrun.period_end')::date)
                  INTO   v_claimable, v_currency_mismatch, v_out_of_window
                  FROM   correlated;

                  RAISE NOTICE 'validation ban=% claimable=% currency_mismatch=% out_of_window=%',
                    current_setting('billrun.ban'), v_claimable, v_currency_mismatch, v_out_of_window;

                  IF v_currency_mismatch > 0 THEN
                    RAISE EXCEPTION 'CURRENCY_MISMATCH (HARD): % correlated row(s) with udr_currency <> account_currency', v_currency_mismatch;
                  END IF;
                  IF v_out_of_window > 0 THEN
                    RAISE EXCEPTION 'WINDOW_COVERAGE (HARD): % correlated row(s) outside [%, %]',
                      v_out_of_window, current_setting('billrun.period_start'), current_setting('billrun.period_end');
                  END IF;
                  -- v_claimable = 0 falls through: zero-charge DONE, not an error.
                END $$;
                SQL
          # bm36 §Implementation §1 — per-stage stage-complete DONE POST. A
          # sibling http.Request AFTER the stage task, so it runs ONLY on stage
          # success (the stage psql RAISEs -> ON_ERROR_STOP=1 + set -e fail the
          # task and the Sequential stops before this; the account's `errors`
          # handler then POSTs FAILED instead). allowFailure + retry PT5S×2
          # mirror the distributor (bm34): a lost callback must NOT crash a run
          # that did its work — the reconcile/stall gate is the backstop (Inv
          # #10/#12). ban_id is the ForEach value; the receiver
          # (handle-stage-signal.ts) is record-only and stale-attempt guarded.
          - id: signal_validation_done
            type: io.kestra.plugin.core.http.Request
            allowFailure: true
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/stage/validation/complete"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
            body: |
              {{ { "ban_id": parents[0].taskrun.value, "attempt": inputs.attempt, "status": "DONE" } }}
          # bm27 — REAL Collection: the claim. Whole-account, set-based, ONE
          # statement, run as billrun_runtime. Claims RATED -> BILL_DRAFT ONLY (post
          # bm24/bm25 — the old ('RATED','REJECTED') is dropped; billrun_status_guard
          # permits exactly RATED -> BILL_DRAFT) and stamps the six claim columns,
          # incl. billrun_ban_id = the account Collection JUST RESOLVED (NULL until
          # now, bm26). A subscriber that resolves to no product_inventory (or to an
          # out-of-scope account) is NOT in `correlated`, so its row is left RATED,
          # unclaimed and untouched (D32/Inv #25) — never filtered, never failing.
          - id: collection
            type: io.kestra.plugin.scripts.shell.Commands
            # bm36 — retry transient stage errors (see the validation task). The
            # claim UPDATE is idempotent on replay (`WHERE status = 'RATED'` no-ops
            # once the rows are already BILL_DRAFT).
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            taskRunner:
              type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
            commands:
              - |
                set -eu
                # POSIX `set -eu` (see validation task) — /bin/sh is dash here.
                export PGHOST="${BILLRUN_DB_HOST:-db}"
                export PGPORT="${BILLRUN_DB_PORT:-5432}"
                export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
                export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
                export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
                psql -v ON_ERROR_STOP=1 \
                  -v ban="{{ parents[0].taskrun.value }}" \
                  -v run="{{ inputs.bill_run_id }}" \
                  -v attempt="{{ inputs.attempt }}" <<'SQL'
                WITH correlated AS (
                  SELECT ur.udr_id, ur.partition_period, pi.billing_account_id
                  FROM   rating.udr_rated ur
                  JOIN   inventory.product_inventory pi
                         ON pi.product_inventory_id = ur.udr_subscription_ref_id
                  WHERE  ur.is_live AND ur.status = 'RATED'
                    AND  ur.udr_type = 'RAN_USAGE'
                    AND  pi.billing_account_id = :'ban'   -- in-scope account
                )
                UPDATE rating.udr_rated ur
                SET    status           = 'BILL_DRAFT',
                       billrun_ref_id   = :'run',
                       billrun_ban_id   = c.billing_account_id,   -- the resolved account
                       billrun_attempt  = :'attempt'::int,        -- quote+cast: robust if the render is unusual
                       billrun_checksum = md5(ur.udr_id || '|' || :'run'),
                       upsert_datetime  = now()
                FROM   correlated c
                WHERE  ur.udr_id = c.udr_id AND ur.partition_period = c.partition_period
                  AND  ur.status = 'RATED';                       -- claim from RATED only
                SQL
          # bm36 §Implementation §1 — Collection DONE POST (see signal_validation_done).
          - id: signal_collection_done
            type: io.kestra.plugin.core.http.Request
            allowFailure: true
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/stage/collection/complete"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
            body: |
              {{ { "ban_id": parents[0].taskrun.value, "attempt": inputs.attempt, "status": "DONE" } }}
          # bm28/bm29 — REAL Aggregation: assemble billing.customer_bill_line from
          # BOTH sources in ONE whole-account-replace transaction (Inv #16, D22).
          #  * USAGE (bm28): group claimed BILL_DRAFT rating.udr_rated into one line
          #    per (product_offering_id, udr_type), ROLLED across subscriptions (Inv #3)
          #    — the offering id is denormalized on inventory.product_inventory, so 3
          #    subs of one offering + 500 of another collapse to 2 lines, not 503.
          #  * RECURRING (bm29): for each ACTIVE subscription whose offering INTENDS a
          #    recurring charge (has a flat_fee product_offering_price whose envelope
          #    priceType='recurring', or an order_item_price_override), resolve the as-of
          #    recurring price (product.product_offering_price via the lead(start_date_time)
          #    window over the RECURRING flat_fee lane — component_type='flat_fee' and
          #    envelope priceType='recurring', the only shape that carries a recurring
          #    scalar amount post-reshape (PC8/PC14); since pm46a a one-time flat_fee is
          #    its own lane and can never supersede it), COALESCE an
          #    ordering.order_item_price_override over the catalog
          #    amount, map the recurring charge period onto the account's bill-cycle
          #    frequency, multiply by product_inventory.quantity, and write ONE RECURRING
          #    line per (product_offering_id) (udr_type NULL) rolled across the account's
          #    subs. A USAGE-ONLY subscription (offering with NO recurring price and no
          #    override) contributes NO recurring line and does NOT fail — recurring is
          #    not mandatory (Inv #22: a usage-only account is still billed for usage).
          # PRICE SNAPSHOT, READ-NOT-RE-RESOLVED ON RERUN (Inv #20/D19): a RECURRING
          # line stores snapshot_price_ref/_unit_price/_quantity/_effective_date. The
          # resolver READS any existing RECURRING line for the account BEFORE the
          # replace deletes it (temp _bm29_prior) and REUSES it verbatim; as-of
          # resolution runs ONLY for offerings with no prior line (temp _bm29_resolved).
          # So a rerun after a backdated product_offering_price insert reproduces the
          # ORIGINAL amounts — the lead() window is never re-walked for a reviewed
          # period. WHOLE-ACCOUNT REPLACE (Inv #16, D22): drop the non-finalized
          # customer_bill via the scoped SECURITY DEFINER billrun_delete_trial_bill (its
          # lines cascade, bm23) then re-INSERT the header + lines — never an ON CONFLICT
          # DO UPDATE and never a bare DELETE against customer_bill_line (billrun_runtime
          # holds no table DELETE on it). line_no is DETERMINISTIC — a SINGLE
          # row_number() OVER (ORDER BY grouping_key, source) across BOTH sources' lines
          # (Inv #21) — so a rerun reproduces it. subtotal = SUM(net_amount) spanning
          # both sources (Inv #3); tax_total='0.00'/total_amount=subtotal this phase (Taxation stub
          # SQL-recomputes tax from subtotal when it lands). Money is summed in SQL
          # (numeric), never JS float. D33 HARD-FAIL (Inv #28): a subscription whose
          # offering INTENDS a recurring charge but has no as-of price (and no prior
          # snapshot), or a price in a currency other than the account's, RAISEs
          # RECURRING_PRICE_NOT_FOUND / RECURRING_CURRENCY_MISMATCH (pm46a retired
          # RECURRING_PRICE_UNSUPPORTED: with the lane split a resolved price is always
          # recurring, so that arm could no longer fire) — ON_ERROR_STOP
          # + set -e fail the task and roll the transaction back, so NO bill (not even
          # the USAGE lines) is produced for that account; on_error POSTs the HARD
          # finding, every other account stays billable. Runs as billrun_runtime; SELECT
          # + column-scoped INSERT on customer_bill/_line, SELECT on the pricing reads
          # (bm28 product_offering; bm29 product_offering_price + order_item_price_
          # override), DELETE only through the SECURITY DEFINER.
          # KNOWN LIMITATION (deferred): a zero-charge account (no USAGE and no
          # RECURRING lines) still gets a customer_bill with subtotal 0.00. Per Inv #22
          # a no-line account is "Uncharged" (no bill), and a 0.00 bill trips the
          # approval gate (pre-approval-checks.ts checkPositiveTotals). Proper handling —
          # treating a no-line account as Uncharged and keeping it off the postable/
          # approval set — is the phase-3 Uncharged-tab rework (code-standards §4.7), a
          # SEPARATE later unit. See billmgmt-progress-tracker.md (Known limitation).
          - id: aggregation
            type: io.kestra.plugin.scripts.shell.Commands
            # bm36 — retry transient stage errors (see the validation task). The
            # whole-account-replace runs in one BEGIN/COMMIT transaction (Inv #16),
            # so a replay reproduces the same bill; the force_fail HARD path simply
            # re-fails through the retries and then settles the account.
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            taskRunner:
              type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
            commands:
              - |
                set -eu
                # POSIX `set -eu` (see validation task) — /bin/sh is dash here.
                # bm36 §Implementation §4 — BILLRUN_PROCESSING_FORCE_FAIL: drive
                # the FIRST scoped account (ban_ids[0]) to a synthetic HARD
                # failure HERE at aggregation, so validation+collection DONE have
                # already landed and the account's `errors` handler then POSTs a
                # FAILED for (ban, aggregation) — the deterministic terminal
                # FAILED path for the bm37 gate. No-op when force_fail is false;
                # every other account bills normally.
                if [ "{{ inputs.force_fail }}" = "true" ] && [ "{{ parents[0].taskrun.value }}" = "{{ inputs.ban_ids[0] }}" ]; then
                  echo "BILLRUN_PROCESSING_FORCE_FAIL: synthetic HARD failure at aggregation for first scoped account {{ parents[0].taskrun.value }}" >&2
                  exit 1
                fi
                export PGHOST="${BILLRUN_DB_HOST:-db}"
                export PGPORT="${BILLRUN_DB_PORT:-5432}"
                export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
                export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
                export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
                psql -v ON_ERROR_STOP=1 \
                  -v ban="{{ parents[0].taskrun.value }}" \
                  -v run="{{ inputs.bill_run_id }}" \
                  -v attempt="{{ inputs.attempt }}" \
                  -v period_start="{{ inputs.period_start }}" \
                  -v period_end="{{ inputs.period_end }}" \
                  -v gl_event_at="{{ inputs.gl_event_at }}" \
                  -v capacity_max_bands="{{ inputs.capacity_max_bands }}" \
                  -v capacity_rate_matching="{{ inputs.capacity_rate_matching }}" <<'SQL'
                BEGIN;
                -- bm43-spec §Implementation §2 — stamp the ban + the capacity
                -- rate-match gate as GUCs: the DO $$ guard block below (G2)
                -- cannot see psql's colon-quote bind-variable substitution
                -- (it does not reach inside a dollar-quoted body, the
                -- validation task's convention), so it reads them back with
                -- current_setting().
                SELECT set_config('billrun.ban', :'ban', false),
                       set_config('billrun.capacity_rate_matching', :'capacity_rate_matching', false);
                -- 0a. bm29 (Inv #20) — capture prior RECURRING lines BEFORE the replace
                --     deletes them, so a rerun REUSES the original snapshot verbatim
                --     rather than re-resolving the (possibly backdated) catalog price.
                --     ON COMMIT DROP: gone when this transaction commits.
                CREATE TEMP TABLE _bm29_prior ON COMMIT DROP AS
                  SELECT l.ref_product_offering_id, l.description, l.quantity, l.unit,
                         l.gross_amount, l.discount_amount, l.net_amount, l.currency,
                         l.grouping_key,
                         l.snapshot_price_ref, l.snapshot_unit_price,
                         l.snapshot_quantity, l.snapshot_effective_date
                  FROM   billing.customer_bill_line l
                  JOIN   billing.customer_bill b
                         ON b.customer_bill_id = l.ref_customer_bill_id
                        AND b.period_partition = l.period_partition
                  WHERE  b.ref_bill_run_id = :'run'
                    AND  b.ref_billing_account_id = :'ban'
                    AND  l.source = 'RECURRING';

                -- 0b. bm29 (Inv #20/D19) — as-of recurring resolution per ACTIVE
                --     subscription, ONLY for offerings that INTEND a recurring charge
                --     (a recurring product_offering_price exists, or an override) AND
                --     with no prior RECURRING line (first derivation, or a reject that
                --     dropped the bill). A USAGE-ONLY subscription (offering with no
                --     recurring price and no override) is EXCLUDED here — it yields no
                --     recurring line and never trips D33 (recurring is not mandatory).
                --     Reads product_offering_price (as-of the lead() window over
                --     period_start, scoped to the account's offerings so the offering
                --     index prunes the scan) COALESCE'd with an order_item_price_override;
                --     period_factor maps the recurring charge period onto the account's
                --     bill-cycle frequency (1 for the built monthly=monthly case).
                --     unit_price NULL marks a not-found recurring subscription (for an
                --     offering that DOES intend recurring) for the D33 check below.
                --     pm46a: the window reads the RECURRING flat_fee lane only
                --     (component_type = 'flat_fee' AND envelope priceType = 'recurring')
                --     and partitions on the product lane key (offering, component_type,
                --     unit_of_measure, price_component ->> 'priceType'), the same key as
                --     product_offering_price_lane_start_unique. Before pm46a a 'oneTime'
                --     and a 'recurring' flat_fee shared one lane, so a later one-time fee
                --     superseded the recurring price and pm52/D3-D4 failed the account
                --     HARD (RECURRING_PRICE_UNSUPPORTED) rather than bill a superseded
                --     price. With the lanes split, the recurring lane's current row IS
                --     the price to bill, a one-time fee never interferes, and that arm
                --     is retired. One-time fees are not billed by this flow.
                CREATE TEMP TABLE _bm29_resolved ON COMMIT DROP AS
                  WITH asof AS (
                    SELECT offering_id, unit_price, price_ref,
                           effective_date, currency, rc_len, rc_type
                    FROM (
                      SELECT pop.product_offering_id                       AS offering_id,
                             (pop.price_component #>> '{params,amount}')::numeric AS unit_price,
                             pop.product_offering_price_id                 AS price_ref,
                             (pop.start_date_time AT TIME ZONE 'UTC')::date AS effective_date,
                             pop.currency                                  AS currency,
                             pop.recurring_charge_period_length            AS rc_len,
                             pop.recurring_charge_period_type              AS rc_type,
                             lead((pop.start_date_time AT TIME ZONE 'UTC')::date) OVER (
                               PARTITION BY pop.product_offering_id, pop.component_type,
                                            pop.unit_of_measure,
                                            pop.price_component ->> 'priceType'
                               ORDER BY pop.start_date_time
                             )                                            AS next_effective
                      FROM   product.product_offering_price pop
                      WHERE  pop.component_type = 'flat_fee'
                        AND  pop.price_component ->> 'priceType' = 'recurring'
                        -- Prune the window scan to THIS account's offerings so the
                        -- product_offering_price offering index is usable (the lead()
                        -- window still sees each kept offering's full price history).
                        AND  pop.product_offering_id IN (
                               SELECT product_offering_id
                               FROM   inventory.product_inventory
                               WHERE  billing_account_id = :'ban' AND status = 'ACTIVE')
                    ) w
                    -- the [eff_from, eff_to) window containing period_start (as-of).
                    WHERE  w.effective_date <= :'period_start'::date
                      AND  (w.next_effective > :'period_start'::date OR w.next_effective IS NULL)
                  )
                  SELECT pi.product_offering_id                                   AS product_offering_id,
                         COALESCE(oipo.amount, a.unit_price)::numeric(18,6)       AS unit_price,
                         COALESCE(oipo.order_item_price_override_id, a.price_ref) AS price_ref,
                         a.effective_date                                         AS effective_date,
                         COALESCE(oipo.currency, a.currency)                      AS currency,
                         ba.currency                                             AS account_currency,
                         pi.quantity::numeric(20,6)                              AS quantity,
                         -- cycle months / charge-period months; defaults to 1 when the
                         -- charge period is unspecified/unmappable (a flat price billed
                         -- once per cycle). Proration/multi-frequency are out of scope.
                         COALESCE(
                           (CASE bc.frequency
                              WHEN 'monthly'   THEN 1
                              WHEN 'quarterly' THEN 3
                              WHEN 'annually'  THEN 12
                            END)::numeric
                           / NULLIF(a.rc_len * CASE lower(COALESCE(a.rc_type, ''))
                                                 WHEN 'month'     THEN 1
                                                 WHEN 'months'    THEN 1
                                                 WHEN 'quarter'   THEN 3
                                                 WHEN 'quarters'  THEN 3
                                                 WHEN 'year'      THEN 12
                                                 WHEN 'years'     THEN 12
                                                 WHEN 'annual'    THEN 12
                                                 WHEN 'annually'  THEN 12
                                                 ELSE NULL
                                               END, 0),
                           1)::numeric                                            AS period_factor
                  FROM   inventory.product_inventory pi
                  JOIN   billing.billing_account ba ON ba.billing_account_id = pi.billing_account_id
                  JOIN   billing.bill_cycle bc       ON bc.bill_cycle_id = ba.ref_bill_cycle_id
                  LEFT   JOIN asof a ON a.offering_id = pi.product_offering_id
                  LEFT   JOIN ordering.order_item_price_override oipo
                         ON oipo.product_order_item_id = pi.product_order_item_id
                        AND oipo.price_type = 'recurring'
                  WHERE  pi.billing_account_id = :'ban'
                    AND  pi.status = 'ACTIVE'
                    AND  pi.product_offering_id NOT IN (
                           SELECT ref_product_offering_id FROM _bm29_prior)
                    -- Only subscriptions whose offering INTENDS a recurring charge:
                    -- a recurring catalog price exists, OR an order-item override does.
                    -- A usage-only offering (neither) is excluded — no recurring line,
                    -- no D33 failure (recurring is not mandatory; the account still
                    -- bills its USAGE lines, Inv #22).
                    AND  (
                           oipo.order_item_price_override_id IS NOT NULL
                        OR EXISTS (
                             SELECT 1 FROM product.product_offering_price pop2
                             WHERE  pop2.product_offering_id = pi.product_offering_id
                               AND  pop2.component_type = 'flat_fee'
                               AND  pop2.price_component ->> 'priceType' = 'recurring')
                         );

                -- 0c. bm29 / D33 (Inv #28): fail THIS account HARD if any freshly
                --     resolved subscription has no as-of price (RECURRING_PRICE_NOT_FOUND)
                --     or is priced in a currency other than the account's
                --     (RECURRING_CURRENCY_MISMATCH — the recurring analog of bm27's USAGE
                --     currency assertion; v1 is single-currency and product_offering_price
                --     /order_item_price_override currencies are not tied to the account,
                --     so a foreign price must never be summed into the bill). RAISE rolls
                --     the whole transaction back -> no bill produced. Never substitute
                --     zero, never skip a subscription silently. (pm46a retired the
                --     RECURRING_PRICE_UNSUPPORTED arm: it caught a one-time flat fee
                --     superseding the recurring one in a shared lane, which the lane
                --     split makes impossible — the window above reads recurring rows only.)
                DO $$
                DECLARE
                  v_not_found         int;
                  v_currency_mismatch int;
                BEGIN
                  SELECT count(*) FILTER (WHERE unit_price IS NULL),
                         count(*) FILTER (WHERE unit_price IS NOT NULL AND currency IS DISTINCT FROM account_currency)
                    INTO v_not_found, v_currency_mismatch
                  FROM   _bm29_resolved;
                  IF v_not_found > 0 THEN
                    RAISE EXCEPTION 'RECURRING_PRICE_NOT_FOUND (HARD): % subscription(s) have no as-of recurring price (D33/Inv #28)', v_not_found;
                  END IF;
                  IF v_currency_mismatch > 0 THEN
                    RAISE EXCEPTION 'RECURRING_CURRENCY_MISMATCH (HARD): % subscription(s) priced in a currency other than the account currency (D33/Inv #28)', v_currency_mismatch;
                  END IF;
                END $$;

                -- 0d. bm42-spec (D2/Inv #31) — resolve this account's CAPACITY-priced
                --     offerings off the PINNED offering version: the same as-of lead()
                --     window pattern as _bm29_resolved above, pruned to the account's
                --     ACTIVE offerings, over usage_rate/capacity_commitment/
                --     capacity_motivation components. A capacity offering is detected
                --     by its COMPONENTS, never a column (Inv #32) — the union of
                --     offerings carrying a commitment and/or a motivation component,
                --     keyed by (offering, unit). base_rate is the same-offering,
                --     same-unit usage_rate row, joined on unit_of_measure (PC4 Option A
                --     — no price-id pointer, TC32). capacity_max_bands is carried in AS
                --     A COLUMN (not referenced inside the DO $$ guard block below) —
                --     psql does not substitute :'var' inside a dollar-quoted body (the
                --     validation task's convention, above).
                CREATE TEMP TABLE _bm42_capacity ON COMMIT DROP AS
                  WITH capacity_asof AS (
                    SELECT offering_id, component_type, unit_of_measure, price_component,
                           price_ref, currency
                    FROM (
                      SELECT pop.product_offering_id                       AS offering_id,
                             pop.component_type                             AS component_type,
                             pop.unit_of_measure                             AS unit_of_measure,
                             pop.price_component                            AS price_component,
                             pop.product_offering_price_id                  AS price_ref,
                             pop.currency                                   AS currency,
                             (pop.start_date_time AT TIME ZONE 'UTC')::date AS effective_date,
                             lead((pop.start_date_time AT TIME ZONE 'UTC')::date) OVER (
                               PARTITION BY pop.product_offering_id, pop.component_type,
                                            pop.unit_of_measure
                               ORDER BY pop.start_date_time
                             )                                              AS next_effective
                      FROM   product.product_offering_price pop
                      WHERE  pop.component_type IN ('usage_rate', 'capacity_commitment', 'capacity_motivation')
                        AND  pop.product_offering_id IN (
                               SELECT product_offering_id
                               FROM   inventory.product_inventory
                               WHERE  billing_account_id = :'ban' AND status = 'ACTIVE')
                    ) w
                    WHERE  w.effective_date <= :'period_start'::date
                      AND  (w.next_effective > :'period_start'::date OR w.next_effective IS NULL)
                  ),
                  commitments AS (
                    SELECT offering_id, unit_of_measure,
                           (price_component #>> '{params,committedQuantity}')::numeric(20,6) AS target,
                           price_ref AS commitment_price_ref, currency
                    FROM   capacity_asof WHERE component_type = 'capacity_commitment'
                  ),
                  motivations AS (
                    SELECT offering_id, unit_of_measure,
                           price_component #> '{params,steps}' AS steps,
                           price_ref AS motivation_price_ref, currency
                    FROM   capacity_asof WHERE component_type = 'capacity_motivation'
                  ),
                  usage_rates AS (
                    SELECT offering_id, unit_of_measure,
                           (price_component #>> '{params,ratePerUnit}')::numeric(18,6) AS base_rate,
                           price_ref AS base_price_ref
                    FROM   capacity_asof WHERE component_type = 'usage_rate'
                  ),
                  capacity_offerings AS (
                    SELECT offering_id, unit_of_measure FROM commitments
                    UNION
                    SELECT offering_id, unit_of_measure FROM motivations
                  )
                  SELECT co.offering_id,
                         co.unit_of_measure                                AS unit,
                         ur.base_rate,
                         ur.base_price_ref,
                         cm.target,
                         cm.commitment_price_ref,
                         mo.steps,
                         mo.motivation_price_ref,
                         COALESCE(cm.currency, mo.currency)::text          AS currency,
                         ba.currency::text                                 AS account_currency,
                         sp.default_value                                   AS udr_type,
                         po.name                                            AS offering_name,
                         COALESCE(jsonb_array_length(mo.steps), 0)          AS step_count,
                         :'capacity_max_bands'::int                        AS max_bands,
                         (SELECT count(*) FROM inventory.product_inventory pi2
                          WHERE  pi2.billing_account_id = :'ban' AND pi2.status = 'ACTIVE'
                            AND  pi2.product_offering_id = co.offering_id)  AS subscription_count,
                         (SELECT pi2.product_inventory_id
                          FROM   inventory.product_inventory pi2
                          WHERE  pi2.billing_account_id = :'ban' AND pi2.status = 'ACTIVE'
                            AND  pi2.product_offering_id = co.offering_id
                          ORDER  BY pi2.product_inventory_id LIMIT 1)       AS product_inventory_id
                  FROM   capacity_offerings co
                  JOIN   billing.billing_account ba ON ba.billing_account_id = :'ban'
                  JOIN   product.product_offering po ON po.product_offering_id = co.offering_id
                  LEFT   JOIN commitments cm ON cm.offering_id = co.offering_id AND cm.unit_of_measure = co.unit_of_measure
                  LEFT   JOIN motivations mo ON mo.offering_id = co.offering_id AND mo.unit_of_measure = co.unit_of_measure
                  LEFT   JOIN usage_rates ur ON ur.offering_id = co.offering_id AND ur.unit_of_measure = co.unit_of_measure
                  LEFT   JOIN product.product_specifications sp
                         ON  sp.ref_product_offering_id = co.offering_id AND sp.name = 'udrType';

                -- 0e. bm42 — EVERY claimed BILL_DRAFT row in a capacity (offering,
                --     unit) volume, REGARDLESS of whether its udr_type or rate
                --     actually match — so the UDR_TYPE_MISMATCH / RATE_MISMATCH guards
                --     below can DETECT the offending rows rather than silently exclude
                --     them from the aggregate that follows.
                CREATE TEMP TABLE _bm42_volume ON COMMIT DROP AS
                  SELECT c.offering_id, c.offering_name, c.unit, c.udr_type AS expected_udr_type,
                         c.base_rate, c.base_price_ref,
                         ur.udr_type, ur.udr_usage_rate, ur.udr_price_ref
                  FROM   _bm42_capacity c
                  JOIN   rating.udr_rated ur
                         ON  ur.billrun_ref_id  = :'run'
                         AND ur.billrun_ban_id  = :'ban'
                         AND ur.billrun_attempt = :'attempt'::int
                         AND ur.status = 'BILL_DRAFT'
                         AND ur.udr_usage_unit = c.unit
                  JOIN   inventory.product_inventory pi
                         ON  pi.product_inventory_id = ur.udr_subscription_ref_id
                         AND pi.product_offering_id = c.offering_id;

                -- 0f. bm42 (D5/Inv #32) — the six HARD capacity guards, account-level,
                --     mirroring the D33 DO block above. Each RAISEs and rolls the
                --     whole transaction back -> no bill for this account; every
                --     sibling account keeps processing (the account_pipeline
                --     `errors` handler POSTs the HARD finding). G2
                --     (CAPACITY_RATE_MISMATCH) uses IS DISTINCT FROM, not <>, so a
                --     NULL udr_usage_rate (a non-PER_UNIT row) counts as a mismatch
                --     rather than slipping past three-valued SQL logic (TC35).
                DO $$
                DECLARE
                  v_multi_sub         int;
                  v_detail            text;
                  v_base_not_found    int;
                  v_udr_mismatch      int;
                  v_rate_mismatch     int;
                  v_multi_step        int;
                  v_currency_mismatch int;
                BEGIN
                  SELECT count(*), string_agg(offering_name || ' (' || subscription_count || ' subscriptions)', '; ')
                    INTO v_multi_sub, v_detail
                  FROM   _bm42_capacity WHERE subscription_count > 1;
                  IF v_multi_sub > 0 THEN
                    RAISE EXCEPTION 'CAPACITY_MULTIPLE_SUBSCRIPTIONS (HARD): %', v_detail;
                  END IF;

                  SELECT count(*), string_agg(offering_name || ' unit ' || unit, '; ')
                    INTO v_base_not_found, v_detail
                  FROM   _bm42_capacity WHERE base_rate IS NULL;
                  IF v_base_not_found > 0 THEN
                    RAISE EXCEPTION 'CAPACITY_BASE_RATE_NOT_FOUND (HARD): no same-unit usage_rate component for %', v_detail;
                  END IF;

                  SELECT count(*) INTO v_udr_mismatch
                  FROM   _bm42_volume WHERE udr_type IS DISTINCT FROM expected_udr_type;
                  IF v_udr_mismatch > 0 THEN
                    RAISE EXCEPTION 'CAPACITY_UDR_TYPE_MISMATCH (HARD): % claimed row(s) carry a udr_type other than the offering''s spec udrType', v_udr_mismatch;
                  END IF;

                  -- bm43-spec §Design D4/§Implementation §2 — G2 is now
                  -- GATE-AWARE (the one cross-step edit this unit makes to
                  -- bm42's aggregation guard): ON (default) HARD-fails exactly
                  -- as bm42 shipped; OFF downgrades to a WARN and lets the
                  -- account proceed to bill Model 1 anyway, so verification's
                  -- own "bill Model 1 anyway" path (bm43) is reachable. v_detail
                  -- names BOTH rates and BOTH version sources per offending row
                  -- (spec §Implementation §5) — rating's stamped rate/price_ref
                  -- vs the bill-run's resolved usage_rate/price-id.
                  SELECT count(*),
                         string_agg(
                           offering_name || ': rating stamped rate '
                             || COALESCE(udr_usage_rate::text, 'NULL')
                             || ' (price_ref ' || COALESCE(udr_price_ref, 'NULL') || ')'
                             || ' vs bill-run resolved usage_rate ' || base_rate
                             || ' (price_ref ' || base_price_ref || ')', '; ')
                    INTO v_rate_mismatch, v_detail
                  FROM   _bm42_volume
                  WHERE  udr_usage_rate IS DISTINCT FROM base_rate
                     OR  udr_price_ref  IS DISTINCT FROM base_price_ref;
                  IF v_rate_mismatch > 0 THEN
                    IF current_setting('billrun.capacity_rate_matching')::boolean THEN
                      RAISE EXCEPTION 'CAPACITY_RATE_MISMATCH (HARD): account % — % claimed row(s) are rated at a rate/price_ref other than the resolved usage_rate: %',
                        current_setting('billrun.ban'), v_rate_mismatch, v_detail;
                    ELSE
                      RAISE NOTICE 'CAPACITY_RATE_MATCHING=OFF: account % — % claimed row(s) mismatch the resolved rate; billing Model 1 anyway: %',
                        current_setting('billrun.ban'), v_rate_mismatch, v_detail;
                    END IF;
                  END IF;

                  SELECT count(*), string_agg(offering_name || ' (' || step_count || ' bands > capacity_max_bands=' || max_bands || ')', '; ')
                    INTO v_multi_step, v_detail
                  FROM   _bm42_capacity WHERE step_count > max_bands;
                  IF v_multi_step > 0 THEN
                    RAISE EXCEPTION 'CAPACITY_MULTI_STEP_UNSUPPORTED (HARD): %', v_detail;
                  END IF;

                  SELECT count(*), string_agg(offering_name || ' (component ' || currency || ' vs account ' || account_currency || ')', '; ')
                    INTO v_currency_mismatch, v_detail
                  FROM   _bm42_capacity WHERE currency IS DISTINCT FROM account_currency;
                  IF v_currency_mismatch > 0 THEN
                    RAISE EXCEPTION 'CAPACITY_CURRENCY_MISMATCH (HARD): %', v_detail;
                  END IF;
                END $$;

                -- 0g. bm45-spec §Implementation §1 (D4) — the appendix card +
                --     its ACTIVE ratecard_version per capacity (offering, unit):
                --     the productCardLookUp spec names the card; the ACTIVE
                --     version of that card is the version the D2 canonical-key
                --     join below resolves against (the same version rating
                --     priced from, D4's resolution). A capacity offering with
                --     no productCardLookUp spec or no ACTIVE version for that
                --     card simply yields no appendix rows for it (LEFT JOINs) —
                --     this is an appendix/render concern, never an account-level
                --     HARD failure (O-TC6, D3).
                CREATE TEMP TABLE _bm45_card ON COMMIT DROP AS
                  SELECT DISTINCT c.offering_id, c.unit,
                         sp.default_value       AS card_name,
                         rv.ratecard_version_id AS ratecard_version_id
                  FROM   _bm42_capacity c
                  LEFT   JOIN product.product_specifications sp
                         ON  sp.ref_product_offering_id = c.offering_id
                        AND  sp.name = 'productCardLookUp'
                  LEFT   JOIN product.ratecard_version rv
                         ON  rv.card_name = sp.default_value AND rv.status = 'ACTIVE';

                -- 0h. bm45-spec §Implementation §1 — per-udr_key volume/amount
                --     for the appendix: every claimed BILL_DRAFT row in THIS
                --     capacity's volume (udr_usage_unit = unit AND udr_type =
                --     udrType, same scoping as capacity_volume below), grouped
                --     by the canonical `udr_key` — one row per distinct polygon
                --     cell (D2).
                CREATE TEMP TABLE _bm45_volume ON COMMIT DROP AS
                  SELECT c.offering_id, c.unit, ur.udr_key,
                         SUM(ur.udr_usage_quantity)::numeric(20,6) AS volume,
                         SUM(ur.udr_rated_price)::numeric(18,2)    AS amount,
                         count(*)::int                             AS udr_count
                  FROM   _bm42_capacity c
                  JOIN   rating.udr_rated ur
                         ON  ur.billrun_ref_id  = :'run'
                         AND ur.billrun_ban_id  = :'ban'
                         AND ur.billrun_attempt = :'attempt'::int
                         AND ur.status = 'BILL_DRAFT'
                         AND ur.udr_usage_unit = c.unit
                         AND ur.udr_type = c.udr_type
                  GROUP BY c.offering_id, c.unit, ur.udr_key;

                -- 0i. bm45-spec §Implementation §1 (TC57) — the ≤10,000-row
                --     appendix bound, account-level (every capacity offering's
                --     polygon rows together): a loud, documented HARD cap, never
                --     a silent truncation.
                DO $$
                DECLARE
                  v_appendix_rows int;
                BEGIN
                  SELECT count(*) INTO v_appendix_rows FROM _bm45_volume;
                  IF v_appendix_rows > 10000 THEN
                    RAISE EXCEPTION 'CAPACITY_APPENDIX_OVER_LIMIT (HARD): account % has % polygon rows (> 10000, the load-tested bound this phase)',
                      current_setting('billrun.ban'), v_appendix_rows;
                  END IF;
                END $$;

                -- 1. Whole-account replace (Inv #16, D22): drop the non-finalized bill;
                --    its customer_bill_line rows cascade (ON DELETE CASCADE, bm23).
                SELECT billing.billrun_delete_trial_bill(:'run', :'ban');

                -- 2-3. Re-insert the trial header, then ALL lines (USAGE + RECURRING)
                --      with a SINGLE deterministic line_no ordered on grouping_key.
                WITH usage_lines AS (
                  SELECT (pi.product_offering_id || ':' || ur.udr_type) AS grouping_key,
                         'USAGE'::text                       AS source,
                         pi.product_offering_id              AS offering_id,
                         ur.udr_type                         AS udr_type,
                         po.name                             AS description,
                         SUM(ur.udr_usage_quantity)::numeric(20,6) AS quantity,
                         min(ur.udr_usage_unit)              AS unit,
                         SUM(ur.udr_rated_price)::numeric(18,2)    AS gross,
                         '0.00'::numeric(18,2)               AS discount,
                         SUM(ur.udr_rated_price)::numeric(18,2)    AS net,
                         count(*)::int                       AS udr_count,
                         min(ur.udr_currency)::text          AS currency,
                         NULL::text                          AS snapshot_price_ref,
                         NULL::numeric(18,6)                 AS snapshot_unit_price,
                         NULL::numeric(20,6)                 AS snapshot_quantity,
                         NULL::date                          AS snapshot_effective_date,
                         SUM(ur.udr_rated_price)::numeric(18,2)    AS rated_amount,
                         NULL::numeric(18,6)                 AS discount_amount_raw,
                         NULL::jsonb                         AS additional_info
                  FROM   rating.udr_rated ur
                  JOIN   inventory.product_inventory pi
                         ON pi.product_inventory_id = ur.udr_subscription_ref_id
                  JOIN   product.product_offering po
                         ON po.product_offering_id = pi.product_offering_id
                  WHERE  ur.billrun_ref_id  = :'run'
                    AND  ur.billrun_ban_id  = :'ban'
                    AND  ur.billrun_attempt = :'attempt'::int
                    AND  ur.status = 'BILL_DRAFT'
                    -- bm42-spec §Implementation §4 — exclude the capacity volume
                    -- (matching offering + unit + udrType) so it is not ALSO
                    -- rolled into an ordinary USAGE line; the same offering's usage
                    -- in a DIFFERENT unit stays an ordinary line (no match here).
                    AND  NOT EXISTS (
                           SELECT 1 FROM _bm42_capacity c
                           WHERE  c.offering_id = pi.product_offering_id
                             AND  c.unit = ur.udr_usage_unit
                             AND  c.udr_type = ur.udr_type
                         )
                  GROUP BY pi.product_offering_id, ur.udr_type, po.name
                ),
                recurring_prior AS (
                  -- reused verbatim (snapshot authoritative on rerun, Inv #20).
                  SELECT p.grouping_key,
                         'RECURRING'::text                   AS source,
                         p.ref_product_offering_id           AS offering_id,
                         NULL::text                          AS udr_type,
                         p.description,
                         p.quantity::numeric(20,6)           AS quantity,
                         p.unit,
                         p.gross_amount::numeric(18,2)       AS gross,
                         p.discount_amount::numeric(18,2)    AS discount,
                         p.net_amount::numeric(18,2)         AS net,
                         NULL::int                           AS udr_count,
                         p.currency::text                    AS currency,
                         p.snapshot_price_ref,
                         p.snapshot_unit_price::numeric(18,6)   AS snapshot_unit_price,
                         p.snapshot_quantity::numeric(20,6)     AS snapshot_quantity,
                         p.snapshot_effective_date,
                         NULL::numeric(18,2)                 AS rated_amount,
                         NULL::numeric(18,6)                 AS discount_amount_raw,
                         NULL::jsonb                         AS additional_info
                  FROM   _bm29_prior p
                ),
                recurring_fresh AS (
                  -- one line per offering, rolled across the account's subscriptions;
                  -- net = SUM(unit_price * period_factor * quantity). The snapshot stores
                  -- the RAW resolved unit price (min(unit_price), NOT net/qty) so it
                  -- equals the amount on snapshot_price_ref's row and does NOT bake in
                  -- period_factor — exact for the common single-price offering; when an
                  -- offering's subs resolve to different prices (e.g. an override on one)
                  -- the min()s are a representative, and net_amount stays authoritative.
                  SELECT (r.product_offering_id || ':RECURRING')     AS grouping_key,
                         'RECURRING'::text                   AS source,
                         r.product_offering_id               AS offering_id,
                         NULL::text                          AS udr_type,
                         po.name                             AS description,
                         SUM(r.quantity)::numeric(20,6)      AS quantity,
                         NULL::text                          AS unit,
                         SUM(r.unit_price * r.period_factor * r.quantity)::numeric(18,2) AS gross,
                         '0.00'::numeric(18,2)               AS discount,
                         SUM(r.unit_price * r.period_factor * r.quantity)::numeric(18,2) AS net,
                         NULL::int                           AS udr_count,
                         min(r.currency)::text               AS currency,
                         min(r.price_ref)                    AS snapshot_price_ref,
                         min(r.unit_price)::numeric(18,6)    AS snapshot_unit_price,
                         SUM(r.quantity)::numeric(20,6)      AS snapshot_quantity,
                         min(r.effective_date)               AS snapshot_effective_date,
                         NULL::numeric(18,2)                 AS rated_amount,
                         NULL::numeric(18,6)                 AS discount_amount_raw,
                         NULL::jsonb                         AS additional_info
                  FROM   _bm29_resolved r
                  JOIN   product.product_offering po
                         ON po.product_offering_id = r.product_offering_id
                  GROUP BY r.product_offering_id, po.name
                ),
                -- bm42-spec §Implementation §4/§5/§6 — the capacity line, ONE per
                -- (offering, unit), driven from the subscription (_bm42_capacity)
                -- rather than the presence of rated rows (TC14/TC15/Inv #33): a
                -- zero-usage capacity subscription still produces a line via the
                -- LEFT JOIN LATERAL below. Model 1 (D4/Inv #29/#34): each
                -- monetary component is rounded ONCE (2dp HALF_UP via round());
                -- gross/net are DERIVED from the rounded parts and never
                -- re-rounded. snapshot_* stay NULL (D2/O-TC1 — capacity lines are
                -- re-aggregated from the live BILL_DRAFT rows every run, never
                -- read from a prior line).
                capacity_volume AS (
                  SELECT c.offering_id, c.unit,
                         COALESCE(SUM(v.udr_usage_quantity), 0)::numeric(20,6) AS q,
                         COALESCE(SUM(v.udr_rated_price), 0)::numeric(18,2)    AS rated_amount,
                         COALESCE(count(v.udr_id), 0)::int                     AS udr_count
                  FROM   _bm42_capacity c
                  LEFT   JOIN LATERAL (
                           SELECT ur.udr_id, ur.udr_usage_quantity, ur.udr_rated_price
                           FROM   rating.udr_rated ur
                           JOIN   inventory.product_inventory pi
                                  ON pi.product_inventory_id = ur.udr_subscription_ref_id
                           WHERE  ur.billrun_ref_id  = :'run'
                             AND  ur.billrun_ban_id  = :'ban'
                             AND  ur.billrun_attempt = :'attempt'::int
                             AND  ur.status = 'BILL_DRAFT'
                             AND  ur.udr_usage_unit = c.unit
                             AND  ur.udr_type = c.udr_type
                             AND  pi.product_offering_id = c.offering_id
                         ) v ON true
                  GROUP BY c.offering_id, c.unit
                ),
                -- N-band generic over `steps` (TC52/capacity_max_bands): one row per
                -- band, `next_above` is the FOLLOWING band's threshold (NULL for the
                -- last band, i.e. unbounded above).
                capacity_bands AS (
                  SELECT c.offering_id, c.unit,
                         (s.v ->> 'aboveQuantity')::numeric(20,6) AS above_quantity,
                         (s.v ->> 'ratePerUnit')::numeric(18,6)   AS step_rate,
                         lead((s.v ->> 'aboveQuantity')::numeric(20,6)) OVER (
                           PARTITION BY c.offering_id, c.unit ORDER BY s.ord
                         )                                        AS next_above
                  FROM   _bm42_capacity c
                  CROSS JOIN LATERAL jsonb_array_elements(c.steps) WITH ORDINALITY AS s(v, ord)
                  WHERE  c.steps IS NOT NULL
                ),
                capacity_band_amounts AS (
                  SELECT b.offering_id, b.unit, b.above_quantity, b.next_above, b.step_rate,
                         c.base_rate,
                         round(GREATEST(LEAST(v.q, COALESCE(b.next_above, v.q)) - b.above_quantity, 0), 6) AS band_qty
                  FROM   capacity_bands b
                  JOIN   _bm42_capacity c ON c.offering_id = b.offering_id AND c.unit = b.unit
                  JOIN   capacity_volume v ON v.offering_id = b.offering_id AND v.unit = b.unit
                ),
                capacity_band_charges AS (
                  SELECT offering_id, unit, above_quantity, next_above, step_rate, base_rate, band_qty,
                         round(band_qty * step_rate, 2)              AS band_charge,
                         round(band_qty * (base_rate - step_rate), 2) AS band_discount,
                         (band_qty * (base_rate - step_rate))         AS band_discount_raw,
                         -- bm42a D1: a window function is legal in a SELECT list but not
                         -- inside an aggregate's arguments, so the band number is computed
                         -- here and read by capacity_band_json below.
                         row_number() OVER (PARTITION BY offering_id, unit ORDER BY above_quantity) AS band_no
                  FROM   capacity_band_amounts
                ),
                capacity_band_rollup AS (
                  SELECT offering_id, unit,
                         COALESCE(SUM(band_discount), 0)::numeric(18,2)     AS discount,
                         COALESCE(SUM(band_discount_raw), 0)::numeric(18,6) AS discount_raw
                  FROM   capacity_band_charges
                  GROUP BY offering_id, unit
                ),
                capacity_band_json AS (
                  SELECT offering_id, unit,
                         jsonb_agg(
                           jsonb_build_object(
                             'op', 'motivation',
                             'band', band_no,
                             'from', above_quantity::numeric(20,6)::text,
                             'to', next_above::numeric(20,6)::text,
                             'quantity', band_qty::numeric(20,6)::text,
                             'baseRate', base_rate::numeric(18,6)::text,
                             'stepRate', step_rate::numeric(18,6)::text,
                             'charge', band_charge::numeric(18,2)::text,
                             'discount', band_discount::numeric(18,2)::text
                           ) ORDER BY above_quantity
                         ) AS bands_calc
                  FROM   capacity_band_charges
                  GROUP BY offering_id, unit
                ),
                -- bm45-spec §Implementation §1 (D2) — LEFT JOIN each distinct
                -- udr_key to this capacity's ratecard (scoped to the ACTIVE
                -- version resolved above) by reconstructing the canonical cell
                -- FROM THE RATECARD COLUMNS and matching it to ur.udr_key —
                -- exactly what rating does. A polygon with usage but no
                -- matching card row (D3) keeps its volume/amount with
                -- polygon_id/state/district all NULL from this join; the
                -- polygon identity for that row is recovered from udr_key
                -- itself in capacity_appendix below (never dropped).
                capacity_appendix_mapped AS (
                  SELECT v.offering_id, v.unit, v.udr_key, v.volume, v.amount, v.udr_count,
                         l.polygon_id, l.state, l.district
                  FROM   _bm45_volume v
                  JOIN   _bm45_card   cd ON cd.offering_id = v.offering_id AND cd.unit = v.unit
                  LEFT   JOIN product.ratecard_ran_usage_lkp l
                         ON  l.ratecard_version_id = cd.ratecard_version_id
                         AND ('commercial_unit=' || lower(btrim(l.commercial_unit_public_key))
                                || '|mno_public_id=' || lower(btrim(l.mno_public_key))
                                || '|polygon_id='    || lower(btrim(l.polygon_id))) = v.udr_key
                ),
                -- one jsonb array per (offering, unit) — the shape the spec's
                -- §Implementation §1 literally names: { polygon, state,
                -- district, volume, amount }, no unit field (the render
                -- orchestrator attaches the capacity line's own `unit` when it
                -- shapes the template param, §Implementation §2). Ordered
                -- state -> district -> polygon, NULLS LAST so an unmapped
                -- polygon sorts to the end (D3's trailing "Unmapped" group).
                -- `polygon` falls back to the udr_key's own polygon_id segment
                -- when the ratecard join misses, so an unmapped row is never
                -- dropped and never anonymous.
                capacity_appendix AS (
                  SELECT offering_id, unit,
                         jsonb_agg(
                           jsonb_build_object(
                             'polygon', COALESCE(polygon_id, substring(udr_key from 'polygon_id=(.*)$')),
                             'state', state,
                             'district', district,
                             'volume', volume::numeric(20,6)::text,
                             'amount', amount::numeric(18,2)::text
                           ) ORDER BY state NULLS LAST, district NULLS LAST,
                                      COALESCE(polygon_id, substring(udr_key from 'polygon_id=(.*)$'))
                         ) AS appendix
                  FROM   capacity_appendix_mapped
                  GROUP BY offering_id, unit
                ),
                capacity_totals AS (
                  SELECT c.offering_id, c.unit, c.offering_name, c.udr_type, c.product_inventory_id,
                         c.base_rate, c.base_price_ref, c.target, c.commitment_price_ref,
                         c.steps, c.motivation_price_ref, c.currency,
                         v.q, v.rated_amount, v.udr_count,
                         -- topUp = round(max(target - Q, 0) * base_rate, 2); GREATEST
                         -- ignores a NULL target (motivation-only, TC36), yielding 0.
                         COALESCE(round(GREATEST(c.target - v.q, 0) * c.base_rate, 2), 0)::numeric(18,2) AS top_up,
                         COALESCE(br.discount, 0)::numeric(18,2)      AS discount,
                         COALESCE(br.discount_raw, 0)::numeric(18,6)  AS discount_raw,
                         COALESCE(bj.bands_calc, '[]'::jsonb)          AS bands_calc,
                         COALESCE(ca.appendix, '[]'::jsonb)            AS appendix
                  FROM   _bm42_capacity c
                  JOIN   capacity_volume v ON v.offering_id = c.offering_id AND v.unit = c.unit
                  LEFT   JOIN capacity_band_rollup br ON br.offering_id = c.offering_id AND br.unit = c.unit
                  LEFT   JOIN capacity_band_json bj ON bj.offering_id = c.offering_id AND bj.unit = c.unit
                  LEFT   JOIN capacity_appendix ca ON ca.offering_id = c.offering_id AND ca.unit = c.unit
                ),
                capacity_lines AS (
                  SELECT (ct.offering_id || ':CAPACITY:' || ct.unit)              AS grouping_key,
                         'USAGE'::text                                             AS source,
                         ct.offering_id                                            AS offering_id,
                         ct.udr_type                                               AS udr_type,
                         ct.offering_name                                          AS description,
                         ct.q                                                      AS quantity,
                         ct.unit                                                   AS unit,
                         (ct.rated_amount + ct.top_up)::numeric(18,2)              AS gross,
                         ct.discount                                               AS discount,
                         (ct.rated_amount + ct.top_up - ct.discount)::numeric(18,2) AS net,
                         ct.udr_count                                              AS udr_count,
                         ct.currency::text                                         AS currency,
                         NULL::text                                               AS snapshot_price_ref,
                         NULL::numeric(18,6)                                       AS snapshot_unit_price,
                         NULL::numeric(20,6)                                       AS snapshot_quantity,
                         NULL::date                                                AS snapshot_effective_date,
                         ct.rated_amount                                           AS rated_amount,
                         ct.discount_raw                                           AS discount_amount_raw,
                         -- §6 calc trace: { v, productInventoryId, pricing, calc[],
                         -- summary[] }. jsonb_strip_nulls (applied per sub-object)
                         -- omits a null commitment/motivation component (TC36) and a
                         -- null `shortfall` key (MET case) without a separate CASE
                         -- per key. summary[] drops any inapplicable line via the
                         -- unnest+WHERE filter (a bare array literal would keep a
                         -- SQL NULL as a literal JSON null element).
                         jsonb_build_object(
                           'v', 1,
                           'productInventoryId', ct.product_inventory_id,
                           'pricing', jsonb_strip_nulls(jsonb_build_object(
                             'usageRate', jsonb_build_object('priceId', ct.base_price_ref, 'ratePerUnit', ct.base_rate::numeric(18,6)::text),
                             'commitment', CASE WHEN ct.target IS NOT NULL THEN
                               jsonb_build_object('priceId', ct.commitment_price_ref, 'committedQuantity', ct.target::numeric(20,6)::text) END,
                             'motivation', CASE WHEN ct.steps IS NOT NULL THEN
                               jsonb_build_object('priceId', ct.motivation_price_ref, 'steps', ct.steps) END
                           )),
                           'calc', jsonb_strip_nulls(
                             jsonb_build_array(
                               jsonb_build_object('op', 'rated_sum', 'udrCount', ct.udr_count, 'quantity', ct.q::numeric(20,6)::text, 'amount', ct.rated_amount::numeric(18,2)::text)
                             )
                             || CASE WHEN ct.target IS NOT NULL THEN
                                  jsonb_build_array(jsonb_build_object(
                                    'op', 'commitment',
                                    'target', ct.target::numeric(20,6)::text,
                                    'outcome', CASE WHEN ct.q >= ct.target THEN 'MET' ELSE 'SHORTFALL' END,
                                    'shortfall', CASE WHEN ct.q < ct.target THEN (ct.target - ct.q)::numeric(20,6)::text END,
                                    'topUp', ct.top_up::numeric(18,2)::text
                                  ))
                                ELSE '[]'::jsonb END
                             || ct.bands_calc
                             || jsonb_build_array(jsonb_build_object(
                                  'op', 'total',
                                  'gross', (ct.rated_amount + ct.top_up)::numeric(18,2)::text,
                                  'discount', ct.discount::numeric(18,2)::text,
                                  'net', (ct.rated_amount + ct.top_up - ct.discount)::numeric(18,2)::text
                                ))
                           ),
                           'summary', (
                             SELECT jsonb_agg(elem)
                             FROM   unnest(ARRAY[
                               'Rated usage: ' || ct.udr_count || ' record(s), ' ||
                                 to_char(ct.q, 'FM999,999,999,990.000000') || ' ' || ct.unit ||
                                 ' = ' || to_char(ct.rated_amount, 'FM999,999,999,990.00'),
                               CASE WHEN ct.target IS NOT NULL THEN
                                 'Commitment ' || to_char(ct.target, 'FM999,999,999,990.000000') || ' ' || ct.unit ||
                                 ': ' || CASE WHEN ct.q >= ct.target THEN 'met' ELSE
                                   'shortfall ' || to_char(ct.target - ct.q, 'FM999,999,999,990.000000') END ||
                                 ', top-up ' || to_char(ct.top_up, 'FM999,999,999,990.00')
                               END,
                               CASE WHEN ct.steps IS NOT NULL THEN
                                 'Motivation discount: ' || to_char(ct.discount, 'FM999,999,999,990.00')
                               END,
                               'Gross ' || to_char((ct.rated_amount + ct.top_up), 'FM999,999,999,990.00') ||
                                 ', discount ' || to_char(ct.discount, 'FM999,999,999,990.00') ||
                                 ', net ' || to_char((ct.rated_amount + ct.top_up - ct.discount), 'FM999,999,999,990.00')
                             ]) AS elem
                             WHERE  elem IS NOT NULL
                           ),
                           -- bm45-spec §Implementation §1 — the per-polygon
                           -- usage appendix snapshot, additive to the bm42
                           -- trace (no new table, the bm41 additional_info
                           -- jsonb). '[]' when this capacity line claimed no
                           -- rows (a card-missing-only or zero-usage account).
                           'appendix', ct.appendix
                         )                                                         AS additional_info
                  FROM   capacity_totals ct
                ),
                all_lines AS (
                  SELECT * FROM usage_lines
                  UNION ALL SELECT * FROM recurring_prior
                  UNION ALL SELECT * FROM recurring_fresh
                  UNION ALL SELECT * FROM capacity_lines
                ),
                ins_header AS (
                  -- subtotal/total inserted PROVISIONALLY as 0.00 (both NOT NULL);
                  -- the final UPDATE below sets them from the lines' net_amount.
                  -- payment_due_date = gl_event_at + coalesce(account override, cycle
                  -- default) — the same term resolution the retired bm05
                  -- aggregate-bill.ts used. A data-modifying CTE runs exactly once, so
                  -- the header is written even when all_lines is empty (a zero-charge
                  -- account still gets a subtotal-0.00 header — the deferred limitation).
                  INSERT INTO billing.customer_bill
                    (ref_bill_run_id, ref_billing_account_id, period_partition,
                     category, state, billing_period_start, billing_period_end,
                     subtotal, tax_total, total_amount, payment_due_date)
                  SELECT :'run', :'ban', date_trunc('month', :'period_start'::date)::date,
                         'trial', 'new', :'period_start'::date, :'period_end'::date,
                         '0.00', '0.00', '0.00',
                         :'gl_event_at'::date
                           + COALESCE(ba.payment_due_days_override, bc.payment_due_days)
                  FROM   billing.billing_account ba
                  JOIN   billing.bill_cycle bc ON bc.bill_cycle_id = ba.ref_bill_cycle_id
                  WHERE  ba.billing_account_id = :'ban'
                  RETURNING customer_bill_id, period_partition
                )
                INSERT INTO billing.customer_bill_line
                  (ref_customer_bill_id, period_partition, line_no, source, line_type,
                   ref_product_offering_id, udr_type, description, quantity, unit,
                   gross_amount, discount_amount, net_amount, udr_count, grouping_key,
                   currency, snapshot_price_ref, snapshot_unit_price, snapshot_quantity,
                   snapshot_effective_date, rated_amount, discount_amount_raw, additional_info)
                SELECT h.customer_bill_id, h.period_partition,
                       -- deterministic line_no over the shared grouping_key (Inv #21);
                       -- source is the tie-breaker so a USAGE row whose free-text
                       -- udr_type is literally 'RECURRING' (no CHECK on udr_type) can
                       -- never share an ambiguous ordinal with a real recurring line.
                       row_number() OVER (ORDER BY al.grouping_key, al.source) AS line_no,
                       al.source, 'charge',
                       al.offering_id, al.udr_type, al.description,
                       al.quantity, al.unit,
                       al.gross, al.discount, al.net,   -- net = gross except a capacity motivation discount
                       al.udr_count, al.grouping_key, al.currency,
                       al.snapshot_price_ref, al.snapshot_unit_price,
                       al.snapshot_quantity, al.snapshot_effective_date,
                       al.rated_amount, al.discount_amount_raw, al.additional_info
                FROM   all_lines al
                CROSS JOIN ins_header h;

                -- 4 (spec §Impl §1 / Inv #3 / §9.5): customer_bill.subtotal =
                -- SUM(net_amount) over the lines JUST WRITTEN — spanning BOTH sources —
                -- derived from the actual net_amount (LEFT JOIN so a zero-line bill
                -- stays 0.00), NOT the pre-line gross, so it stays correct once a
                -- discount makes net <> gross. total_amount = subtotal + tax_total
                -- (Taxation stub re-derives tax_total/total_amount when it lands).
                WITH s AS (
                  SELECT cb.customer_bill_id, cb.period_partition, cb.tax_total,
                         COALESCE(SUM(l.net_amount), '0.00')::numeric(18,2) AS net
                  FROM   billing.customer_bill cb
                  LEFT   JOIN billing.customer_bill_line l
                         ON l.ref_customer_bill_id = cb.customer_bill_id
                        AND l.period_partition = cb.period_partition
                  WHERE  cb.ref_bill_run_id = :'run'
                    AND  cb.ref_billing_account_id = :'ban'
                    AND  cb.period_partition = date_trunc('month', :'period_start'::date)::date
                  GROUP BY cb.customer_bill_id, cb.period_partition, cb.tax_total
                )
                UPDATE billing.customer_bill cb
                SET    subtotal = s.net,
                       total_amount = s.net + s.tax_total
                FROM   s
                WHERE  cb.customer_bill_id = s.customer_bill_id
                  AND  cb.period_partition = s.period_partition;
                COMMIT;
                SQL
          # bm36 §Implementation §1 — Aggregation DONE POST (see signal_validation_done).
          - id: signal_aggregation_done
            type: io.kestra.plugin.core.http.Request
            allowFailure: true
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/stage/aggregation/complete"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
            body: |
              {{ { "ban_id": parents[0].taskrun.value, "attempt": inputs.attempt, "status": "DONE" } }}
          - id: taxation
            type: io.kestra.plugin.core.log.Log
            message: "[{{ parents[0].taskrun.value }}] taxation — STUB: one tax line, recompute tax_total/total in SQL"
          # bm36 §Implementation §1 — Taxation DONE POST (see signal_validation_done).
          # Taxation is a no-op Log this phase (tax_total = 0.00, ratified interim),
          # but it is still a contract stage, so it signals DONE like the others.
          - id: signal_taxation_done
            type: io.kestra.plugin.core.http.Request
            allowFailure: true
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/stage/taxation/complete"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
            body: |
              {{ { "ban_id": parents[0].taskrun.value, "attempt": inputs.attempt, "status": "DONE" } }}
          # bm30 — REAL Verification: the detective control (Inv #3 corollary). Runs as
          # billrun_runtime, SELECT-only — it writes NOTHING. It reads four tables, ALL
          # already SELECT-granted (no new grant): billing.customer_bill_line + billing.
          # customer_bill (bm23/bm14), rating.udr_rated (bm14) and inventory.product_
          # inventory (bm27, the replay correlation). Two checks:
          #  * HARD bill<->charge reconciliation: replay EVERY USAGE `charge` line from
          #    its stored grouping_key + udr_count — re-select the account's claimed
          #    BILL_DRAFT udr_rated rows (correlated udr_subscription_ref_id ->
          #    inventory.product_inventory -> product_offering_id, the SAME correlation
          #    bm28 used to FORM the grouping_key), scoped to (billrun_ref_id,
          #    billrun_ban_id, billrun_attempt), and assert SUM(udr_rated_price) =
          #    line.gross_amount AND COUNT(*) = line.udr_count (compared null-safe via
          #    IS DISTINCT FROM). The count guards a sum that matches by coincidence over
          #    the wrong row set. Any mismatch (naming the account + line(s)) RAISEs
          #    RECONCILIATION_MISMATCH — ON_ERROR_STOP=1 + `set -e` fail the task, so the
          #    account never auto-passes to approval (on_error POSTs the HARD finding =>
          #    PROCESSING_FAILED). RECURRING lines (no udr_rated source — their
          #    correctness is the bm29 price snapshot) and non-`charge` line_types
          #    (discount/adjustment, unbuilt) are EXCLUDED, coded forward-compat.
          #  * SOFT non-positive-total sanity (only when reconciliation passes):
          #    total_amount <= 0 => RAISE NOTICE (advisory, NEVER blocks — bm07
          #    behaviour preserved), the stage still reaches DONE.
          # Per-account inputs pass via GUCs (psql does NOT substitute :'var' inside a
          # $$ block — the validation-task convention).
          - id: verification
            type: io.kestra.plugin.scripts.shell.Commands
            # bm36 — retry transient stage errors (see the validation task).
            # Verification is SELECT-only, so a replay is inherently idempotent.
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            taskRunner:
              type: io.kestra.plugin.core.runner.Process # D0 — ACA has no Docker daemon
            commands:
              - |
                set -eu
                # POSIX `set -eu` (see validation task) — /bin/sh is dash here.
                export PGHOST="${BILLRUN_DB_HOST:-db}"
                export PGPORT="${BILLRUN_DB_PORT:-5432}"
                export PGDATABASE="${BILLRUN_DB_NAME:-enterprise_billing}"
                export PGUSER="${BILLRUN_DB_USER:-billrun_runtime}"
                export PGPASSWORD="${SECRET_BILLRUN_RUNTIME_PASSWORD:?set in workflow-management/dev/.env.example}"
                psql -v ON_ERROR_STOP=1 \
                  -v ban="{{ parents[0].taskrun.value }}" \
                  -v run="{{ inputs.bill_run_id }}" \
                  -v attempt="{{ inputs.attempt }}" \
                  -v capacity_rate_matching="{{ inputs.capacity_rate_matching }}" <<'SQL'
                BEGIN;
                -- the ON COMMIT DROP temp tables below (_bm43_capacity etc.)
                -- must stay alive across every statement that reads them;
                -- psql's default autocommit would drop each one right after
                -- its own CREATE commits. Mirrors the aggregation task's
                -- explicit BEGIN;/COMMIT; wrap.
                SELECT set_config('billrun.ban',     :'ban',     false),
                       set_config('billrun.run',     :'run',     false),
                       set_config('billrun.attempt', :'attempt', false),
                       set_config('billrun.capacity_rate_matching', :'capacity_rate_matching', false);
                -- bm43-spec §Implementation §4 — re-resolve THIS account's
                -- capacity components off the PINNED offering version
                -- (Inv #31), the SAME resolution bm42's _bm42_capacity
                -- performs in aggregation, re-run here as an independent READ
                -- (never written — verification stays SELECT-only). The as-of
                -- date is the account's STORED billing_period_start (this
                -- stage has no period_start input; the stored bill IS the
                -- period this run processed).
                CREATE TEMP TABLE _bm43_capacity ON COMMIT DROP AS
                  WITH asof_period AS (
                    SELECT billing_period_start AS period_start
                    FROM   billing.customer_bill
                    WHERE  ref_bill_run_id = :'run' AND ref_billing_account_id = :'ban'
                  ),
                  capacity_asof AS (
                    SELECT offering_id, component_type, unit_of_measure, price_component,
                           price_ref, currency
                    FROM (
                      SELECT pop.product_offering_id                       AS offering_id,
                             pop.component_type                             AS component_type,
                             pop.unit_of_measure                             AS unit_of_measure,
                             pop.price_component                            AS price_component,
                             pop.product_offering_price_id                  AS price_ref,
                             pop.currency                                   AS currency,
                             (pop.start_date_time AT TIME ZONE 'UTC')::date AS effective_date,
                             lead((pop.start_date_time AT TIME ZONE 'UTC')::date) OVER (
                               PARTITION BY pop.product_offering_id, pop.component_type,
                                            pop.unit_of_measure
                               ORDER BY pop.start_date_time
                             )                                              AS next_effective
                      FROM   product.product_offering_price pop
                      WHERE  pop.component_type IN ('usage_rate', 'capacity_commitment', 'capacity_motivation')
                        AND  pop.product_offering_id IN (
                               SELECT product_offering_id
                               FROM   inventory.product_inventory
                               WHERE  billing_account_id = :'ban' AND status = 'ACTIVE')
                    ) w, asof_period ap
                    WHERE  w.effective_date <= ap.period_start
                      AND  (w.next_effective > ap.period_start OR w.next_effective IS NULL)
                  ),
                  commitments AS (
                    SELECT offering_id, unit_of_measure,
                           (price_component #>> '{params,committedQuantity}')::numeric(20,6) AS target,
                           price_ref AS commitment_price_ref, currency
                    FROM   capacity_asof WHERE component_type = 'capacity_commitment'
                  ),
                  motivations AS (
                    SELECT offering_id, unit_of_measure,
                           price_component #> '{params,steps}' AS steps,
                           price_ref AS motivation_price_ref, currency
                    FROM   capacity_asof WHERE component_type = 'capacity_motivation'
                  ),
                  usage_rates AS (
                    SELECT offering_id, unit_of_measure,
                           (price_component #>> '{params,ratePerUnit}')::numeric(18,6) AS base_rate,
                           price_ref AS base_price_ref
                    FROM   capacity_asof WHERE component_type = 'usage_rate'
                  ),
                  capacity_offerings AS (
                    SELECT offering_id, unit_of_measure FROM commitments
                    UNION
                    SELECT offering_id, unit_of_measure FROM motivations
                  )
                  SELECT co.offering_id,
                         co.unit_of_measure                                AS unit,
                         ur.base_rate, ur.base_price_ref,
                         cm.target, cm.commitment_price_ref,
                         mo.steps, mo.motivation_price_ref,
                         sp.default_value                                   AS udr_type
                  FROM   capacity_offerings co
                  LEFT   JOIN commitments cm ON cm.offering_id = co.offering_id AND cm.unit_of_measure = co.unit_of_measure
                  LEFT   JOIN motivations mo ON mo.offering_id = co.offering_id AND mo.unit_of_measure = co.unit_of_measure
                  LEFT   JOIN usage_rates ur ON ur.offering_id = co.offering_id AND ur.unit_of_measure = co.unit_of_measure
                  LEFT   JOIN product.product_specifications sp
                         ON  sp.ref_product_offering_id = co.offering_id AND sp.name = 'udrType';

                -- bm43-spec §Implementation §4.1 — this account's capacity
                -- VOLUME (Q, the rated sum, the claimed-row count) per
                -- (offering, unit), re-summed from the SAME claimed BILL_DRAFT
                -- rows aggregation read — scoped through product_inventory so
                -- a same-unit/same-udrType row under a DIFFERENT offering is
                -- never pulled in (mirrors aggregation's capacity_volume CTE).
                CREATE TEMP TABLE _bm43_capacity_volume ON COMMIT DROP AS
                  SELECT c.offering_id, c.unit,
                         COALESCE(SUM(v.udr_usage_quantity), 0)::numeric(20,6) AS q,
                         COALESCE(SUM(v.udr_rated_price), 0)::numeric(18,2)    AS rated_sum,
                         COALESCE(count(v.udr_id), 0)::int                     AS udr_count
                  FROM   _bm43_capacity c
                  LEFT   JOIN LATERAL (
                           SELECT ur.udr_id, ur.udr_usage_quantity, ur.udr_rated_price
                           FROM   rating.udr_rated ur
                           JOIN   inventory.product_inventory pi
                                  ON pi.product_inventory_id = ur.udr_subscription_ref_id
                           WHERE  ur.billrun_ref_id  = :'run'
                             AND  ur.billrun_ban_id  = :'ban'
                             AND  ur.billrun_attempt = :'attempt'::int
                             AND  ur.status = 'BILL_DRAFT'
                             AND  ur.udr_usage_unit = c.unit
                             AND  ur.udr_type = c.udr_type
                             AND  pi.product_offering_id = c.offering_id
                         ) v ON true
                  GROUP BY c.offering_id, c.unit;

                -- bm43-spec §Implementation §4.3 — Model-2's N-band motivation
                -- schedule, re-derived independently (never read from
                -- additional_info) — the SAME generic band-walk aggregation's
                -- capacity_bands/capacity_band_charges CTEs perform.
                CREATE TEMP TABLE _bm43_bands ON COMMIT DROP AS
                  SELECT c.offering_id, c.unit,
                         (s.v ->> 'aboveQuantity')::numeric(20,6) AS above_quantity,
                         (s.v ->> 'ratePerUnit')::numeric(18,6)   AS step_rate,
                         lead((s.v ->> 'aboveQuantity')::numeric(20,6)) OVER (
                           PARTITION BY c.offering_id, c.unit ORDER BY s.ord
                         )                                        AS next_above
                  FROM   _bm43_capacity c
                  CROSS JOIN LATERAL jsonb_array_elements(c.steps) WITH ORDINALITY AS s(v, ord)
                  WHERE  c.steps IS NOT NULL;

                CREATE TEMP TABLE _bm43_model2 ON COMMIT DROP AS
                  WITH band_amounts AS (
                    SELECT b.offering_id, b.unit, b.step_rate, c.base_rate,
                           round(GREATEST(LEAST(v.q, COALESCE(b.next_above, v.q)) - b.above_quantity, 0), 6) AS band_qty
                    FROM   _bm43_bands b
                    JOIN   _bm43_capacity c ON c.offering_id = b.offering_id AND c.unit = b.unit
                    JOIN   _bm43_capacity_volume v ON v.offering_id = b.offering_id AND v.unit = b.unit
                  ),
                  band_discount AS (
                    SELECT offering_id, unit,
                           COALESCE(SUM(round(band_qty * (base_rate - step_rate), 2)), 0)::numeric(18,2) AS expected_discount
                    FROM   band_amounts
                    GROUP BY offering_id, unit
                  )
                  SELECT c.offering_id, c.unit,
                         round(GREATEST(v.q, COALESCE(c.target, v.q)) * c.base_rate, 2)::numeric(18,2) AS expected_gross,
                         COALESCE(bd.expected_discount, 0)::numeric(18,2) AS expected_discount
                  FROM   _bm43_capacity c
                  JOIN   _bm43_capacity_volume v ON v.offering_id = c.offering_id AND v.unit = c.unit
                  LEFT   JOIN band_discount bd ON bd.offering_id = c.offering_id AND bd.unit = c.unit;
                DO $$
                DECLARE
                  v_mismatch  int;
                  v_bad_lines text;
                  v_cap_mismatch     int;
                  v_cap_bad_lines    text;
                  v_identity_mismatch int;
                  v_identity_detail   text;
                  v_model2_mismatch   int;
                  v_model2_detail     text;
                  v_total     numeric(18,2);
                BEGIN
                  -- HARD: replay each USAGE charge line from its stored grouping_key and
                  -- compare SUM(udr_rated_price)/COUNT to the line's gross_amount/udr_count.
                  -- `replay` re-resolves each claimed udr_rated row's product_offering_id
                  -- through product_inventory (the join bm28 used to form grouping_key).
                  -- SCOPE (line-anchored detective control): this replays the rows behind
                  -- each EXISTING USAGE line and catches a stored line that diverges from a
                  -- faithful re-sum (a corrupted/tampered gross_amount or udr_count). It is
                  -- NOT designed to catch a wholly-MISSING line, nor a systematic bug in the
                  -- shared grouping-key/correlation logic (the replay would reproduce it) —
                  -- those are covered by the aggregation unit's own tests (bm28), not here.
                  -- IS DISTINCT FROM (not <>) so a NULL udr_count on a USAGE line is itself
                  -- flagged rather than silently passing via SQL three-valued logic.
                  -- bm43-spec §Implementation §3 (D1) — replay against
                  -- RATED_AMOUNT, not gross_amount: a commitment top-up makes
                  -- gross = rated_amount + topUp > rated_amount, so every
                  -- under-target capacity account would false-fail the old
                  -- gross_amount check. rated_amount = gross_amount for a
                  -- non-capacity USAGE line (bm42), so this is
                  -- behaviour-preserving for them. bm43 (D2) also excludes
                  -- capacity-volume claimed rows from THIS generic
                  -- offering:udr_type replay — capacity lines are replayed
                  -- separately below (§4.1) — and excludes capacity LINES
                  -- (additional_info IS NOT NULL) from `mismatched`, since
                  -- their grouping_key (`<offering>:CAPACITY:<unit>`) would
                  -- never match this replay's `<offering>:<udr_type>` key.
                  WITH replay AS (
                    SELECT (pi.product_offering_id || ':' || ur.udr_type) AS grouping_key,
                           SUM(ur.udr_rated_price)::numeric(18,2)         AS replay_sum,
                           count(*)::int                                  AS replay_count
                    FROM   rating.udr_rated ur
                    JOIN   inventory.product_inventory pi
                           ON pi.product_inventory_id = ur.udr_subscription_ref_id
                    WHERE  ur.billrun_ref_id  = current_setting('billrun.run')
                      AND  ur.billrun_ban_id  = current_setting('billrun.ban')
                      AND  ur.billrun_attempt = current_setting('billrun.attempt')::int
                      AND  ur.status = 'BILL_DRAFT'
                      AND  NOT EXISTS (
                             SELECT 1 FROM _bm43_capacity c
                             WHERE  c.offering_id = pi.product_offering_id
                               AND  c.unit = ur.udr_usage_unit
                               AND  c.udr_type = ur.udr_type
                           )
                    GROUP BY (pi.product_offering_id || ':' || ur.udr_type)
                  ),
                  mismatched AS (
                    SELECT l.customer_bill_line_id, l.grouping_key,
                           l.rated_amount, l.udr_count,
                           l.gross_amount, l.net_amount, l.discount_amount,
                           COALESCE(r.replay_sum, '0.00')::numeric(18,2) AS replay_sum,
                           COALESCE(r.replay_count, 0)                   AS replay_count
                    FROM   billing.customer_bill_line l
                    JOIN   billing.customer_bill b
                           ON b.customer_bill_id = l.ref_customer_bill_id
                          AND b.period_partition = l.period_partition
                    LEFT   JOIN replay r ON r.grouping_key = l.grouping_key
                    WHERE  b.ref_bill_run_id = current_setting('billrun.run')
                      AND  b.ref_billing_account_id = current_setting('billrun.ban')
                      AND  l.source = 'USAGE' AND l.line_type = 'charge'
                      AND  l.additional_info IS NULL
                      AND  (COALESCE(r.replay_sum, '0.00')::numeric(18,2) IS DISTINCT FROM l.rated_amount
                            OR COALESCE(r.replay_count, 0) IS DISTINCT FROM l.udr_count
                            -- bm42a D3: bm43 moved this replay from gross_amount to
                            -- rated_amount (right for capacity lines, which add a top-up) and
                            -- called it behaviour-preserving, but a plain line whose billed
                            -- gross/net moved while rated_amount stayed put then passed. For a
                            -- non-capacity line (additional_info IS NULL, enforced above)
                            -- gross must equal rated_amount (bm43 spec) and net must equal
                            -- gross - discount (the identity capacity lines get below).
                            OR l.gross_amount IS DISTINCT FROM l.rated_amount
                            OR l.net_amount   IS DISTINCT FROM (l.gross_amount - l.discount_amount))
                  )
                  SELECT count(*),
                         string_agg(
                           customer_bill_line_id || ' (grouping ' || grouping_key
                           || ': claimed rated ' || rated_amount
                           || '/count ' || COALESCE(udr_count::text, 'NULL')
                           || ', billed gross ' || gross_amount || '/net ' || net_amount
                           || '/discount ' || discount_amount
                           || ' vs replay ' || replay_sum || '/' || replay_count || ')', '; ')
                    INTO   v_mismatch, v_bad_lines
                  FROM   mismatched;

                  -- Per-account trace (parity with the validation task's NOTICE), so the
                  -- run log shows verification ran for THIS account even on the pass path.
                  RAISE NOTICE 'verification ban=% mismatched_usage_lines=%',
                    current_setting('billrun.ban'), v_mismatch;

                  IF v_mismatch > 0 THEN
                    RAISE EXCEPTION 'RECONCILIATION_MISMATCH (HARD): account % has % USAGE line(s) that do not reconcile to their claimed udr_rated rows: %',
                      current_setting('billrun.ban'), v_mismatch, v_bad_lines;
                  END IF;

                  -- bm43-spec §Implementation §4.1 (D2) — capacity replay: the
                  -- claimed BILL_DRAFT volume for each capacity line's
                  -- (offering, unit, udrType) must sum/count to its stored
                  -- rated_amount/udr_count. HARD, never gated (an internal
                  -- reconciliation, not a rate disagreement).
                  WITH cap_mismatched AS (
                    SELECT l.customer_bill_line_id, l.grouping_key,
                           l.rated_amount, l.udr_count,
                           v.rated_sum, v.udr_count AS replay_count
                    FROM   billing.customer_bill_line l
                    JOIN   billing.customer_bill b
                           ON b.customer_bill_id = l.ref_customer_bill_id
                          AND b.period_partition = l.period_partition
                    JOIN   _bm43_capacity_volume v
                           ON l.grouping_key = (v.offering_id || ':CAPACITY:' || v.unit)
                    WHERE  b.ref_bill_run_id = current_setting('billrun.run')
                      AND  b.ref_billing_account_id = current_setting('billrun.ban')
                      AND  l.additional_info IS NOT NULL
                      AND  (v.rated_sum IS DISTINCT FROM l.rated_amount
                            OR v.udr_count IS DISTINCT FROM l.udr_count)
                  )
                  SELECT count(*),
                         string_agg(
                           customer_bill_line_id || ' (grouping ' || grouping_key
                           || ': claimed rated ' || rated_amount
                           || '/count ' || COALESCE(udr_count::text, 'NULL')
                           || ' vs replay ' || rated_sum || '/' || replay_count || ')', '; ')
                    INTO   v_cap_mismatch, v_cap_bad_lines
                  FROM   cap_mismatched;

                  IF v_cap_mismatch > 0 THEN
                    RAISE EXCEPTION 'RECONCILIATION_MISMATCH (HARD): account % has % capacity line(s) whose claimed volume does not reconcile to their claimed udr_rated rows: %',
                      current_setting('billrun.ban'), v_cap_mismatch, v_cap_bad_lines;
                  END IF;

                  -- bm43-spec §Implementation §4.2 (D2) — capacity internal
                  -- identities, HARD and NEVER gated (these bind
                  -- additional_info to the hashed money columns — Inv #35 —
                  -- and are an internal consistency check, not a rate
                  -- disagreement): gross = rated_amount + topUp; net = gross -
                  -- discount; the calc trace's 'total' op = the money
                  -- columns; the sum of the calc trace's 'motivation' band
                  -- discounts = discount_amount. topUp/band-discount default
                  -- to 0 when their calc op is absent (commitment-only /
                  -- motivation-only offerings, TC36).
                  WITH cap_lines AS (
                    SELECT l.customer_bill_line_id, l.grouping_key,
                           l.gross_amount, l.net_amount, l.discount_amount, l.rated_amount,
                           l.additional_info,
                           COALESCE((SELECT (elem->>'topUp')::numeric(18,2)
                                     FROM jsonb_array_elements(l.additional_info->'calc') elem
                                     WHERE elem->>'op' = 'commitment'), 0.00) AS top_up,
                           COALESCE((SELECT SUM((elem->>'discount')::numeric(18,2))
                                     FROM jsonb_array_elements(l.additional_info->'calc') elem
                                     WHERE elem->>'op' = 'motivation'), 0.00) AS band_discount_sum,
                           (SELECT elem FROM jsonb_array_elements(l.additional_info->'calc') elem
                            WHERE elem->>'op' = 'total') AS total_calc
                    FROM   billing.customer_bill_line l
                    JOIN   billing.customer_bill b
                           ON b.customer_bill_id = l.ref_customer_bill_id
                          AND b.period_partition = l.period_partition
                    WHERE  b.ref_bill_run_id = current_setting('billrun.run')
                      AND  b.ref_billing_account_id = current_setting('billrun.ban')
                      AND  l.additional_info IS NOT NULL
                  ),
                  identity_mismatched AS (
                    SELECT customer_bill_line_id, grouping_key
                    FROM   cap_lines
                    WHERE  gross_amount IS DISTINCT FROM (rated_amount + top_up)
                       OR  net_amount IS DISTINCT FROM (gross_amount - discount_amount)
                       OR  discount_amount IS DISTINCT FROM band_discount_sum
                       OR  total_calc IS NULL
                       OR  (total_calc->>'gross')::numeric(18,2) IS DISTINCT FROM gross_amount
                       OR  (total_calc->>'discount')::numeric(18,2) IS DISTINCT FROM discount_amount
                       OR  (total_calc->>'net')::numeric(18,2) IS DISTINCT FROM net_amount
                  )
                  SELECT count(*), string_agg(customer_bill_line_id || ' (' || grouping_key || ')', '; ')
                    INTO v_identity_mismatch, v_identity_detail
                  FROM   identity_mismatched;

                  IF v_identity_mismatch > 0 THEN
                    RAISE EXCEPTION 'RECONCILIATION_MISMATCH (HARD): account % has % capacity line(s) failing an internal identity check (gross/net/discount vs additional_info.calc): %',
                      current_setting('billrun.ban'), v_identity_mismatch, v_identity_detail;
                  END IF;

                  -- bm43-spec §Implementation §4.3 (D3/D4) — Model-2: an
                  -- INDEPENDENT cross-derivation (max(Q,target) * baseRate,
                  -- plus the N-band motivation discount), re-resolved from the
                  -- catalog (_bm43_capacity/_bm43_model2 above — NEVER read
                  -- back from additional_info, so a corrupted trace alone
                  -- cannot make this pass spuriously) and compared to the
                  -- BILLED Model-1 figures. A disagreement is governed by the
                  -- capacity_rate_matching gate (§5.4): ON HARD-fails naming
                  -- both figures/version sources; OFF downgrades to a WARN
                  -- and bills Model 1 anyway (never silent). No ±0.01
                  -- tolerance (Inv #34) — exact for integer usage; the TC55/
                  -- TC40 caveat (a ≤1¢ drift on fractional multi-row usage)
                  -- is accepted and NOT fixed with a tolerance here; the gate
                  -- is the documented operational relief if it ever trips.
                  WITH model2_mismatch AS (
                    SELECT l.customer_bill_line_id, m.offering_id, m.unit,
                           l.gross_amount, l.discount_amount,
                           m.expected_gross, m.expected_discount
                    FROM   billing.customer_bill_line l
                    JOIN   billing.customer_bill b
                           ON b.customer_bill_id = l.ref_customer_bill_id
                          AND b.period_partition = l.period_partition
                    JOIN   _bm43_model2 m
                           ON l.grouping_key = (m.offering_id || ':CAPACITY:' || m.unit)
                    WHERE  b.ref_bill_run_id = current_setting('billrun.run')
                      AND  b.ref_billing_account_id = current_setting('billrun.ban')
                      AND  (l.gross_amount IS DISTINCT FROM m.expected_gross
                            OR l.discount_amount IS DISTINCT FROM m.expected_discount)
                  )
                  SELECT count(*),
                         string_agg(
                           'offering ' || offering_id || ' unit ' || unit
                             || ': Model 1 (billed) gross ' || gross_amount || '/discount ' || discount_amount
                             || ' vs Model 2 (re-resolved) gross ' || expected_gross || '/discount ' || expected_discount, '; ')
                    INTO v_model2_mismatch, v_model2_detail
                  FROM   model2_mismatch;

                  IF v_model2_mismatch > 0 THEN
                    IF current_setting('billrun.capacity_rate_matching')::boolean THEN
                      RAISE EXCEPTION 'CAPACITY_RATE_MISMATCH (HARD): account % — the Model-2 cross-derivation disagrees with the billed Model 1 figure on % capacity line(s): %',
                        current_setting('billrun.ban'), v_model2_mismatch, v_model2_detail;
                    ELSE
                      RAISE NOTICE 'CAPACITY_RATE_MATCHING=OFF: account % — Model-2 disagrees with Model 1 on % capacity line(s); billing Model 1 anyway: %',
                        current_setting('billrun.ban'), v_model2_mismatch, v_model2_detail;
                    END IF;
                  END IF;

                  -- SOFT: non-positive-total sanity (advisory, never blocks — bm07).
                  SELECT total_amount INTO v_total
                  FROM   billing.customer_bill
                  WHERE  ref_bill_run_id = current_setting('billrun.run')
                    AND  ref_billing_account_id = current_setting('billrun.ban');

                  IF v_total IS NOT NULL AND v_total <= 0 THEN
                    RAISE NOTICE 'NON_POSITIVE_TOTAL (SOFT): total_amount % <= 0 (advisory, non-blocking)', v_total;
                  END IF;
                END $$;
                COMMIT;
                SQL
          # bm36 §Implementation §1 — Verification DONE POST. verification is the
          # TERMINAL_STAGE the receiver keys on, so this DONE is what flips the
          # account to PROCESSED (handle-stage-signal.ts). The bm30 SOFT
          # non-positive-total finding is a RAISE NOTICE (advisory, non-blocking)
          # and is NOT threaded onto this callback in the local-dev double — the
          # stage still reaches DONE either way; a structured SOFT error_class is
          # the real flow's contract (template.yml).
          - id: signal_verification_done
            type: io.kestra.plugin.core.http.Request
            allowFailure: true
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/stage/verification/complete"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
            body: |
              {{ { "ban_id": parents[0].taskrun.value, "attempt": inputs.attempt, "status": "DONE" } }}
        # bm36 §Implementation §2 — per-account HARD FAILED handler. Local to the
        # account_pipeline Sequential, so it fires when ANY stage of THIS account
        # RAISEs (ON_ERROR_STOP=1 + set -e), and allowFailure on the Sequential
        # contains the failure so sibling accounts keep processing. It POSTs a
        # stage-complete FAILED for the account with error_class=HARD — the shape
        # the receiver already accepts; a HARD FAILED settles the account to
        # PROCESSING_FAILED regardless of which stage it names (advanceAccountStatus),
        # and the app then marks that account SKIPPED at approval (approve-run.ts) —
        # the run itself stays PROCESSED for the healthy accounts (the established,
        # tested module contract: compute-run-status.ts / pre-approval-checks.ts).
        #
        # The callback targets a FIXED stage — `verification` (the TERMINAL_STAGE) —
        # NOT a stage derived from the errored task's context. A HARD failure always
        # occurs at or before verification, so `verification` NEVER carries a DONE
        # for this account and the FAILED can never collide with (or be shadowed by)
        # a prior DONE latch; and it is always a valid `Stage` enum value, so the
        # route's `[stage]` param never 422s and the signal reliably lands. (An
        # earlier draft derived the stage from `tasksWithState('FAILED')[0]`, but
        # that function is execution-global and unordered and can resolve to the
        # wrapping `account_pipeline`/`per_account` taskrun — not a Stage — which
        # 422s and DROPS the FAILED signal, wedging the account. The exact failing
        # stage is in the psql execution log; the receiver only needs a valid HARD
        # FAILED to settle the account.) error_code is the generic
        # PROCESSING_STAGE_FAILED (the flow-double does not parse the psql RAISE
        # text into bm27/bm29's structured codes — the real flow's contract,
        # template.yml). retry PT5S×2; NO allowFailure — the FAILED signal must
        # land (transient/INFRA stage errors are absorbed by Kestra retry on the
        # stage task and never reach here as HARD).
        errors:
          - id: signal_account_failed
            type: io.kestra.plugin.core.http.Request
            retry:
              type: constant
              interval: PT5S
              maxAttempt: 2
            uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/stage/verification/complete"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
            body: |
              {{ {
                "ban_id": parents[0].taskrun.value,
                "attempt": inputs.attempt,
                "status": "FAILED",
                "error_class": "HARD",
                "error_code": "PROCESSING_STAGE_FAILED",
                "error_detail": "HARD processing failure for account " ~ parents[0].taskrun.value ~ " (attempt " ~ inputs.attempt ~ "); see the execution log for the failing stage."
              } }}
  - id: done
    type: io.kestra.plugin.core.debug.Return
    format: "processed run={{ inputs.bill_run_id }} accounts={{ inputs.ban_ids }}"
# bm36 §Implementation §3 — run-level terminal settlement (Inv #1), replacing the
# Log stubs with real /status POSTs so a run whose EXECUTION fails or is killed
# settles to PROCESSING_FAILED instead of hanging on the stall gate.
#
# IMPORTANT — the run-level terminal push covers ONLY a whole-execution failure,
# NOT a contained per-account HARD failure. A per-account failure is caught by
# account_pipeline's local `errors` handler (allowFailure), which ends the
# execution in WARNING (not FAILED); by the established, tested module contract
# (compute-run-status.ts, pre-approval-checks.ts) such a run derives PROCESSED
# (all accounts terminal, the failed one skippable/rerunnable) — it must NOT be
# force-pushed to PROCESSING_FAILED. So:
#   * on_error (`errors`, fires only on a FAILED execution) POSTs
#     PROCESSING_FAILED — an uncontained flow crash while the run is still
#     PROCESSING. NO allowFailure: it must land. It carries no state guard because
#     the `errors` block itself IS the "execution failed" condition (a WARNING
#     from a contained per-account failure does NOT trigger `errors`).
#   * on_killed (`afterExecution`, runIf `execution.state == 'KILLED'`) covers a
#     KILL — the one terminal state that fires neither `errors` nor a completed
#     run's signals. It lives in `afterExecution`, NOT `finally`, because ONLY
#     `afterExecution` can see the settled terminal state: `finally` runs while
#     the execution is still RUNNING, so a state-conditional guard there is
#     meaningless (`execution.state` reads RUNNING, never KILLED/FAILED). The
#     guard is `== 'KILLED'`, NOT `!= 'SUCCESS'`: a WARNING execution (a contained
#     per-account failure) derives PROCESSED per the module contract and must not
#     be force-failed; and FAILED is already handled by `on_error`, so excluding
#     it here avoids a double PROCESSING_FAILED push.
# A WARNING run needs no run-level push: the per-account DONE/FAILED signals
# already drove it to a correct terminal (PROCESSED). A lost callback that leaves
# an account non-terminal is the reconcile/stall gate's job (Inv #10/#12), not a
# blunt run-level force. Processing self-completes via the per-account DONE
# signals — there is NO run-level PROCESSING_FINISHED recompute push (unlike
# distribution's DISTRIBUTION_FINISHED).
errors:
  - id: on_error
    type: io.kestra.plugin.core.http.Request
    # NO allowFailure — this terminal settlement must land (spec §3).
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 2
    uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/status"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
    body: |
      {{ { "status": "PROCESSING_FAILED" } }}
afterExecution:
  - id: on_killed
    type: io.kestra.plugin.core.http.Request
    # KILL only, and in `afterExecution` (not `finally`) so `execution.state` is
    # the settled terminal state (`finally` sees RUNNING). NOT `!= 'SUCCESS'`: a
    # WARNING run (a contained per-account failure) derives PROCESSED per the
    # module contract and must not be force-failed; FAILED is handled by on_error.
    runIf: "{{ execution.state == 'KILLED' }}"
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 2
    uri: "{{ envs.billrun_app_base_url | default('http://app:3000') }}/api/billrun/{{ inputs.bill_run_id }}/status"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('BILLRUN_APP_TOKEN') }}"
    body: |
      {{ { "status": "PROCESSING_FAILED" } }}
