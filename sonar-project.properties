# Seed data tables (one object literal per row) are excluded from duplication
# detection only — every other rule still analyses them. SonarJS CPD normalises
# string literals, so each row of a uniform table is token-identical to its
# neighbours and every added row is reported as duplicated new code (e.g. rm25's
# RATECARD_LABEL_INVALID row in rating-event-catalog.data.ts: 78.6%).
sonar.cpd.exclusions=db/seeds/**/*.data.ts
