# um30-spec — five sequential, gated stages: build -> test_scan ->
# containerize -> migrate -> deploy -> zap_scan. SAST is Semgrep, not
# CodeQL (deviation, codebase wins — Semgrep was already established here
# in um01; no CodeQL extension is installed on this org). Promotion across
# environments (dev -> staging -> prod) is gated by Azure DevOps Environment
# approvals on the `deploy` stage's `environment:` — configured in the
# Azure DevOps project UI, not in this file.
#
# Required service connections / variable groups (created once in the Azure
# DevOps project, not in source control):
#   - Azure Resource Manager service connection: "azure-service-connection"
#   - Variable group "um30-infra" (non-secret, per environment): ACR_NAME,
#     RESOURCE_GROUP, CONTAINERAPP_NAME, CONTAINERAPP_JOB_NAME,
#     CONTAINER_APPS_ENV, KEYVAULT_NAME, APP_MI_RESOURCE_ID,
#     MIGRATE_MI_RESOURCE_ID, STAGING_FQDN, MICROSOFT_CLIENT_ID,
#     ENTRA_TENANT_ID, RATING_ENGINE_CONTAINERAPP_NAME (rm06 — the
#     deploy_workflow_flows stage's Container App name; only read when
#     deployRatingFlows=true). The SSO pair are non-secret Microsoft
#     identifiers (the client SECRET is a Key Vault reference, never a
#     variable) — defined here, not in source control, so the concrete
#     tenant/client IDs stay out of git; leave them empty in the group for an
#     environment without SSO.
#   - The service connection's principal needs `Key Vault Secrets User` (or
#     equivalent get-secret access) on KEYVAULT_NAME for deploy_workflow_flows
#     to read `kestra-basic-auth-password` — not yet confirmed granted
#     anywhere in this repo's Bicep (every existing Key Vault role assignment
#     here is to a Container App Managed Identity, not this pipeline's own
#     service connection principal); flagged, not assumed.
#   - bm21's billrun_live_kestra_smoke stage (off by default) reads
#     `pg-connection-string-app` (existing) plus two NOT YET CREATED Key
#     Vault secrets, `billrun-engine-url`/`billrun-engine-auth` — see
#     workflow-management/flows/bill-run-processor/README.md's phase-2 exit criterion. Same "flagged, not
#     assumed" access-grant caveat as the line above.
#
# rm13 (the rating module's ship gate) adds two OFF-BY-DEFAULT stages
# branching off test_scan, neither of which is part of the mandatory five-
# stage backbone above: rating_fanout_gate (test #15 against a disposable
# LOCAL Kestra engine, runRatingFanoutGate param), zap_scan_workflow_engine
# (DAST against a DEPLOYED engine, scanRatingEngineDast param — see
# zap-scan-workflow-engine-stage.yml). test_scan itself also now installs the
# workflow-engine Python runtime (best-effort) so the existing rm06-rm12
# DB-gated rating guardrail suites run for real instead of skipping, and
# runs the rm13 migration-boundary check + Semgrep p/python.
parameters:
  # rm04 D0 — the workflow-engine worker image CANNOT be built until the D0
  # process-runner spike has passed AND workflow-management/worker/workflow-engine/Dockerfile's base
  # digest + a fully hashed requirements.txt are filled in (both are
  # placeholders today, so a build would fail). Defaults to false so automatic
  # CI/PR runs skip the containerize_workflow_engine stage entirely; queue the
  # pipeline manually with this set to true once the spike passes. Mirrors
  # main.bicep's deployRatingEngine gate.
  - name: buildRatingEngine
    displayName: Build the rm04 workflow-engine worker image (D0 spike must have passed)
    type: boolean
    default: false

  # rm06-spec D2 — flows are deployed from git, never edited in the Kestra
  # UI. Defaults to false for the same reason buildRatingEngine/
  # deployRatingEngine do: the D0 process-runner spike has not passed, no
  # engine is deployed yet (deployRatingEngine defaults false in main.bicep),
  # and the flow-deploy stage below needs an FQDN + reachable engine to
  # target. Queue the pipeline manually with this set to true once an engine
  # exists to deploy flows to.
  - name: deployRatingFlows
    displayName: Deploy rm06+ rating flows (flows/**) to the Kestra engine (engine must be deployed first)
    type: boolean
    default: false

  # rm13-spec D2/§10.15 — test #15 (no-per-record-fan-out) is the one
  # guardrail test that needs a REAL Kestra execution (every other rm07-rm12
  # suite black-box-tests the runtime.* modules directly, bypassing Kestra
  # entirely). Proving it means standing up the local dev stack (rm04 D9:
  # Postgres + Kestra + Azurite via docker-compose.dev.yml) inside the CI
  # agent, deploying flows/** to it, and running the 50,000-record fixture
  # through the real landing/ file trigger. Defaults to false — same
  # conservative-gate precedent as buildRatingEngine/deployRatingFlows,
  # since it depends on the same unconfirmed-against-v1.3.35 D0-spike items
  # (kestra.yml property names, the landing trigger's plugin id, the kestra
  # CLI's flags) that gate those. rm13-spec D2 itself frames test #15 as "a
  # design guard, not a release blocker" — this stage being off by default
  # is that framing encoded as a gate, not a gap.
  - name: runRatingFanoutGate
    displayName: Run rm13 test #15 (50k-record no-per-record-fan-out) against a local Kestra engine (D0 spike must have passed)
    type: boolean
    default: false

  # rm13-spec D5 — the DAST half of the ship gate, against the DEPLOYED
  # rating engine (distinct from zap-scan-stage.yml, which scans the app).
  # Defaults to false: the engine is itself gated behind
  # deployRatingEngine/deployEasyAuth in main.bicep (both default false,
  # rm04/rm05) and no stage in this pipeline deploys main.bicep at all
  # (existing convention) — there is normally no engine FQDN for this scan
  # to target. Queue manually with this set to true once a real engine is
  # deployed and reachable.
  - name: scanRatingEngineDast
    displayName: Run the rm13 OWASP ZAP DAST baseline against the deployed rating engine (engine must be deployed first)
    type: boolean
    default: false

  # bm21-spec §Implementation §3/Phase-2 review fold T3 — the billing
  # module's analogue of runRatingFanoutGate/scanRatingEngineDast: proves
  # `scripts/billrun-live-kestra-smoke.ts`'s trigger -> claim -> PROCESSED
  # path against a REALLY DEPLOYED `bill_run_processing` flow on a real
  # `billrun` Kestra engine — something the CI-doubled DB-gated E2E
  # (tests/db/billing-e2e-happy-path.integration.test.ts) can never prove.
  # Defaults to false for the SAME reason as the rating gates above: the
  # separate workflow-management repo that builds/deploys the real flow, its
  # owning team, and its deploy step are still TBD (workflow-management/flows/bill-run-processor/README.md)
  # — there is normally no real engine for this to target. Queue manually
  # (or via a scheduled trigger configured with this parameter set to true
  # in the Azure DevOps UI's Scheduled Triggers, once a nightly cadence is
  # wanted — T3 asks for "non-CI / nightly", and Azure DevOps schedules
  # support per-schedule parameter overrides there) once a real engine is
  # deployed and reachable.
  - name: runBillrunLiveKestraSmoke
    displayName: Run the bm21 live-Kestra smoke gate (trigger -> claim -> PROCESSED) against the deployed billrun engine (engine must be deployed first)
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  containers:
    # Postgres 16 service for the um02 DB migration integration suite
    # (tests/db/migration.integration.test.ts) — see vitest.integration.config.ts.
    - container: postgres
      image: postgres:16
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: enterprise_billing
      ports:
        - 5432:5432

variables:
  - group: um30-infra
  - name: imageRepository
    value: enterprise-billing-app

stages:
  # ---------------------------------------------------------------------
  - stage: build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: build
        displayName: Type check, lint, format, env-schema smoke
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node 22

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: $(Pipeline.Workspace)/.npm
            displayName: Cache npm packages

          - script: npm ci --cache $(Pipeline.Workspace)/.npm
            displayName: Install dependencies

          - script: npm run typecheck
            displayName: Type check (tsc --noEmit)

          - script: npm run lint
            displayName: Lint (ESLint incl. import boundaries)

          - script: npm run format:check
            displayName: Format check (Prettier)

          - script: npm run validate:env
            displayName: Zod env-schema smoke (lib/config.ts against .env.example)

  # ---------------------------------------------------------------------
  - stage: test_scan
    displayName: Test + SAST
    dependsOn: build
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: test_scan
        displayName: Jest/Vitest + Semgrep SAST
        services:
          postgres: postgres
        variables:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterprise_billing
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node 22

          - script: npm ci
            displayName: Install dependencies

          - script: |
              for i in $(seq 1 30); do
                if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; then
                  echo "Postgres is reachable on localhost:5432."
                  exit 0
                fi
                sleep 1
              done
              echo "Postgres not reachable on localhost:5432 after 30 attempts." >&2
              exit 1
            displayName: Wait for Postgres service

          # rm13-spec D1/Implementation §1 — makes the rm06-rm12 DB-gated
          # rating guardrail suites (`tests/rating/*.integration.test.ts`)
          # actually RUN against the live Postgres service above, instead of
          # silently skipping via their own `describe.skipIf(!pythonReady)`
          # guard (every prior rm06-rm12 authoring session lacked a
          # `python3`+deps environment — see ratemgmt-progress-tracker.md's
          # repeated "not run this session" notes). No `continueOnError`
          # here: `requirements.txt` is now a fully `uv pip compile
          # --generate-hashes`'d lock proven to install cleanly (see the
          # `containerize_workflow_engine` Docker build), so a failure here is
          # a real regression, not expected noise — letting it continue
          # would silently fall back to the DB-gated suites' own skip
          # behaviour, making the "required" rm06-rm12 guardrails
          # unenforceable in CI. If a genuine app-only test path (no rating
          # changes) is ever needed, gate this step's `condition` on the
          # changed paths rather than reintroducing `continueOnError`.
          - script: |
              # `--break-system-packages`: current hosted ubuntu-latest images
              # ship a PEP 668 externally-managed system Python, which rejects a
              # bare system-wide `pip install` (and even `--user`) with
              # `error: externally-managed-environment`. The vitest DB-gated
              # suites shell out to `python3 -m runtime.*`, so the deps must land
              # on the default interpreter's path — install them into system
              # site-packages explicitly. The flag is a no-op on a non-managed
              # image, so it is safe either way.
              python3 -m pip install --break-system-packages --require-hashes -r workflow-management/worker/workflow-engine/requirements.txt
            displayName: Install workflow-engine Python runtime deps (rm13 — for real guardrail-suite runs)

          - script: npm run test
            displayName: Test (Vitest, incl. DB migration integration)

          # rm13-spec D4/Implementation §4 — the source-level half of "no
          # rating migration touches billing" (Inv #17/#18). Scans
          # db/migrations/*rating*.sql for a schema-qualified billing.*
          # reference outside a comment; fails the build on any match.
          - script: npm run check:rating-migration-boundary
            displayName: Rating migration-boundary check (no rating migration writes billing.*)

          # SAST — fails (non-zero exit) and blocks containerize on any
          # high/critical finding. `--error` makes Semgrep exit 1 on findings.
          # rm13-spec D5/Implementation §5 — `p/python` added so the scan
          # actually covers workflow-management/worker/workflow-engine/runtime/*.py, not just the
          # TS/JS app surface the original four configs target.
          - script: |
              docker run --rm \
                -v "$(System.DefaultWorkingDirectory):/src" \
                returntocorp/semgrep \
                semgrep scan --config p/typescript --config p/javascript --config p/nextjs \
                  --config p/python --config p/owasp-top-ten --config p/secrets --error /src
            displayName: SAST (Semgrep, incl. the rating engine's Python)

  # ---------------------------------------------------------------------
  - stage: containerize
    displayName: Containerize
    dependsOn: test_scan
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: build_and_push
        displayName: Build image, push to ACR
        steps:
          - script: |
              SHORT_SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              TAG="$(Build.BuildId)-$SHORT_SHA"
              echo "Image tag: $TAG"
              echo "##vso[task.setvariable variable=imageTag;isOutput=true]$TAG"
            name: setImageTag
            displayName: Compute image tag (BuildId-gitSHA)

          - task: AzureCLI@2
            inputs:
              azureSubscription: azure-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                IMAGE="$(ACR_NAME).azurecr.io/$(imageRepository):$(setImageTag.imageTag)"
                # ACR Tasks (az acr build) is blocked on this subscription type,
                # so build on the agent and push instead. Contributor on the RG
                # (inherited by the service connection's SP) grants the push.
                az acr login --name $(ACR_NAME)
                docker build \
                  --build-arg BUILD_VERSION=$(setImageTag.imageTag) \
                  -t "$IMAGE" \
                  .
                docker push "$IMAGE"
            displayName: docker build + push to ACR (agent-side; ACR Tasks unavailable)

  # ---------------------------------------------------------------------
  # rm04-spec Implementation §8 / verification item 25 — builds only the
  # worker image and lints its inputs; does NOT apply Bicep or deploy (no
  # stage in this pipeline applies main.bicep for the app either — that is
  # a manual/out-of-band step per the existing convention, and
  # deployRatingEngine defaults to false until the D0 process-runner spike
  # passes — see ratemgmt-progress-tracker.md). Runs in parallel with
  # `containerize`, not gated by it — the two images are independent.
  #
  # GATED by the buildRatingEngine parameter (default false): the Dockerfile
  # base image is a placeholder digest and requirements.txt is not yet fully
  # hashed, so `docker build` would fail. Automatic CI/PR runs therefore skip
  # this stage; it only runs when the pipeline is queued with
  # buildRatingEngine=true (after the D0 spike, once both placeholders are
  # resolved).
  - stage: containerize_workflow_engine
    displayName: Containerize (rating engine)
    dependsOn: test_scan
    # A custom condition replaces the implicit succeeded() gate on dependsOn,
    # so and(succeeded(), ...) keeps test_scan a hard prerequisite — never
    # build/push the worker image off a failed test_scan.
    condition: and(succeeded(), eq(${{ parameters.buildRatingEngine }}, true))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: lint_and_build
        displayName: Lint Dockerfile/Bicep, validate requirements hashes, build + push
        steps:
          - script: |
              set -euo pipefail
              # requirements.txt is a uv-compiled lock (D3): each requirement is
              # a `name==version \` line followed by one or more `--hash=sha256:`
              # continuation lines. Assert every requirement block carries at
              # least one hash. The Dockerfile's `uv pip install --require-hashes`
              # is the authoritative gate; this fails fast before the build.
              awk '
                function flush() { if (pkg != "" && !seen) { print "Unhashed requirement: " pkg > "/dev/stderr"; bad=1 } }
                /^[A-Za-z0-9._-]+[[:space:]]*==/ { flush(); pkg=$0; seen=0; next }
                /--hash=sha256:/ { seen=1 }
                END { flush(); if (bad) { print "requirements.txt has unhashed entries — failing build." > "/dev/stderr"; exit 1 } }
              ' workflow-management/worker/workflow-engine/requirements.txt
            displayName: Validate requirements.txt hashes

          - task: AzureCLI@2
            inputs:
              azureSubscription: azure-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az bicep build --file infra/bicep/modules/workflow-engine-container-app.bicep
                az bicep build --file infra/bicep/modules/workflow-engine-storage.bicep
                az bicep build --file infra/bicep/modules/easy-auth.bicep
                az bicep build --file infra/bicep/main.bicep
                # entra-signin-diagnostics.bicep is tenant-scoped (targetScope
                # = 'tenant') and deliberately NOT referenced by main.bicep —
                # see the file header and infra/docs/engine-access.md. Linted
                # here on its own so it stays build-hygiene-clean too.
                az bicep build --file infra/bicep/modules/entra-signin-diagnostics.bicep
            displayName: Lint workflow-engine Bicep (az bicep build)

          - script: |
              SHORT_SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              TAG="$(Build.BuildId)-$SHORT_SHA"
              echo "Rating engine image tag: $TAG"
              echo "##vso[task.setvariable variable=workflowEngineImageTag;isOutput=true]$TAG"
            name: setWorkflowEngineImageTag
            displayName: Compute image tag (BuildId-gitSHA)

          - task: AzureCLI@2
            inputs:
              azureSubscription: azure-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                IMAGE="$(ACR_NAME).azurecr.io/workflow-engine:$(setWorkflowEngineImageTag.workflowEngineImageTag)"
                az acr login --name $(ACR_NAME)
                docker build -t "$IMAGE" workflow-management/worker/workflow-engine
                docker push "$IMAGE"
            displayName: docker build + push worker image to shared ACR

  # ---------------------------------------------------------------------
  # rm06-spec D2 / Implementation §6 — flows deployed from git via the
  # `kestra` CLI, never edited in the Kestra UI (code-standards §3.1). Runs
  # the SAME pinned Kestra image as the worker (workflow-management/worker/workflow-engine/
  # Dockerfile) so `flow validate`/`flow namespace update` always matches the
  # deployed engine's version.
  #
  # GATED by deployRatingFlows (default false) AND merge-to-main only (D2 says
  # "on merge to main" — a PR validation run must never push flows). Depends
  # on test_scan, NOT containerize_workflow_engine: flows deploy independently of
  # the worker image (see below), and containerize_workflow_engine is itself
  # gated by buildRatingEngine (default false), so depending on it would make a
  # normal deployRatingFlows run block on a skipped stage — succeeded() treats
  # a skipped dependency as not-succeeded, so the deploy would never fire in
  # any run that does not also rebuild the image. test_scan is the last stage
  # common to every run; a skipped containerize_workflow_engine is permitted.
  #
  # UNRESOLVED, flagged rather than assumed (mirrors the D0 caveat style used
  # throughout rm04/rm05): (1) exact `kestra` CLI flag names/auth flags below
  # are the spec's literal `kestra flow validate` / `kestra flow namespace
  # update rating ./flows` (rm06-spec D2, Implementation §6) — NOT yet run
  # against a real engine; confirm during the D0 spike alongside the other
  # kestra.yml property-name caveats. (2) NETWORK REACHABILITY from this
  # hosted ADO agent to the Kestra webserver is the open item every other
  # stage in this pipeline avoids by going through the Azure Resource Manager
  # control plane instead of the app's own HTTP endpoint (see the `deploy`
  # stage's smoke-test comment on why it can't curl the app directly). The
  # rating engine's ingress is internal-only by default (rm04 D8) or
  # Easy-Auth-gated external (rm05, `unauthenticatedClientAction:
  # RedirectToLoginPage`) once deployed — neither is obviously reachable by a
  # non-interactive CLI call from a Microsoft-hosted agent. Resolving this
  # (self-hosted agent inside the VNet, VNet-integrated hosted agent, or an
  # Easy-Auth exception path for this one client) is infrastructure work
  # outside rm06's boundary (flows/**) and is NOT solved here — see
  # ratemgmt-progress-tracker.md Open Questions.
  - stage: deploy_workflow_flows
    displayName: Deploy workflow flows (all functions → their namespaces)
    dependsOn: test_scan
    # succeeded() here refers to test_scan (the sole dependency) — it must have
    # passed. containerize_workflow_engine is intentionally not a dependency, so a
    # skipped worker-image build (buildRatingEngine=false) never blocks a flow
    # deploy.
    condition: >
      and(
        succeeded(),
        eq(${{ parameters.deployRatingFlows }}, true),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: deploy_flows
        displayName: Validate + deploy flows/** via the kestra CLI
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: azure-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Same pinned digest as workflow-management/worker/workflow-engine/Dockerfile — the
                # CLI that validates/deploys a flow should be the same
                # release that runs it.
                KESTRA_IMAGE="kestra/kestra:v1.3.35@sha256:0b880e20e403ef635a6bc7e9e72786c7a6dde143858723449dc57500830868e2"

                ENGINE_FQDN=$(az containerapp show \
                  --name "$(RATING_ENGINE_CONTAINERAPP_NAME)" \
                  --resource-group "$(RESOURCE_GROUP)" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)

                # Read live from Key Vault (D2's "authenticated with the
                # Basic Auth credential from Key Vault") rather than a
                # pipeline secret variable, so there is exactly one place
                # this password is stored. NOTE: it is still passed to the CLI
                # as a `--user user:password` argument below, which puts it on
                # the container's argument vector (visible in a process listing
                # on the agent) — weaker than an env var. `set -x` is not
                # enabled, so it is not echoed to the pipeline log. Passing it
                # via `docker run -e` + a kestra env var is the stronger form;
                # confirm the CLI's env-var name during the D0 spike (same
                # unconfirmed-flag caveat as below).
                BASIC_AUTH_PASSWORD=$(az keyvault secret show \
                  --vault-name "$(KEYVAULT_NAME)" \
                  --name kestra-basic-auth-password \
                  --query value -o tsv)

                # wfm01 §7b — deploy EVERY function's flows to its namespace on
                # the collapsed engine, idempotently. Function dir → namespace:
                #   rating-engine        → rating   (real flows)
                #   bill-run-processor   → billrun  (# STUB template shells)
                #   bill-run-distributor → billrun  (# STUB template shells)
                #
                # `--no-delete`: `flow namespace update` reconciles the whole
                # namespace to the input directory and, by default, DELETES
                # flows on the engine that are absent from /flows. A partial
                # checkout, a sparse-checkout misconfig, or a future refactor
                # that drops a file would then silently remove a live flow
                # (e.g. log-sweep) from production with a green pipeline.
                # `--no-delete` makes the deploy additive/upsert-only.
                # UNCONFIRMED against v1.3.35 (same caveat class as the other
                # kestra CLI flags — verify during the D0 spike); if the flag
                # name differs, the intent is "never delete a server-side flow
                # missing from the checkout".
                # Username matches KESTRA_SERVER_BASIC_AUTH_USERNAME in
                # workflow-engine-container-app.bicep — CONFIRMED live (D0,
                # 2026-09-02): Kestra 1.3.35 requires this to be a valid
                # email address or it rejects the whole Basic Auth config at
                # startup, leaving no credential active at all. Keep the two
                # in lockstep.
                # The image's default entrypoint is `exec /app/kestra "$@"`, so
                # the CLI verb is `flow ...` — a leading literal `kestra` becomes a
                # bogus first arg ("Unmatched argument at index 0: 'kestra'").
                # NOTE: standalone `flow validate` is DEPRECATED in v1.3.35 and
                # connects to a server (not an offline file check), so it is not
                # used — `flow namespace update --server` validates server-side on
                # ingest and rejects an invalid flow.
                deploy_fn() {  # $1 = flow dir under workflow-management/flows, $2 = namespace
                  local dir="$(System.DefaultWorkingDirectory)/workflow-management/flows/$1"
                  docker run --rm -v "${dir}:/flows" "$KESTRA_IMAGE" \
                    flow namespace update "$2" /flows \
                      --no-delete \
                      --server "https://${ENGINE_FQDN}" \
                      --user "rating-ops@example.invalid:${BASIC_AUTH_PASSWORD}"
                }

                # Rating flows are real (function root); each bill-run function's
                # deployable placeholder is the shell under local-dev/ (the
                # *.template.yml at the bill-run root is a non-deployable contract
                # doc — tasks omit `type:` — and `kestra flow` does not recurse).
                deploy_fn rating-engine                  rating
                deploy_fn bill-run-processor/local-dev   billrun
                deploy_fn bill-run-distributor/local-dev billrun
            displayName: kestra flow namespace update — all functions (D2)

  # ---------------------------------------------------------------------
  # rm13-spec D2/Implementation §2 — test #15 (no-per-record-fan-out), the
  # one guardrail test that needs a REAL Kestra execution rather than a
  # direct `python3 -m runtime.*` shell-out. Stands up rm04 D9's local dev
  # stack (Postgres + Kestra + Azurite via docker-compose.dev.yml) INSIDE
  # this CI agent (a disposable, throwaway engine — never the deployed one),
  # deploys flows/** to it, drops a 50,000-record fixture into the bind-
  # mounted landing/ directory, and asserts the resulting execution's
  # taskRunList count via the Kestra REST API
  # (tests/rating/rm13-no-fan-out.integration.test.ts's live-engine describe).
  #
  # GATED by runRatingFanoutGate (default false) — same conservative-gate
  # precedent as buildRatingEngine/deployRatingFlows: rm04 D0's process-
  # runner spike has not passed, and every property/flag/plugin-id this
  # stage exercises (kestra.yml's storage config, the landing file trigger,
  # the kestra CLI's flags) is UNCONFIRMED against the pinned v1.3.35 image
  # in an actual CI environment (only ever run once, locally, per the
  # 2026-09-01 dated entry in ratemgmt-progress-tracker.md — never inside
  # this pipeline). Queue manually once that spike passes.
  - stage: rating_fanout_gate
    displayName: Rating ship gate — no-per-record fan-out (rm13 test #15)
    dependsOn: test_scan
    condition: and(succeeded(), eq(${{ parameters.runRatingFanoutGate }}, true))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: fanout_test
        displayName: Local Kestra engine + the 50,000-record fixture
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node 22

          - script: npm ci
            displayName: Install dependencies

          - script: |
              set -euo pipefail
              cp workflow-management/dev/.env.example workflow-management/dev/.env
              docker compose -f docker-compose.dev.yml -f workflow-management/dev/docker-compose.dev.yml up -d
            displayName: Start the local Postgres + Kestra dev stack (rm04 D9)

          - script: |
              set -euo pipefail
              # Poll the webserver/API port (rm04's dev compose maps it to
              # 8085 — the management port used for ACA health probes is
              # NOT published to the host by the dev compose file). Any HTTP
              # response (even 401) means the engine process is up; a
              # connection failure means it is not.
              #
              # `-s` WITHOUT `-f`: Basic Auth is enabled (kestra.yml), so this
              # endpoint answers 401 unauthenticated — which IS the "up" signal.
              # `curl -f` exits non-zero and suppresses `%{http_code}` on any
              # HTTP >= 400, so the grep would never match and this loop could
              # only ever pass on a 2xx/3xx the auth-gated API never returns —
              # timing out against a perfectly healthy engine.
              for i in $(seq 1 60); do
                if curl -s -o /dev/null -w '%{http_code}' http://localhost:8085/api/v1/executions/search 2>/dev/null | grep -qE '^[0-9]+$'; then
                  echo "Kestra engine is responding on :8085."
                  exit 0
                fi
                sleep 5
              done
              echo "Kestra engine did not respond on :8085 within 5 minutes." >&2
              # The engine runs in the `workflow-engine` compose service (the
              # overlay's Kestra container) — there is no service named `kestra`.
              docker compose -f docker-compose.dev.yml -f workflow-management/dev/docker-compose.dev.yml logs workflow-engine || true
              exit 1
            displayName: Wait for the local Kestra engine

          - script: |
              set -euo pipefail
              # Same pinned digest + mechanism as the deploy_workflow_flows
              # stage above, targeting the disposable LOCAL engine instead
              # of a deployed one.
              KESTRA_IMAGE="kestra/kestra:v1.3.35@sha256:0b880e20e403ef635a6bc7e9e72786c7a6dde143858723449dc57500830868e2"
              source workflow-management/dev/.env
              # CLI verb is `flow ...` (default entrypoint execs /app/kestra "$@");
              # a leading literal `kestra` is rejected as an unmatched argument.
              # (Standalone `flow validate` is deprecated/server-connecting in
              # v1.3.35 — `namespace update` validates server-side on ingest.)
              docker run --rm --network host \
                -v "$(System.DefaultWorkingDirectory)/workflow-management/flows/rating-engine:/flows" \
                "$KESTRA_IMAGE" \
                flow namespace update rating /flows \
                  --no-delete \
                  --server "http://localhost:8085" \
                  --user "${KESTRA_SERVER_BASIC_AUTH_USERNAME}:${KESTRA_SERVER_BASIC_AUTH_PASSWORD}"
            displayName: Deploy flows/** to the local engine (rm06 D2 mechanism)

          - script: |
              set -euo pipefail
              source workflow-management/dev/.env
              export KESTRA_URL="http://localhost:8085"
              export KESTRA_BASIC_AUTH_USER="$KESTRA_SERVER_BASIC_AUTH_USERNAME"
              export KESTRA_BASIC_AUTH_PASSWORD="$KESTRA_SERVER_BASIC_AUTH_PASSWORD"
              export RATING_LANDING_HOST_DIR="$(System.DefaultWorkingDirectory)/workflow-management/dev/landing"
              export RATING_RAN_USAGE_CHUNK_SIZE="10000"
              npx vitest run --config vitest.integration.config.ts \
                tests/rating/rm13-no-fan-out.integration.test.ts
            displayName: Run rm13 test #15 against the live local engine

          - script: |
              docker compose -f docker-compose.dev.yml -f workflow-management/dev/docker-compose.dev.yml down -v
            condition: always()
            displayName: Tear down the local dev stack

  # ---------------------------------------------------------------------
  - stage: migrate
    displayName: Migrate (no traffic shift)
    dependsOn: containerize
    variables:
      imageTag: $[ stageDependencies.containerize.build_and_push.outputs['setImageTag.imageTag'] ]
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: run_migrations
        displayName: Run drizzle-kit migrate as a Container Apps Job
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: azure-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # lib/config.ts validates the FULL env schema at import, and
                # db/migrate.ts imports it. The Job never serves auth, so
                # BETTER_AUTH_* are inert placeholders that only satisfy the
                # schema (.min(32)/.url()); the real secret is used by the app
                # revision (deploy stage), never here. Passed via a bash array
                # like the deploy stage — the old multi-line "--set-env-vars \"
                # continuation form silently dropped the plain VALUE entries,
                # leaving BETTER_AUTH_* empty and crashing the import (the
                # secretref entry survived, the plain values did not).
                #
                # NODE_OPTIONS=--conditions=react-server: lib/config.ts imports
                # "server-only", which THROWS under a plain `node ... tsx` run
                # (the Job's command, baked in Bicep — the pipeline can't
                # override it). The Job never touches a client bundle, so we set
                # the react-server export condition (resolving "server-only" to
                # its no-op) via NODE_OPTIONS — the only knob reachable from
                # --set-env-vars. Mirrors the `validate:env` script's flag.
                JOB_ENV_VARS=(
                  "DATABASE_URL=secretref:pg-connection-string-migrate"
                  "BETTER_AUTH_SECRET=build_time_placeholder_secret_min_32_chars"
                  "BETTER_AUTH_URL=http://localhost:3000"
                  "NODE_OPTIONS=--conditions=react-server"
                )

                az containerapp job update \
                  --name $(CONTAINERAPP_JOB_NAME) \
                  --resource-group $(RESOURCE_GROUP) \
                  --image $(ACR_NAME).azurecr.io/$(imageRepository):$(imageTag) \
                  --set-env-vars "${JOB_ENV_VARS[@]}"

                EXECUTION_NAME=$(az containerapp job start \
                  --name $(CONTAINERAPP_JOB_NAME) \
                  --resource-group $(RESOURCE_GROUP) \
                  --query name -o tsv)

                echo "Migration job execution: $EXECUTION_NAME"

                # Poll for completion, 5-minute timeout (30 x 10s).
                for i in $(seq 1 30); do
                  STATUS=$(az containerapp job execution show \
                    --name $(CONTAINERAPP_JOB_NAME) \
                    --resource-group $(RESOURCE_GROUP) \
                    --job-execution-name "$EXECUTION_NAME" \
                    --query properties.status -o tsv)
                  echo "Status: $STATUS"
                  if [ "$STATUS" = "Succeeded" ]; then
                    exit 0
                  fi
                  if [ "$STATUS" = "Failed" ]; then
                    echo "Migration job failed — blocking deploy. App still serves the previous image."
                    exit 1
                  fi
                  sleep 10
                done

                echo "Migration job timed out after 5 minutes."
                exit 1
            displayName: Run app_migrate Container Apps Job (DATABASE_URL via Key Vault)

  # ---------------------------------------------------------------------
  - stage: deploy
    displayName: Deploy (blue-green)
    # Must depend on `containerize` directly, not just transitively via `migrate`:
    # stageDependencies only exposes output variables from stages listed in
    # dependsOn. Without `containerize` here, `imageTag` resolves empty and the
    # deploy fails with "argument --revision-suffix: expected one argument".
    dependsOn:
      - containerize
      - migrate
    variables:
      imageTag: $[ stageDependencies.containerize.build_and_push.outputs['setImageTag.imageTag'] ]
    pool:
      vmImage: ubuntu-latest
    jobs:
      - deployment: deploy_dev
        displayName: Deploy to dev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: azure-service-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      # Non-secret Microsoft SSO identifiers from the variable
                      # group. Appended only when present so an environment
                      # without SSO doesn't get an empty MICROSOFT_CLIENT_ID
                      # (which lib/config would read as present-but-empty and
                      # mis-enable the SSO path; absent → null → SSO off). The
                      # client SECRET stays a Key Vault secretref, below.
                      # SSO vars are set when present and explicitly REMOVED when
                      # absent. --set-env-vars only adds/updates the keys it lists;
                      # it never drops keys already on the app, so without an
                      # explicit --remove-env-vars a stale MICROSOFT_CLIENT_ID /
                      # ENTRA_TENANT_ID from a prior revision would carry forward
                      # and lib/config would mis-enable the SSO path after SSO is
                      # disabled. REMOVE_VARS collects the keys to strip.
                      ENV_VARS=(
                        "DATABASE_URL=secretref:pg-connection-string-app"
                        "BETTER_AUTH_SECRET=secretref:better-auth-secret"
                        "MICROSOFT_CLIENT_SECRET=secretref:microsoft-client-secret"
                      )
                      REMOVE_VARS=()
                      if [ -n "$(MICROSOFT_CLIENT_ID)" ]; then
                        ENV_VARS+=("MICROSOFT_CLIENT_ID=$(MICROSOFT_CLIENT_ID)")
                      else
                        REMOVE_VARS+=("MICROSOFT_CLIENT_ID")
                      fi
                      if [ -n "$(ENTRA_TENANT_ID)" ]; then
                        ENV_VARS+=("ENTRA_TENANT_ID=$(ENTRA_TENANT_ID)")
                      else
                        REMOVE_VARS+=("ENTRA_TENANT_ID")
                      fi

                      # 1. New revision at 0% traffic.
                      UPDATE_ARGS=(
                        --name "$(CONTAINERAPP_NAME)"
                        --resource-group "$(RESOURCE_GROUP)"
                        --image "$(ACR_NAME).azurecr.io/$(imageRepository):$(imageTag)"
                        --revision-suffix "$(imageTag)"
                        --set-env-vars "${ENV_VARS[@]}"
                      )
                      # Guard the expansion: under `set -u` an empty array must not
                      # be dereferenced, and a bare --remove-env-vars with no keys
                      # would error.
                      if [ ${#REMOVE_VARS[@]} -gt 0 ]; then
                        UPDATE_ARGS+=(--remove-env-vars "${REMOVE_VARS[@]}")
                      fi
                      az containerapp update "${UPDATE_ARGS[@]}"

                      # No explicit "new revision to 0%" step: in multiple-revision
                      # mode `az containerapp update` already creates the new
                      # revision at 0% and preserves the previous revision's weight.
                      # `traffic set --revision-weight latest=0` REPLACES the whole
                      # traffic map with just {latest:0} (sum 0) → fails with
                      # ContainerAppTrafficWeightIncorrectValue. The new revision is
                      # smoke-tested via its own FQDN below, then promoted to 100% —
                      # the only traffic write needed, which also heals any prior
                      # weight state.

                      # The revision name is deterministic: Container Apps names
                      # it "<app>--<suffix>", and the suffix is the $(imageTag)
                      # passed to --revision-suffix above. Target that exact
                      # revision instead of querying the newest by createdTime,
                      # which could pick an unrelated concurrent/manual revision.
                      NEW_REVISION="$(CONTAINERAPP_NAME)--$(imageTag)"

                      # 2. Readiness gate via the revision's healthState — the
                      #    authoritative signal from its readiness probe (internal
                      #    GET /api/health on the container). An external curl can't
                      #    be used: the app's ingress may enforce an IP allowlist
                      #    (ipSecurityRestrictions) that 403s the hosted agent, and
                      #    the probe runs inside the environment, bypassing ingress.
                      #    Poll up to ~3 min; fail fast if the revision goes Failed.
                      SMOKE_OK=false
                      for i in $(seq 1 18); do
                        HEALTH=$(az containerapp revision show \
                          --name $(CONTAINERAPP_NAME) \
                          --resource-group $(RESOURCE_GROUP) \
                          --revision "$NEW_REVISION" \
                          --query "properties.healthState" -o tsv)
                        RUNNING=$(az containerapp revision show \
                          --name $(CONTAINERAPP_NAME) \
                          --resource-group $(RESOURCE_GROUP) \
                          --revision "$NEW_REVISION" \
                          --query "properties.runningState" -o tsv)
                        echo "attempt $i: health=$HEALTH running=$RUNNING"
                        if [ "$HEALTH" = "Healthy" ]; then
                          SMOKE_OK=true
                          break
                        fi
                        if [ "$RUNNING" = "Failed" ]; then
                          echo "New revision entered Failed state."
                          break
                        fi
                        sleep 10
                      done

                      # 3/4. Shift traffic only on success; otherwise leave the
                      # previous revision at 100% and fail the stage.
                      if [ "$SMOKE_OK" = true ]; then
                        az containerapp ingress traffic set \
                          --name $(CONTAINERAPP_NAME) \
                          --resource-group $(RESOURCE_GROUP) \
                          --revision-weight "$NEW_REVISION=100"
                      else
                        echo "Smoke test failed — leaving previous revision at 100% traffic."
                        exit 1
                      fi
                  displayName: Create revision, migrate-gated smoke test, traffic shift

  # ---------------------------------------------------------------------
  - template: zap-scan-stage.yml

  # ---------------------------------------------------------------------
  # rm13-spec D5 — the DAST half of the ship gate, against the rating
  # engine itself (distinct from the app-targeting template above). See
  # zap-scan-workflow-engine-stage.yml's header for the full gating rationale
  # (scanRatingEngineDast, default false).
  - template: zap-scan-workflow-engine-stage.yml

  # ---------------------------------------------------------------------
  # bm21-spec §Implementation §3/Phase-2 review fold T3 — the billing
  # module's live-Kestra smoke gate (see the runBillrunLiveKestraSmoke
  # parameter above for the gating rationale). Unlike rating_fanout_gate,
  # this does NOT stand up a local/disposable engine — the real
  # `bill_run_processing` flow is built and deployed from a separate
  # workflow-management repo (workflow-management/flows/bill-run-processor/README.md), so this targets an
  # ALREADY-DEPLOYED engine + an already-migrated/seeded real database
  # (same "targets a deployed environment" shape as zap-scan-workflow-engine-
  # stage.yml, not rating_fanout_gate's local docker-compose stack).
  #
  # Required Key Vault secrets (KEYVAULT_NAME, um30-infra variable group):
  # `pg-connection-string-app` (the existing app-runtime DB connection — the
  # SAME database the deployed engine's `billrun_runtime` role connects to)
  # and two NOT YET CREATED secrets, `billrun-engine-url`/
  # `billrun-engine-auth` (the real BILLRUN_ENGINE_URL/_AUTH once a `billrun`
  # namespace is deployed — flagged, not assumed, same posture as
  # deploy_workflow_flows's `kestra-basic-auth-password` note above). Also
  # requires `db:seed-sample` to have already been run against that database
  # (out of band — this stage does not run it, to avoid silently reseeding a
  # shared environment on every smoke run).
  - stage: billrun_live_kestra_smoke
    displayName: Billing ship gate — live-Kestra smoke (bm21, trigger -> claim -> PROCESSED)
    dependsOn: test_scan
    condition: and(succeeded(), eq(${{ parameters.runBillrunLiveKestraSmoke }}, true))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: live_kestra_smoke
        displayName: Real billrun engine + scripts/billrun-live-kestra-smoke.ts
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node 22

          - script: npm ci
            displayName: Install dependencies

          - task: AzureCLI@2
            inputs:
              azureSubscription: azure-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                DATABASE_URL=$(az keyvault secret show \
                  --vault-name "$(KEYVAULT_NAME)" \
                  --name pg-connection-string-app \
                  --query value -o tsv)
                BILLRUN_ENGINE_URL=$(az keyvault secret show \
                  --vault-name "$(KEYVAULT_NAME)" \
                  --name billrun-engine-url \
                  --query value -o tsv)
                BILLRUN_ENGINE_AUTH=$(az keyvault secret show \
                  --vault-name "$(KEYVAULT_NAME)" \
                  --name billrun-engine-auth \
                  --query value -o tsv)
                echo "##vso[task.setvariable variable=DATABASE_URL;issecret=true]$DATABASE_URL"
                echo "##vso[task.setvariable variable=BILLRUN_ENGINE_URL;issecret=true]$BILLRUN_ENGINE_URL"
                echo "##vso[task.setvariable variable=BILLRUN_ENGINE_AUTH;issecret=true]$BILLRUN_ENGINE_AUTH"
            displayName: Fetch DATABASE_URL + BILLRUN_ENGINE_URL/_AUTH from Key Vault

          - script: npm run billrun:live-kestra-smoke
            env:
              DATABASE_URL: $(DATABASE_URL)
              BILLRUN_ENGINE_URL: $(BILLRUN_ENGINE_URL)
              BILLRUN_ENGINE_AUTH: $(BILLRUN_ENGINE_AUTH)
              # This script never serves HTTP or runs an auth flow — these two
              # only need to satisfy lib/config.ts's eager env-schema parse
              # (same reason tests/services/billing/trigger-run.service.test.ts
              # needs them set, per billmgmt-progress-tracker.md's Session
              # Notes), so a fixed placeholder is deliberate, not a shortcut
              # around a real secret.
              BETTER_AUTH_SECRET: "ci-placeholder-secret-min-32-characters-long"
              BETTER_AUTH_URL: "https://localhost"
            displayName: Trigger -> claim -> PROCESSED against the real billrun engine
