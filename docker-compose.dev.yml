# Local DEV stack: Next.js `next dev` with hot reload + PostgreSQL.
#
# Unlike docker-compose.yml (prod-like standalone image), this bind-mounts your
# source into a plain node container and runs the dev server, so edits on the
# host reload live. node_modules and .next live in named volumes (NOT on the
# host bind mount) so Linux-native binaries aren't clobbered by Windows ones.
#
#   docker compose -f docker-compose.dev.yml up          # db -> setup -> dev server
#   docker compose -f docker-compose.dev.yml down        # stop (keeps data)
#   docker compose -f docker-compose.dev.yml down -v      # stop and wipe DB + deps volumes
#
# Requires a local .env (cp .env.example .env, then set BETTER_AUTH_SECRET).
# The DATABASE_URL below overrides the localhost value in .env for in-container use.
#
# bm18-spec §Implementation §1 — draft PRO-FORMA rendering (Playwright/
# Chromium) needs the Debian-based runtime image (see the Dockerfile's
# `node:22-bookworm-slim` comment); this dev stack's `x-node` anchor still
# runs plain `node:22-alpine` for hot-reload dev, so `Preview PRO-FORMA →`
# will fail here with a missing-browser error (tracked as an environmental
# gap in billmgmt-progress-tracker.md's Outstanding section, same category as
# the never-applied migrations). For a bare host `npm run dev` (no Docker),
# run `npx playwright install chromium` once first.
#
# bm19-spec §Implementation §2/Dependencies — the `azurite` service below is
# the local stand-in for Azure Blob's `invoices/` container
# (services/billing/blob-store.ts resolves `BILLRUN_BLOB_CONNECTION_STRING`
# to it). Its well-known dev connection string/account/key below are
# Microsoft's published Azurite defaults (never real credentials) — see
# .env.example.

x-node: &node-common
  image: node:22-alpine
  working_dir: /app
  environment:
    DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_billing
  env_file:
    - .env
  volumes:
    - .:/app
    - node_modules:/app/node_modules # named volume shadows host node_modules
    - next_cache:/app/.next

services:
  # bm19-spec §Dependencies "Dev infra: Azurite". Emulates Azure Blob Storage
  # locally for the `invoices/` container — `setup`/`app` connect to it via
  # `BILLRUN_BLOB_CONNECTION_STRING` (.env.example), which targets this
  # service's blob endpoint (10000) using Azurite's published well-known dev
  # account/key. Azurite creates no containers on its own; `blob-store.ts`'s
  # connection-string path calls `createContainerIfNotExists` once per
  # process (dev/Azurite only — prod's Managed-Identity path relies on the
  # container already existing, the deploy-time prerequisite, spec
  # §Dependencies), so no separate provisioning step is needed here.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data

  db:
    build:
      context: ./infra/docker/postgres # Postgres 17 + pg_partman + pg_cron
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_billing
    ports:
      - "${DB_PORT:-5432}:5432" # override DB_PORT if 5432 is taken locally
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: install deps, migrate + seed admin + seed RBAC, then provision
  # pg_partman/pg_cron for core.audit_log. Source is mounted here, so unlike the
  # prod image this has the seed + bootstrap scripts. db:setup-partman must run
  # AFTER db:migrate creates the partitioned core.audit_log parent.
  setup:
    <<: *node-common
    command: sh -c "npm install && npm run db:setup && npm run db:setup-partman"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_billing
      # db:setup-partman needs a superuser/owner conn (CREATE EXTENSION, cron.*);
      # locally that's the same postgres role.
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_billing
      # lib/config.ts imports `server-only`, which throws under a plain node run.
      # The react-server export condition makes it a no-op — same fix the CI/CD
      # migrate job uses (bare `npm run db:migrate` doesn't carry the flag).
      NODE_OPTIONS: --conditions=react-server
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *node-common
    # -H 0.0.0.0 so the dev server is reachable through the published port.
    # WATCHPACK_POLLING makes file-change detection work across the Windows->
    # Linux bind mount (native inotify events don't cross it reliably).
    command: sh -c "npm run dev -- -H 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_billing
      WATCHPACK_POLLING: "true"
      # Overrides .env's host-facing `127.0.0.1:10000` default with the
      # in-network service name (bm19-spec §Implementation §2).
      BILLRUN_BLOB_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports:
      # Override with APP_PORT if 3000 is taken (e.g. a host `next dev`):
      #   APP_PORT=3001 docker compose -f docker-compose.dev.yml up
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      azurite:
        condition: service_started

volumes:
  pgdata:
  node_modules:
  next_cache:
  azurite_data:
